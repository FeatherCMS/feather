openapi: 3.0.0
info:
  title: Admin API
  version: 0.1.0
tags:
- name: ContactForms
  description: Manage contact forms, fields, and submissions.
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/admin/contact/form:
    get:
      tags:
      - ContactForms
      operationId: contactFormList
      responses:
        200:
          $ref: '#/components/responses/ContactFormListResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    post:
      tags:
      - ContactForms
      operationId: contactFormCreate
      requestBody:
        $ref: '#/components/requestBodies/ContactFormCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/ContactFormResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - ContactForms
      operationId: contactFormRemove
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/contact/form/query:
    post:
      tags:
      - ContactForms
      operationId: contactFormQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactFormQueryItemSearchRequestQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/ContactFormQueryItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/contact/form/{contactFormKey}:
    get:
      tags:
      - ContactForms
      operationId: contactFormGet
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      responses:
        200:
          $ref: '#/components/responses/ContactFormResponse'
        404:
          description: Contact form not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    put:
      tags:
      - ContactForms
      operationId: contactFormUpdate
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      requestBody:
        $ref: '#/components/requestBodies/ContactFormCreateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/ContactFormResponse'
        404:
          description: Contact form not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/contact/field:
    get:
      tags:
      - ContactForms
      operationId: contactFieldList
      parameters:
      - $ref: '#/components/parameters/FormFieldListFilterParameter'
      responses:
        200:
          $ref: '#/components/responses/FormFieldListResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    post:
      tags:
      - ContactForms
      operationId: contactFieldCreate
      requestBody:
        $ref: '#/components/requestBodies/FormFieldCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/FormFieldResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - ContactForms
      operationId: contactFieldRemove
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/contact/field/query:
    post:
      tags:
      - ContactForms
      operationId: contactFieldQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactFieldQueryItemSearchRequestQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/ContactFieldQueryItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/contact/field/{formFieldId}:
    get:
      tags:
      - ContactForms
      operationId: contactFieldGet
      parameters:
      - $ref: '#/components/parameters/FormFieldIdParameter'
      responses:
        200:
          $ref: '#/components/responses/FormFieldResponse'
        404:
          description: Contact field not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    patch:
      tags:
      - ContactForms
      operationId: contactFieldPatch
      parameters:
      - $ref: '#/components/parameters/FormFieldIdParameter'
      - $ref: '#/components/parameters/ContactFieldParametersUpdateMask'
      requestBody:
        $ref: '#/components/requestBodies/FormFieldPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/FormFieldResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        404:
          description: Contact field not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/contact/submission/query:
    post:
      tags:
      - ContactForms
      operationId: contactSubmissionQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactSubmissionQueryItemSearchRequestQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/ContactSubmissionQueryItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/contact/form/{contactFormKey}/submission:
    get:
      tags:
      - ContactForms
      operationId: contactFormSubmissionList
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      responses:
        200:
          $ref: '#/components/responses/ContactFormSubmissionListResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - ContactForms
      operationId: contactFormSubmissionRemove
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/contact/form/{contactFormKey}/submission/{contactFormSubmissionId}:
    get:
      tags:
      - ContactForms
      operationId: contactFormSubmissionGet
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      - $ref: '#/components/parameters/ContactSubmissionParametersID'
      responses:
        200:
          $ref: '#/components/responses/ContactFormSubmissionResponse'
        404:
          description: Contact form submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    patch:
      tags:
      - ContactForms
      operationId: contactFormSubmissionUpdate
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      - $ref: '#/components/parameters/ContactSubmissionParametersID'
      - $ref: '#/components/parameters/ContactSubmissionParametersUpdateMask'
      requestBody:
        $ref: '#/components/requestBodies/ContactFormSubmissionPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/ContactFormSubmissionResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        404:
          description: Contact form submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
components:
  schemas:
    ContactFormListSchema:
      type: array
      items:
        $ref: '#/components/schemas/ContactFormSchema'
    ContactFormSchema:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        successMessage:
          type: string
        failureMessage:
          type: string
        submitLabel:
          type: string
        redirectUrl:
          $ref: '#/components/schemas/ContactContentField'
        items:
          $ref: '#/components/schemas/FormFieldsSchema'
        mails:
          $ref: '#/components/schemas/SubmissionMailsSchema'
        createdAt:
          type: number
          format: double
        updatedAt:
          type: number
          format: double
      required:
      - key
      - name
      - successMessage
      - failureMessage
      - submitLabel
      - createdAt
      - updatedAt
    ContactContentField:
      type: string
    FormFieldsSchema:
      type: array
      items:
        $ref: '#/components/schemas/FormFieldSchema'
    FormFieldSchema:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        type:
          type: string
        label:
          type: string
        allowedValues:
          $ref: '#/components/schemas/ContactAllowedValuesSchema'
        isRequired:
          type: boolean
        position:
          type: integer
        createdAt:
          type: number
          format: double
        updatedAt:
          type: number
          format: double
      required:
      - id
      - key
      - type
      - label
      - isRequired
      - position
      - createdAt
      - updatedAt
    ContactAllowedValuesSchema:
      type: array
      items:
        type: string
    SubmissionMailsSchema:
      type: array
      items:
        $ref: '#/components/schemas/SubmissionMailSchema'
    SubmissionMailSchema:
      type: object
      properties:
        id:
          type: string
        mailFrom:
          type: string
        mailTo:
          type: string
        subject:
          type: string
        additionalHeaders:
          type: array
          items:
            type: string
        messageBody:
          type: string
        createdAt:
          type: number
          format: double
        updatedAt:
          type: number
          format: double
      required:
      - id
      - mailFrom
      - mailTo
      - subject
      - additionalHeaders
      - messageBody
      - createdAt
      - updatedAt
    DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/DefaultHTTPErrorContentSchema'
        trace:
          $ref: '#/components/schemas/ErrorTraceSchema'
      required:
      - error
    DefaultHTTPErrorContentSchema:
      type: object
      properties:
        message:
          type: string
        reason:
          type: string
      required:
      - message
      - reason
    ErrorTraceSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        reasons:
          $ref: '#/components/schemas/ErrorTraceReasonsSchema'
      required:
      - id
      - message
    ErrorTraceReasonsSchema:
      type: array
      items:
        $ref: '#/components/schemas/ErrorTraceReasonSchema'
    ErrorTraceReasonSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
      - id
      - message
    ContactFormCreateSchema:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        successMessage:
          $ref: '#/components/schemas/ContactContentField'
        failureMessage:
          $ref: '#/components/schemas/ContactContentField'
        submitLabel:
          $ref: '#/components/schemas/ContactContentField'
        redirectUrl:
          $ref: '#/components/schemas/ContactContentField'
        fieldIds:
          $ref: '#/components/schemas/ContactFieldIDsSchema'
        mails:
          $ref: '#/components/schemas/SubmissionMailInputsSchema'
      required:
      - key
      - name
      - successMessage
      - failureMessage
      - submitLabel
      - redirectUrl
    ContactFieldIDsSchema:
      type: array
      items:
        type: string
    SubmissionMailInputsSchema:
      type: array
      items:
        $ref: '#/components/schemas/SubmissionMailInputSchema'
    SubmissionMailInputSchema:
      type: object
      properties:
        mailFrom:
          type: string
        mailTo:
          type: string
        subject:
          type: string
        additionalHeaders:
          $ref: '#/components/schemas/ContactAdditionalHeadersSchema'
        messageBody:
          type: string
      required:
      - mailFrom
      - mailTo
      - subject
      - messageBody
    ContactAdditionalHeadersSchema:
      type: array
      items:
        type: string
    DeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            example: id1
      required:
      - ids
    ContactFormQueryItemSearchRequestQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - key
                - name
                example: key
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          example:
            search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
      required:
      - filters
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
    SearchPageSizeField:
      type: integer
      default: 20
      description: Results per page. Defaults to 20 when omitted; values below 1 are
        clamped to 1. Endpoint-specific maximums may apply.
      example: 20
    SearchPageNumberField:
      type: integer
      default: 1
      description: 1-based page number. Defaults to 1 when omitted; values below 1
        are clamped to 1.
      example: 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      example: asc
    SearchStringField:
      type: string
      example: foo
    ContactFormQueryItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/ContactFormQueryItemSearchResponseQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ContactFormQueryItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    ContactFormQueryItemSearchResponseQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchResponsePageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - key
                - name
                example: key
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          example:
            search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
      required:
      - page
      - filters
    SearchResponsePageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
    ContactFormQueryItemSchema:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
      required:
      - id
      - key
      - name
    ContactFormKeyField:
      type: string
    FormFieldListSchema:
      type: array
      items:
        $ref: '#/components/schemas/FormFieldSchema'
    FormFieldCreateSchema:
      type: object
      properties:
        key:
          type: string
        type:
          type: string
        label:
          type: string
        allowedValues:
          $ref: '#/components/schemas/ContactAllowedValuesSchema'
        isRequired:
          $ref: '#/components/schemas/ContactRequiredField'
        position:
          $ref: '#/components/schemas/FormFieldPositionField'
      required:
      - key
      - type
      - label
    ContactRequiredField:
      type: boolean
    FormFieldPositionField:
      type: integer
    ContactFieldQueryItemSearchRequestQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - key
                - label
                - type
                - isRequired
                example: key
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          example:
            search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
            form:
              $ref: '#/components/schemas/ContactFormKeyField'
      required:
      - filters
    ContactFieldQueryItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/ContactFieldQueryItemSearchResponseQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ContactFieldQueryItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    ContactFieldQueryItemSearchResponseQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchResponsePageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - key
                - label
                - type
                - isRequired
                example: key
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          example:
            search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
            form:
              $ref: '#/components/schemas/ContactFormKeyField'
      required:
      - page
      - filters
    ContactFieldQueryItemSchema:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        type:
          type: string
        label:
          type: string
        isRequired:
          type: boolean
      required:
      - id
      - key
      - type
      - label
      - isRequired
    ContactIdField:
      type: string
    ContactFormFieldUpdateMask:
      type: string
      example: key,type,label,allowedValues,isRequired,position
    FormFieldPatchSchema:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/ContactKeyField'
        type:
          $ref: '#/components/schemas/ContactTypeField'
        label:
          $ref: '#/components/schemas/ContactLabelField'
        allowedValues:
          $ref: '#/components/schemas/ContactAllowedValuesSchema'
        isRequired:
          $ref: '#/components/schemas/ContactRequiredField'
        position:
          $ref: '#/components/schemas/FormFieldPositionField'
    ContactKeyField:
      type: string
    ContactTypeField:
      type: string
    ContactLabelField:
      type: string
    ContactSubmissionQueryItemSearchRequestQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
