openapi: 3.0.0
info:
  title: Admin API
  version: 0.1.0
tags:
- name: AnalyticsLogs
  description: Browse analytics logs.
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/admin/analytics/logs/filters:
    get:
      tags:
      - AnalyticsLogs
      operationId: analyticsLogFilters
      responses:
        200:
          $ref: '#/components/responses/AnalyticsLogFiltersResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/analytics/logs/overview:
    post:
      tags:
      - AnalyticsLogs
      operationId: analyticsLogOverview
      requestBody:
        $ref: '#/components/requestBodies/AnalyticsLogOverviewRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AnalyticsLogOverviewResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/analytics/logs/search:
    post:
      tags:
      - AnalyticsLogs
      operationId: analyticsLogSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsLogListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/AnalyticsLogListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/analytics/logs/{id}:
    get:
      tags:
      - AnalyticsLogs
      operationId: analyticsLogGet
      parameters:
      - $ref: '#/components/parameters/AnalyticsLogIdParameter'
      responses:
        200:
          $ref: '#/components/responses/AnalyticsLogDetailResponse'
        404:
          description: AnalyticsLog not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
components:
  schemas:
    AnalyticsLogFiltersSchema:
      type: object
      properties:
        search:
          $ref: '#/components/schemas/AnalyticsLogPathField'
        source:
          $ref: '#/components/schemas/AnalyticsLogSourceField'
        method:
          $ref: '#/components/schemas/AnalyticsLogMethodField'
        responseCode:
          $ref: '#/components/schemas/AnalyticsLogResponseCodeField'
    AnalyticsLogPathField:
      type: string
      example: /articles/hello-world/
    AnalyticsLogSourceField:
      type: string
      example: web_app
    AnalyticsLogMethodField:
      type: string
      example: GET
    AnalyticsLogResponseCodeField:
      type: integer
      example: 200
    AnalyticsLogOverviewQuerySchema:
      type: object
      properties:
        source:
          type: string
          example: web_app
        from:
          type: number
          format: double
          example: 1.717171717e+9
        to:
          type: number
          format: double
          example: 1.717171717e+9
      required:
      - source
      - from
      - to
    AnalyticsLogOverviewSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/AnalyticsLogOverviewQuerySchema'
        kpis:
          $ref: '#/components/schemas/AnalyticsLogOverviewKPISchema'
        daily:
          $ref: '#/components/schemas/AnalyticsLogOverviewDailyListSchema'
        statusFamilies:
          $ref: '#/components/schemas/AnalyticsLogOverviewBreakdownListSchema'
        methods:
          $ref: '#/components/schemas/AnalyticsLogOverviewBreakdownListSchema'
        paths:
          $ref: '#/components/schemas/AnalyticsLogOverviewBreakdownListSchema'
        notFoundPaths:
          $ref: '#/components/schemas/AnalyticsLogOverviewBreakdownListSchema'
        serverErrorPaths:
          $ref: '#/components/schemas/AnalyticsLogOverviewBreakdownListSchema'
        referrers:
          $ref: '#/components/schemas/AnalyticsLogOverviewBreakdownListSchema'
        browsers:
          $ref: '#/components/schemas/AnalyticsLogOverviewBreakdownListSchema'
        operatingSystems:
          $ref: '#/components/schemas/AnalyticsLogOverviewBreakdownListSchema'
        deviceTypes:
          $ref: '#/components/schemas/AnalyticsLogOverviewBreakdownListSchema'
        languages:
          $ref: '#/components/schemas/AnalyticsLogOverviewBreakdownListSchema'
        regions:
          $ref: '#/components/schemas/AnalyticsLogOverviewBreakdownListSchema'
      required:
      - query
      - kpis
      - daily
      - statusFamilies
      - methods
      - paths
      - notFoundPaths
      - serverErrorPaths
      - referrers
      - browsers
      - operatingSystems
      - deviceTypes
      - languages
      - regions
    AnalyticsLogOverviewKPISchema:
      type: object
      properties:
        totalRequests:
          type: integer
          example: 123
        averageRequestsPerDay:
          type: number
          format: double
          example: 1.23e+2
        authenticatedRequests:
          type: integer
          example: 123
        notFoundRequests:
          type: integer
          example: 123
        clientErrorRequests:
          type: integer
          example: 123
        serverErrorRequests:
          type: integer
          example: 123
      required:
      - totalRequests
      - averageRequestsPerDay
      - authenticatedRequests
      - notFoundRequests
      - clientErrorRequests
      - serverErrorRequests
    AnalyticsLogOverviewDailyListSchema:
      type: array
      items:
        $ref: '#/components/schemas/AnalyticsLogOverviewDailyPointSchema'
    AnalyticsLogOverviewDailyPointSchema:
      type: object
      properties:
        bucket:
          type: number
          format: double
          example: 1.717171717e+9
        requests:
          type: integer
          example: 123
        notFoundRequests:
          type: integer
          example: 123
        clientErrorRequests:
          type: integer
          example: 123
        serverErrorRequests:
          type: integer
          example: 123
      required:
      - bucket
      - requests
      - notFoundRequests
      - clientErrorRequests
      - serverErrorRequests
    AnalyticsLogOverviewBreakdownListSchema:
      type: array
      items:
        $ref: '#/components/schemas/AnalyticsLogOverviewBreakdownItemSchema'
    AnalyticsLogOverviewBreakdownItemSchema:
      type: object
      properties:
        label:
          type: string
          example: chrome
        count:
          type: integer
          example: 123
        share:
          type: number
          format: double
          example: 1.23e+2
      required:
      - label
      - count
      - share
    AnalyticsLogListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - accountId
                - method
                - source
                - path
                - responseCode
                - ip
                - browserName
                - createdAt
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          properties:
            search:
              $ref: '#/components/schemas/AnalyticsLogPathField'
            source:
              $ref: '#/components/schemas/AnalyticsLogSourceField'
            method:
              $ref: '#/components/schemas/AnalyticsLogMethodField'
            responseCode:
              $ref: '#/components/schemas/AnalyticsLogResponseCodeField'
      required:
      - page
      - filters
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
    SearchPageSizeField:
      type: integer
      example: 20
    SearchPageNumberField:
      type: integer
      example: 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      example: asc
    AnalyticsLogListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/AnalyticsLogListItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AnalyticsLogListItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    AnalyticsLogListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/AnalyticsLogIdField'
        accountId:
          type: string
          example: account-01
        source:
          type: string
          example: web_app
        method:
          type: string
          example: GET
        path:
          type: string
          example: /articles/hello-world/
        responseCode:
          type: integer
          example: 200
        ip:
          type: string
          example: 203.0.113.10
        browserName:
          type: string
          example: Safari
        createdAt:
          type: number
          format: double
          example: 1.717171717e+9
      required:
      - id
      - accountId
      - source
      - method
      - path
      - responseCode
      - ip
      - browserName
      - createdAt
    AnalyticsLogIdField:
      type: string
      example: analytics-log-01
    AnalyticsLogDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/AnalyticsLogIdField'
        accountId:
          type: string
          example: account-01
        source:
          type: string
          example: web_app
        method:
          type: string
          example: GET
        url:
          type: string
          example: https://example.com/admin/analytics/logs/
        headers:
          type: string
          example: '{"accept":"application/json"}'
        ip:
          type: string
          example: 203.0.113.10
        path:
          type: string
          example: /articles/hello-world/
        referer:
          type: string
          example: https://example.com/admin/
        origin:
          type: string
          example: https://example.com
        acceptLanguage:
          type: string
          example: en-US,en;q=0.9
        userAgent:
          type: string
          example: Mozilla/5.0
        language:
          type: string
          example: en
        region:
          type: string
          example: US
        osName:
          type: string
          example: macOS
        osVersion:
          type: string
          example: '15.0'
        browserName:
          type: string
          example: Safari
        browserVersion:
          type: string
          example: '17.5'
        engineName:
          type: string
          example: WebKit
        engineVersion:
          type: string
          example: '617.1'
        deviceVendor:
          type: string
          example: Apple
        deviceType:
          type: string
          example: desktop
        deviceModel:
          type: string
          example: Mac
        cpu:
          type: string
          example: arm64
        responseCode:
          type: integer
          example: 200
        createdAt:
          type: number
          format: double
          example: 1.717171717e+9
        updatedAt:
          type: number
          format: double
          example: 1.717171717e+9
      required:
      - id
      - accountId
      - source
      - method
      - url
      - headers
      - ip
      - path
      - referer
      - origin
      - acceptLanguage
      - userAgent
      - language
      - region
      - osName
      - osVersion
      - browserName
      - browserVersion
      - engineName
      - engineVersion
      - deviceVendor
      - deviceType
      - deviceModel
      - cpu
      - responseCode
      - createdAt
      - updatedAt
  responses:
    AnalyticsLogFiltersResponse:
      description: AnalyticsLog filter response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnalyticsLogFiltersSchema'
    AnalyticsLogOverviewResponse:
      description: Analytics overview response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnalyticsLogOverviewSchema'
    AnalyticsLogListItemSearchSchemaSearchResponse:
      description: Search response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnalyticsLogListItemSearchSchema'
    AnalyticsLogDetailResponse:
      description: AnalyticsLog detail response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnalyticsLogDetailSchema'
  parameters:
    AnalyticsLogIdParameter:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AnalyticsLogIdField'
      description: Analytics log identifier
  requestBodies:
    AnalyticsLogOverviewRequestBody:
      description: Analytics overview query payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnalyticsLogOverviewQuerySchema'
      required: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
