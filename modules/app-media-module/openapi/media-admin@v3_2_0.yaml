components:
  schemas:
    MediaAssetDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MediaAssetIdField'
        folderId:
          type:
          - string
          - 'null'
        name:
          type: string
          examples:
          - cover-image.jpg
        slug:
          type: string
          examples:
          - cover-image
        slugPath:
          type: string
          examples:
          - posts/cover-image
        url:
          type: string
          examples:
          - /public/12/34/56789/originals/cover-image.jpg
        extension:
          type: string
          examples:
          - jpeg
        contentType:
          type: string
          examples:
          - image/jpeg
        sizeBytes:
          type: integer
          format: int64
        status:
          type: string
          examples:
          - ready
        title:
          type:
          - string
          - 'null'
        altText:
          type:
          - string
          - 'null'
        createdAt:
          type: number
          format: double
          examples:
          - 1.717171717e+9
        updatedAt:
          type: number
          format: double
          examples:
          - 1.717171717e+9
      required:
      - id
      - name
      - slug
      - slugPath
      - url
      - extension
      - contentType
      - sizeBytes
      - status
      - createdAt
      - updatedAt
      minProperties: 11
    MediaAssetIdField:
      type: string
      examples:
      - media_asset_1
    DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/DefaultHTTPErrorContentSchema'
        trace:
          $ref: '#/components/schemas/ErrorTraceSchema'
      required:
      - error
      minProperties: 1
    DefaultHTTPErrorContentSchema:
      type: object
      properties:
        message:
          type: string
        reason:
          type: string
      required:
      - message
      - reason
      minProperties: 2
    ErrorTraceSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        reasons:
          $ref: '#/components/schemas/ErrorTraceReasonsSchema'
      required:
      - id
      - message
      minProperties: 2
    ErrorTraceReasonsSchema:
      type: array
      items:
        $ref: '#/components/schemas/ErrorTraceReasonSchema'
      minItems: 0
      uniqueItems: false
    ErrorTraceReasonSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
      - id
      - message
      minProperties: 2
    DeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            examples:
            - id1
          minItems: 0
          uniqueItems: false
      required:
      - ids
      minProperties: 1
    MediaAssetNodeQueryItemSearchRequestQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - name
                - slugPath
                - extension
                - sizeBytes
                - status
                - title
                - createdAt
                - updatedAt
                examples:
                - id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
            minProperties: 2
          minItems: 0
          uniqueItems: false
        filters:
          type: object
          properties:
            search:
              type:
              - string
              - 'null'
            parentId:
              type:
              - string
              - 'null'
          minProperties: 0
      required:
      - filters
      minProperties: 1
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      minProperties: 0
    SearchPageSizeField:
      type: integer
      default: 20
      description: Results per page. Defaults to 20 when omitted; values below 1 are
        clamped to 1. Endpoint-specific maximums may apply.
      examples:
      - 20
    SearchPageNumberField:
      type: integer
      default: 1
      description: 1-based page number. Defaults to 1 when omitted; values below 1
        are clamped to 1.
      examples:
      - 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      examples:
      - asc
    MediaAssetNodeQueryItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/MediaAssetNodeQueryItemSearchResponseQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MediaAssetNodeQueryItemSchema'
              minItems: 0
              uniqueItems: false
            total:
              type: integer
              examples:
              - 123
          required:
          - items
          - total
          minProperties: 2
      required:
      - query
      - data
      minProperties: 2
    MediaAssetNodeQueryItemSearchResponseQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchResponsePageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
