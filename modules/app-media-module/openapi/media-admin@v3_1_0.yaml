openapi: 3.1.0
info:
  title: Admin API
  version: 0.1.0
tags:
- name: MediaAssets
  description: Manage media assets.
- name: MediaFolders
  description: Manage media folders.
- name: MediaVariants
  description: Manage media variants and their processing rules.
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/admin/media/assets:
    post:
      tags:
      - MediaAssets
      operationId: mediaAssetCreate
      requestBody:
        $ref: '#/components/requestBodies/MediaAssetCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/MediaAssetDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - MediaAssets
      operationId: mediaAssetNodeRemove
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/DeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/assets/list:
    post:
      tags:
      - MediaAssets
      operationId: mediaAssetList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaAssetNodeSearchItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/MediaAssetNodeSearchItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/assets/resolve:
    post:
      tags:
      - MediaAssets
      operationId: mediaAssetResolve
      requestBody:
        $ref: '#/components/requestBodies/MediaAssetResolveRequestBody'
      responses:
        200:
          $ref: '#/components/responses/MediaAssetResolveResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/assets/{mediaAssetId}:
    get:
      tags:
      - MediaAssets
      operationId: mediaAssetGet
      parameters:
      - $ref: '#/components/parameters/MediaAssetIdParameter'
      responses:
        200:
          $ref: '#/components/responses/MediaAssetDetailResponse'
        404:
          description: MediaAsset not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - MediaAssets
      operationId: mediaAssetUpdate
      parameters:
      - $ref: '#/components/parameters/MediaAssetIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/MediaAssetPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/MediaAssetDetailResponse'
        404:
          description: MediaAsset not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/assets/{mediaAssetId}/variants:
    get:
      tags:
      - MediaAssets
      operationId: mediaAssetVariantSearch
      parameters:
      - $ref: '#/components/parameters/MediaAssetIdParameter'
      responses:
        200:
          $ref: '#/components/responses/MediaAssetVariantListResponse'
        404:
          description: MediaAsset not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/folders:
    post:
      tags:
      - MediaFolders
      operationId: mediaFolderCreate
      requestBody:
        $ref: '#/components/requestBodies/MediaFolderCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/MediaFolderDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/folders/list:
    post:
      tags:
      - MediaFolders
      operationId: mediaFolderList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaFolderListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/MediaFolderListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/folders/{mediaFolderId}:
    get:
      tags:
      - MediaFolders
      operationId: mediaFolderGet
      parameters:
      - $ref: '#/components/parameters/MediaFolderIdParameter'
      responses:
        200:
          $ref: '#/components/responses/MediaFolderDetailResponse'
        404:
          description: MediaFolder not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - MediaFolders
      operationId: mediaFolderUpdate
      parameters:
      - $ref: '#/components/parameters/MediaFolderIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/MediaFolderPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/MediaFolderDetailResponse'
        404:
          description: MediaFolder not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/variants:
    post:
      tags:
      - MediaVariants
      operationId: mediaVariantCreate
      requestBody:
        $ref: '#/components/requestBodies/MediaVariantCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/MediaVariantDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - MediaVariants
      operationId: mediaVariantRemove
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/DeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/variants/list:
    post:
      tags:
      - MediaVariants
      operationId: mediaVariantList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaVariantListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/MediaVariantListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/variants/{mediaVariantId}:
    get:
      tags:
      - MediaVariants
      operationId: mediaVariantGet
      parameters:
      - $ref: '#/components/parameters/MediaVariantIdParameter'
      responses:
        200:
          $ref: '#/components/responses/MediaVariantDetailResponse'
        404:
          description: Media variant not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - MediaVariants
      operationId: mediaVariantUpdate
      parameters:
      - $ref: '#/components/parameters/MediaVariantIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/MediaVariantCreateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/MediaVariantDetailResponse'
        404:
          description: Media variant not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/variants/{mediaVariantId}/processors:
    post:
      tags:
      - MediaVariants
      operationId: mediaVariantProcessorCreate
      parameters:
      - $ref: '#/components/parameters/MediaVariantIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/MediaVariantProcessorCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/MediaVariantProcessorDetailResponse'
        404:
          description: Media variant not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - MediaVariants
      operationId: mediaVariantProcessorRemove
      parameters:
      - $ref: '#/components/parameters/MediaVariantIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/DeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/variants/{mediaVariantId}/processors/list:
    post:
      tags:
      - MediaVariants
      operationId: mediaVariantProcessorList
      parameters:
      - $ref: '#/components/parameters/MediaVariantIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaVariantProcessorListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/MediaVariantProcessorListItemSearchSchemaSearchResponse'
        404:
          description: Media variant not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/variants/{mediaVariantId}/processors/{mediaVariantProcessorId}:
    get:
      tags:
      - MediaVariants
      operationId: mediaVariantProcessorGet
      parameters:
      - $ref: '#/components/parameters/MediaVariantIdParameter'
      - $ref: '#/components/parameters/MediaVariantProcessorIdParameter'
      responses:
        200:
          $ref: '#/components/responses/MediaVariantProcessorDetailResponse'
        404:
          description: Media variant processor not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - MediaVariants
      operationId: mediaVariantProcessorUpdate
      parameters:
      - $ref: '#/components/parameters/MediaVariantIdParameter'
      - $ref: '#/components/parameters/MediaVariantProcessorIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/MediaVariantProcessorCreateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/MediaVariantProcessorDetailResponse'
        404:
          description: Media variant processor not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
components:
  schemas:
    MediaAssetCreateSchema:
      type: object
      properties:
        parentId:
          type:
          - string
          - 'null'
        fileName:
          type: string
          examples:
          - cover-image.jpg
        extension:
          type: string
          examples:
          - jpeg
        title:
          type:
          - string
          - 'null'
        altText:
          type:
          - string
          - 'null'
        data:
          type: string
          examples:
          - AQID
      required:
      - fileName
      - extension
      - data
      minProperties: 3
    MediaAssetDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MediaAssetIdField'
        folderId:
          type:
          - string
          - 'null'
        name:
          type: string
          examples:
          - cover-image.jpg
        slug:
          type: string
          examples:
          - cover-image
        slugPath:
          type: string
          examples:
          - posts/cover-image
        url:
          type: string
          examples:
          - /media/assets/media_asset_1/cover-image.jpg
        extension:
          type: string
          examples:
          - jpeg
        contentType:
          type: string
          examples:
          - image/jpeg
        sizeBytes:
          type: integer
          format: int64
        status:
          type: string
          examples:
          - ready
        title:
          type:
          - string
          - 'null'
        altText:
          type:
          - string
          - 'null'
        createdAt:
          type: number
          format: double
          examples:
          - 1.717171717e+9
        updatedAt:
          type: number
          format: double
          examples:
          - 1.717171717e+9
      required:
      - id
      - name
      - slug
      - slugPath
      - url
      - extension
      - contentType
      - sizeBytes
      - status
      - createdAt
      - updatedAt
      minProperties: 11
    MediaAssetIdField:
      type: string
      examples:
      - media_asset_1
    DeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            examples:
            - id1
          minItems: 0
          uniqueItems: false
        results:
          type: boolean
          examples:
          - true
        summary:
          type: boolean
          examples:
          - true
      required:
      - ids
      - results
      - summary
      minProperties: 3
    DeleteResponseSchema:
      type: object
      properties:
        results:
          $ref: '#/components/schemas/DeleteResultListSchema'
        summary:
          $ref: '#/components/schemas/DeleteSummarySchema'
      minProperties: 0
    DeleteResultListSchema:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            examples:
            - id1
          status:
            type: string
            enum:
            - deleted
            - not_found
            - forbidden
            examples:
            - deleted
        required:
        - id
        - status
        minProperties: 2
      minItems: 0
      uniqueItems: false
    DeleteSummarySchema:
      type: object
      properties:
        requested:
          type: integer
          examples:
          - 1
        deleted:
          type: integer
          examples:
          - 1
        omitted:
          type: integer
          examples:
          - 1
      required:
      - requested
      - deleted
      - omitted
      minProperties: 3
    MediaAssetNodeSearchItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - name
                - slugPath
                - extension
                - sizeBytes
                - status
                - title
                - createdAt
                - updatedAt
                examples:
                - id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
            minProperties: 2
          minItems: 0
          uniqueItems: false
        filters:
          type: object
          properties:
            search:
              type:
              - string
              - 'null'
            parentId:
              type:
              - string
              - 'null'
          minProperties: 0
      required:
      - page
      - filters
      minProperties: 2
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
      minProperties: 2
    SearchPageSizeField:
      type: integer
      examples:
      - 20
    SearchPageNumberField:
      type: integer
      examples:
      - 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      examples:
      - asc
    MediaAssetNodeSearchItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/MediaAssetNodeSearchItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MediaAssetNodeSearchItemSchema'
              minItems: 0
              uniqueItems: false
            total:
              type: integer
              examples:
              - 123
          required:
          - items
          - total
          minProperties: 2
      required:
      - query
      - data
      minProperties: 2
    MediaAssetNodeSearchItemSchema:
      type: object
      properties:
        kind:
          type: string
        file:
          $ref: '#/components/schemas/MediaAssetListItemSchema'
        folder:
          $ref: '#/components/schemas/MediaFolderListItemSchema'
      required:
      - kind
      minProperties: 1
    MediaAssetListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MediaAssetIdField'
        folderId:
          type:
          - string
          - 'null'
        name:
          type: string
          examples:
          - cover-image.jpg
        slug:
          type: string
          examples:
          - cover-image
        slugPath:
          type: string
          examples:
          - posts/cover-image
        url:
          type: string
          examples:
          - /media/assets/media_asset_1/cover-image.jpg
        extension:
          type: string
          examples:
          - jpeg
        contentType:
          type: string
          examples:
          - image/jpeg
        sizeBytes:
          type: integer
          format: int64
        status:
          type: string
          examples:
          - ready
        title:
          type:
          - string
          - 'null'
        altText:
          type:
          - string
          - 'null'
        createdAt:
          type: number
          format: double
          examples:
          - 1.717171717e+9
        updatedAt:
          type: number
          format: double
          examples:
          - 1.717171717e+9
      required:
      - id
      - name
      - slug
      - slugPath
      - url
      - extension
      - contentType
      - sizeBytes
      - status
      - createdAt
      - updatedAt
      minProperties: 11
    MediaFolderListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MediaFolderIdField'
        parentId:
          type:
          - string
          - 'null'
        name:
          type: string
          examples:
          - Posts
        slug:
          type: string
          examples:
          - posts
        slugPath:
          type: string
          examples:
          - blog/posts
        assetCount:
          type: integer
          examples:
          - 3
        totalSizeBytes:
          type: integer
          format: int64
        createdAt:
          type: number
          format: double
          examples:
          - 1.717171717e+9
        updatedAt:
          type: number
          format: double
          examples:
          - 1.717171717e+9
      required:
      - id
      - name
      - slug
      - slugPath
      - assetCount
      - totalSizeBytes
      - createdAt
      - updatedAt
      minProperties: 8
    MediaFolderIdField:
      type: string
      examples:
      - media_folder_blog_posts
    MediaAssetResolveRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            examples:
            - media_asset_1
          minItems: 0
          uniqueItems: false
        variants:
          $ref: '#/components/schemas/MediaAssetResolveVariantsField'
      required:
      - ids
      minProperties: 1
    MediaAssetResolveVariantsField:
      type: array
      items:
        type: string
        examples:
        - thumb
      minItems: 0
      uniqueItems: false
    MediaAssetResolveSchema:
      type: array
      items:
        $ref: '#/components/schemas/MediaAssetResolveItemSchema'
      minItems: 0
      uniqueItems: false
    MediaAssetResolveItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MediaAssetIdField'
        url:
          type: string
          examples:
          - /media/assets/media_asset_1/cover-image.jpg
        extension:
          type: string
          examples:
          - jpeg
        title:
          type:
          - string
          - 'null'
        altText:
          type:
          - string
          - 'null'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/MediaAssetResolveVariantSchema'
          minItems: 0
          uniqueItems: false
      required:
      - id
      - url
      - extension
      - variants
      minProperties: 4
    MediaAssetResolveVariantSchema:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/MediaAssetKeyField'
        name:
          type: string
          examples:
          - thumb
        url:
          type: string
          examples:
          - /media/assets/media_asset_1/cover-image.jpg
        extension:
          type: string
          examples:
          - jpeg
      required:
      - key
      - name
      - url
      - extension
      minProperties: 4
    MediaAssetKeyField:
      type: string
      examples:
      - preview
    MediaAssetPatchSchema:
      type: object
      properties:
        title:
          type:
          - string
          - 'null'
        altText:
          type:
          - string
          - 'null'
      minProperties: 0
    MediaAssetVariantListSchema:
      type: object
      properties:
        items:
          $ref: '#/components/schemas/MediaAssetVariantItemsField'
      required:
      - items
      minProperties: 1
    MediaAssetVariantItemsField:
      type: array
      items:
        $ref: '#/components/schemas/MediaAssetVariantListItemSchema'
      minItems: 0
      uniqueItems: false
    MediaAssetVariantListItemSchema:
      type: object
      properties:
        variantId:
          type: string
          examples:
          - variant_thumb
        name:
          type: string
          examples:
          - thumb
        extension:
          type: string
          examples:
          - jpeg
        url:
          type: string
          examples:
          - /media/assets/media_asset_1/cover-image.jpg
      required:
      - variantId
      - name
      - extension
      - url
      minProperties: 4
    MediaFolderCreateSchema:
      type: object
      properties:
        parentId:
          type:
          - string
          - 'null'
        name:
          type: string
          examples:
          - Posts
      required:
      - name
      minProperties: 1
    MediaFolderDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MediaFolderIdField'
        parentId:
          type:
          - string
          - 'null'
        name:
          type: string
          examples:
          - Posts
        slug:
          type: string
          examples:
          - posts
        slugPath:
          type: string
          examples:
          - blog/posts
        assetCount:
          type: integer
          examples:
          - 3
        totalSizeBytes:
          type: integer
          format: int64
        createdAt:
          type: number
          format: double
          examples:
          - 1.717171717e+9
        updatedAt:
          type: number
          format: double
          examples:
          - 1.717171717e+9
      required:
      - id
      - name
      - slug
      - slugPath
      - assetCount
      - totalSizeBytes
      - createdAt
      - updatedAt
      minProperties: 8
    MediaFolderListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - name
                - path
                - assetCount
                - totalSizeBytes
                - createdAt
                - updatedAt
                examples:
                - id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
            minProperties: 2
          minItems: 0
          uniqueItems: false
        filters:
          type: object
          properties:
            parentId:
              type:
              - string
              - 'null'
          minProperties: 0
      required:
      - page
      - filters
      minProperties: 2
    MediaFolderListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/MediaFolderListItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MediaFolderListItemSchema'
              minItems: 0
              uniqueItems: false
            total:
              type: integer
              examples:
              - 123
          required:
          - items
          - total
          minProperties: 2
      required:
      - query
      - data
      minProperties: 2
    MediaFolderPatchSchema:
      type: object
      properties:
        name:
          type: string
          examples:
          - Posts
      required:
      - name
      minProperties: 1
    MediaVariantCreateSchema:
      type: object
      properties:
        key:
          type: string
          examples:
          - preview
        name:
          type: string
          examples:
          - Preview
        isRequired:
          type: boolean
          examples:
          - true
        isActive:
          type: boolean
          examples:
          - true
      required:
      - key
      - name
      - isRequired
      - isActive
      minProperties: 4
    MediaVariantDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MediaVariantIdField'
        key:
          type: string
          examples:
          - preview
        name:
          type: string
          examples:
          - Preview
        isRequired:
          type: boolean
          examples:
          - true
        isActive:
          type: boolean
          examples:
          - true
        processors:
          type: array
          items:
            $ref: '#/components/schemas/MediaVariantProcessorListItemSchema'
