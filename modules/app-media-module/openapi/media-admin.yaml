openapi: 3.0.0
info:
  title: Admin API
  version: 0.1.0
tags:
- name: MediaAssets
  description: Manage media assets.
- name: MediaFolders
  description: Manage media folders.
- name: MediaProcessors
  description: Manage media processors.
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/admin/media/assets:
    post:
      tags:
      - MediaAssets
      operationId: mediaAssetCreate
      requestBody:
        $ref: '#/components/requestBodies/MediaAssetCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/MediaAssetDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - MediaAssets
      operationId: mediaAssetDelete
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/DeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/assets/search:
    post:
      tags:
      - MediaAssets
      operationId: mediaAssetSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaAssetListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/MediaAssetListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/assets/{mediaAssetId}:
    get:
      tags:
      - MediaAssets
      operationId: mediaAssetGet
      parameters:
      - $ref: '#/components/parameters/MediaAssetIdParameter'
      responses:
        200:
          $ref: '#/components/responses/MediaAssetDetailResponse'
        404:
          description: MediaAsset not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - MediaAssets
      operationId: mediaAssetUpdate
      parameters:
      - $ref: '#/components/parameters/MediaAssetIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/MediaAssetPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/MediaAssetDetailResponse'
        404:
          description: MediaAsset not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/assets/{mediaAssetId}/variants:
    get:
      tags:
      - MediaAssets
      operationId: mediaAssetVariantSearch
      parameters:
      - $ref: '#/components/parameters/MediaAssetIdParameter'
      responses:
        200:
          $ref: '#/components/responses/MediaAssetVariantListResponse'
        404:
          description: MediaAsset not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/folders:
    post:
      tags:
      - MediaFolders
      operationId: mediaFolderCreate
      requestBody:
        $ref: '#/components/requestBodies/MediaFolderCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/MediaFolderDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - MediaFolders
      operationId: mediaFolderDelete
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/DeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/folders/search:
    post:
      tags:
      - MediaFolders
      operationId: mediaFolderSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaFolderListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/MediaFolderListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/folders/{mediaFolderId}:
    get:
      tags:
      - MediaFolders
      operationId: mediaFolderGet
      parameters:
      - $ref: '#/components/parameters/MediaFolderIdParameter'
      responses:
        200:
          $ref: '#/components/responses/MediaFolderDetailResponse'
        404:
          description: MediaFolder not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - MediaFolders
      operationId: mediaFolderUpdate
      parameters:
      - $ref: '#/components/parameters/MediaFolderIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/MediaFolderPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/MediaFolderDetailResponse'
        404:
          description: MediaFolder not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/processors:
    post:
      tags:
      - MediaProcessors
      operationId: mediaProcessorCreate
      requestBody:
        $ref: '#/components/requestBodies/MediaProcessorCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/MediaProcessorDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - MediaProcessors
      operationId: mediaProcessorDelete
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/DeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/processors/search:
    post:
      tags:
      - MediaProcessors
      operationId: mediaProcessorSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaProcessorListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/MediaProcessorListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/media/processors/{mediaProcessorId}:
    get:
      tags:
      - MediaProcessors
      operationId: mediaProcessorGet
      parameters:
      - $ref: '#/components/parameters/MediaProcessorIdParameter'
      responses:
        200:
          $ref: '#/components/responses/MediaProcessorDetailResponse'
        404:
          description: MediaProcessor not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - MediaProcessors
      operationId: mediaProcessorUpdate
      parameters:
      - $ref: '#/components/parameters/MediaProcessorIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/MediaProcessorCreateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/MediaProcessorDetailResponse'
        404:
          description: MediaProcessor not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
components:
  schemas:
    MediaAssetCreateSchema:
      type: object
      properties:
        parentId:
          type: string
          nullable: true
        fileName:
          type: string
          example: cover-image.jpg
        type:
          type: string
          example: jpeg
        title:
          type: string
          nullable: true
        altText:
          type: string
          nullable: true
        data:
          type: string
          example: AQID
      required:
      - fileName
      - type
      - data
    MediaAssetDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MediaAssetIdField'
        folderId:
          type: string
          nullable: true
        storageKey:
          type: string
          example: media/assets/asset-1
        baseName:
          type: string
          example: asset-1
        type:
          type: string
          example: jpeg
        sizeBytes:
          type: integer
          format: int64
        status:
          type: string
          example: ready
        title:
          type: string
          nullable: true
        altText:
          type: string
          nullable: true
        createdAt:
          type: number
          format: double
          example: 1.717171717e+9
        updatedAt:
          type: number
          format: double
          example: 1.717171717e+9
      required:
      - id
      - storageKey
      - baseName
      - type
      - sizeBytes
      - status
      - createdAt
      - updatedAt
    MediaAssetIdField:
      type: string
      example: media_asset_1
    DeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            example: id1
        results:
          type: boolean
          example: true
        summary:
          type: boolean
          example: true
      required:
      - ids
      - summary
    DeleteResponseSchema:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: id1
              status:
                type: string
                enum:
                - deleted
                - not_found
                - forbidden
                example: deleted
            required:
            - id
            - status
        summary:
          type: object
          properties:
            requested:
              type: integer
              example: 1
            deleted:
              type: integer
              example: 1
            omitted:
              type: integer
              example: 1
          required:
          - requested
          - deleted
          - omitted
    MediaAssetListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - storageKey
                - type
                - sizeBytes
                - status
                - title
                - createdAt
                - updatedAt
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          properties:
            search:
              type: string
              nullable: true
            parentId:
              type: string
              nullable: true
      required:
      - page
      - filters
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
    SearchPageSizeField:
      type: integer
      example: 20
    SearchPageNumberField:
      type: integer
      example: 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      example: asc
    MediaAssetListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/MediaAssetListItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MediaAssetListItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    MediaAssetListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MediaAssetIdField'
        folderId:
          type: string
          nullable: true
        storageKey:
          type: string
          example: media/assets/asset-1
        baseName:
          type: string
          example: asset-1
        type:
          type: string
          example: jpeg
        sizeBytes:
          type: integer
          format: int64
        status:
          type: string
          example: ready
        title:
          type: string
          nullable: true
        altText:
          type: string
          nullable: true
        createdAt:
          type: number
          format: double
          example: 1.717171717e+9
        updatedAt:
          type: number
          format: double
          example: 1.717171717e+9
      required:
      - id
      - storageKey
      - baseName
      - type
      - sizeBytes
      - status
      - createdAt
      - updatedAt
    MediaAssetPatchSchema:
      type: object
      properties:
        title:
          type: string
          nullable: true
        altText:
          type: string
          nullable: true
    MediaAssetVariantListSchema:
      type: object
      properties:
        items:
          $ref: '#/components/schemas/MediaAssetVariantItemsField'
      required:
      - items
    MediaAssetVariantItemsField:
      type: array
      items:
        $ref: '#/components/schemas/MediaAssetVariantListItemSchema'
    MediaAssetVariantListItemSchema:
      type: object
      properties:
        variantId:
          type: string
          example: variant_thumb
        name:
          type: string
          example: thumb
        type:
          type: string
          example: processor
        storageKey:
          type: string
          example: media/assets/asset-1
      required:
      - variantId
      - name
      - type
      - storageKey
    MediaFolderCreateSchema:
      type: object
      properties:
        parentId:
          type: string
          nullable: true
        name:
          type: string
          example: Posts
      required:
      - name
    MediaFolderDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MediaFolderIdField'
        parentId:
          type: string
          nullable: true
        name:
          type: string
          example: Posts
        path:
          type: string
          example: blog/posts
        assetCount:
          type: integer
          example: 3
        totalSizeBytes:
          type: integer
          format: int64
        createdAt:
          type: number
          format: double
          example: 1.717171717e+9
        updatedAt:
          type: number
          format: double
          example: 1.717171717e+9
      required:
      - id
      - name
      - path
      - assetCount
      - totalSizeBytes
      - createdAt
      - updatedAt
    MediaFolderIdField:
      type: string
      example: media_folder_blog_posts
    MediaFolderListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - name
                - path
                - assetCount
                - totalSizeBytes
                - createdAt
                - updatedAt
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          properties:
            parentId:
              type: string
              nullable: true
      required:
      - page
      - filters
    MediaFolderListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/MediaFolderListItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MediaFolderListItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    MediaFolderListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MediaFolderIdField'
        parentId:
          type: string
          nullable: true
        name:
          type: string
          example: Posts
        path:
          type: string
          example: blog/posts
        assetCount:
          type: integer
          example: 3
        totalSizeBytes:
          type: integer
          format: int64
        createdAt:
          type: number
          format: double
          example: 1.717171717e+9
        updatedAt:
          type: number
          format: double
          example: 1.717171717e+9
      required:
      - id
      - name
      - path
      - assetCount
      - totalSizeBytes
      - createdAt
      - updatedAt
    MediaFolderPatchSchema:
      type: object
      properties:
        name:
          type: string
          example: Posts
      required:
      - name
    MediaProcessorCreateSchema:
      type: object
      properties:
        name:
          type: string
          example: thumb
        matchExtensions:
          type: string
          example: png,jpg,jpeg
        commandTemplate:
          type: string
          example: magick {input.fullname} -resize 64x64^ -gravity center -extent
            64x64 {output.fullname}
      required:
      - name
      - matchExtensions
      - commandTemplate
    MediaProcessorDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MediaProcessorIdField'
        name:
          type: string
          example: thumb
        matchExtensions:
          type: string
          example: png,jpg,jpeg
        commandTemplate:
          type: string
          example: magick {input.fullname} -resize 64x64^ -gravity center -extent
            64x64 {output.fullname}
        isRequired:
          type: boolean
          example: true
        isActive:
          type: boolean
          example: true
        createdAt:
          type: number
          format: double
          example: 1.717171717e+9
        updatedAt:
          type: number
          format: double
          example: 1.717171717e+9
      required:
      - id
      - name
      - matchExtensions
      - commandTemplate
      - isRequired
      - isActive
      - createdAt
      - updatedAt
    MediaProcessorIdField:
      type: string
      example: media_processor_image_thumb
    MediaProcessorListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - name
                - matchExtensions
                - commandTemplate
                - isRequired
                - isActive
                - createdAt
                - updatedAt
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
      required:
      - page
      - filters
    SearchStringField:
      type: string
      example: foo
    MediaProcessorListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/MediaProcessorListItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MediaProcessorListItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    MediaProcessorListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MediaProcessorIdField'
        name:
          type: string
          example: thumb
        matchExtensions:
          type: string
          example: png,jpg,jpeg
        commandTemplate:
          type: string
          example: magick {input.fullname} -resize 64x64^ -gravity center -extent
            64x64 {output.fullname}
        isRequired:
          type: boolean
          example: true
        isActive:
          type: boolean
          example: true
      required:
      - id
      - name
      - matchExtensions
      - commandTemplate
      - isRequired
      - isActive
  responses:
    MediaAssetDetailResponse:
      description: MediaAsset response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaAssetDetailSchema'
    DeleteResponse:
      description: delete response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteResponseSchema'
    MediaAssetListItemSearchSchemaSearchResponse:
      description: Search response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaAssetListItemSearchSchema'
    MediaAssetVariantListResponse:
      description: MediaAsset variant list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaAssetVariantListSchema'
    MediaFolderDetailResponse:
      description: MediaFolder response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaFolderDetailSchema'
    MediaFolderListItemSearchSchemaSearchResponse:
      description: Search response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaFolderListItemSearchSchema'
    MediaProcessorDetailResponse:
      description: MediaProcessor response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaProcessorDetailSchema'
    MediaProcessorListItemSearchSchemaSearchResponse:
      description: Search response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaProcessorListItemSearchSchema'
  parameters:
    MediaAssetIdParameter:
      name: mediaAssetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MediaAssetIdField'
      description: MediaAsset id
    MediaFolderIdParameter:
      name: mediaFolderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MediaFolderIdField'
      description: Media folder id
    MediaProcessorIdParameter:
      name: mediaProcessorId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MediaProcessorIdField'
      description: MediaProcessor id
  requestBodies:
    MediaAssetCreateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaAssetCreateSchema'
      required: true
    DeleteRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteRequestSchema'
      required: true
    MediaAssetPatchRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaAssetPatchSchema'
      required: true
    MediaFolderCreateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaFolderCreateSchema'
      required: true
    MediaFolderPatchRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaFolderPatchSchema'
      required: true
    MediaProcessorCreateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaProcessorCreateSchema'
      required: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
