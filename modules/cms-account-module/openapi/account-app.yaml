openapi: 3.0.0
info:
  title: Account App API
  version: 0.1.0
tags:
- name: Account
  description: Account endpoints.
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/account/register:
    post:
      tags:
      - Account
      operationId: accountRegister
      requestBody:
        $ref: '#/components/requestBodies/AccountRegisterRequestBody'
      responses:
        201:
          $ref: '#/components/responses/AccountAuthResponse'
  /api/v1/account/invitation/exchange:
    get:
      tags:
      - Account
      operationId: accountInvitationValidate
      parameters:
      - $ref: '#/components/parameters/InvitationValidateTokenParameter'
      responses:
        200:
          $ref: '#/components/responses/AccountInvitationValidationResponse'
    post:
      tags:
      - Account
      operationId: accountInvitationExchange
      requestBody:
        $ref: '#/components/requestBodies/AccountInvitationExchangeRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AccountAuthResponse'
  /api/v1/account/settings:
    get:
      tags:
      - Account
      operationId: accountSettingsGet
      responses:
        200:
          $ref: '#/components/responses/AccountSettingsResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/account/profile:
    get:
      tags:
      - Account
      operationId: accountProfileGet
      responses:
        200:
          $ref: '#/components/responses/AccountProfileResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    put:
      tags:
      - Account
      operationId: accountProfileUpdate
      requestBody:
        $ref: '#/components/requestBodies/AccountProfileUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AccountProfileResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
components:
  schemas:
    AccountRegisterSchema:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/AccountRegisterEmailField'
        password:
          $ref: '#/components/schemas/AccountRegisterPasswordField'
      required:
      - email
      - password
    AccountRegisterEmailField:
      type: string
      example: admin@example.com
    AccountRegisterPasswordField:
      type: string
      example: password
    AccountAuthResponseSchema:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserIdentityDetailSchema'
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        token:
          $ref: '#/components/schemas/AccountAuthTokenField'
      required:
      - user
      - roles
      - permissions
      - token
    UserIdentityDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserIdentityIDField'
        name:
          $ref: '#/components/schemas/UserIdentityNameField'
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
        roleIds:
          $ref: '#/components/schemas/UserIdentityRoleIDListSchema'
      required:
      - id
      - name
      - status
    UserIdentityIDField:
      type: string
      example: usr_a9x1f7Qk2m
    UserIdentityNameField:
      type: string
      example: Root User
    UserIdentityStatusField:
      type: string
      enum:
      - invited
      - active
      - suspended
      - deactivated
      - anonymized
      example: active
    UserIdentityRoleIDListSchema:
      type: array
      items:
        type: string
    AccountAuthTokenField:
      type: string
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    AccountAuthMagicLinkTokenField:
      type: string
      example: mgl_3XbY...
    AccountInvitationValidationSchema:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/AccountInvitationRegistrationEmailField'
        expiresAt:
          $ref: '#/components/schemas/AccountInvitationRegistrationExpiresAtField'
      required:
      - email
      - expiresAt
    AccountInvitationRegistrationEmailField:
      type: string
      example: user@example.com
    AccountInvitationRegistrationExpiresAtField:
      type: number
      format: double
      example: 1.76e+9
    AccountInvitationExchangeRequestSchema:
      type: object
      properties:
        token:
          $ref: '#/components/schemas/AccountAuthMagicLinkTokenField'
        password:
          $ref: '#/components/schemas/AccountRegisterPasswordField'
      required:
      - token
      - password
    AccountSettingsResponseSchema:
      type: object
      properties:
        language:
          $ref: '#/components/schemas/AccountSettingsLanguageField'
        timezone:
          $ref: '#/components/schemas/AccountSettingsTimezoneField'
        pageSize:
          $ref: '#/components/schemas/AccountSettingsPageSizeField'
      required:
      - language
      - timezone
      - pageSize
    AccountSettingsLanguageField:
      type: string
      example: en
    AccountSettingsTimezoneField:
      type: string
      example: UTC
    AccountSettingsPageSizeField:
      type: integer
      example: 20
    DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/DefaultHTTPErrorContentSchema'
        trace:
          $ref: '#/components/schemas/ErrorTraceSchema'
      required:
      - error
    DefaultHTTPErrorContentSchema:
      type: object
      properties:
        message:
          type: string
        reason:
          type: string
      required:
      - message
      - reason
    ErrorTraceSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        reasons:
          $ref: '#/components/schemas/ErrorTraceReasonsSchema'
      required:
      - id
      - message
    ErrorTraceReasonsSchema:
      type: array
      items:
        $ref: '#/components/schemas/ErrorTraceReasonSchema'
    ErrorTraceReasonSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
      - id
      - message
    AccountProfileResponseSchema:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        profileImageAssetId:
          type: string
    AccountProfileUpdateSchema:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        profileImageAssetId:
          type: string
  responses:
    AccountAuthResponse:
      description: Account authentication response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountAuthResponseSchema'
    AccountInvitationValidationResponse:
      description: Invitation validation response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountInvitationValidationSchema'
    AccountSettingsResponse:
      description: Account settings response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountSettingsResponseSchema'
    AccountProfileResponse:
      description: Account profile response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountProfileResponseSchema'
  parameters:
    InvitationValidateTokenParameter:
      name: token
      allowEmptyValue: true
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/AccountAuthMagicLinkTokenField'
      description: Invitation token
  requestBodies:
    AccountRegisterRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountRegisterSchema'
      required: true
    AccountInvitationExchangeRequestBody:
      description: Account invitation registration request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountInvitationExchangeRequestSchema'
      required: true
    AccountProfileUpdateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountProfileUpdateSchema'
      required: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
