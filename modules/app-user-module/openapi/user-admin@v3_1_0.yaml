openapi: 3.1.0
info:
  title: User Admin API
  version: 0.1.0
tags:
- name: UserIdentities
  description: User identities related endpoints.
- name: UserRoles
  description: Manage user roles.
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/admin/user/identities:
    get:
      tags:
      - UserIdentities
      operationId: userIdentityList
      parameters:
      - $ref: '#/components/parameters/IdentityParametersSearch'
      - $ref: '#/components/parameters/IdentityParametersRoleFilter'
      - $ref: '#/components/parameters/IdentityParametersListLimit'
      responses:
        200:
          $ref: '#/components/responses/UserIdentityListResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    post:
      tags:
      - UserIdentities
      summary: Create user identity
      description: Creates a user identity
      operationId: userIdentityPost
      requestBody:
        $ref: '#/components/requestBodies/UserIdentityCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/UserIdentityDetailResponse'
        404:
          description: A role assigned to the identity was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - UserIdentities
      operationId: userIdentityDelete
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/user/identities/query:
    post:
      tags:
      - UserIdentities
      operationId: userIdentityQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserIdentityQueryItemSearchRequestQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/UserIdentityQueryItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/user/identities/{userIdentityId}:
    get:
      tags:
      - UserIdentities
      operationId: userIdentityGet
      parameters:
      - $ref: '#/components/parameters/UserIdentityIdParameter'
      responses:
        200:
          $ref: '#/components/responses/UserIdentityDetailResponse'
        404:
          description: UserIdentity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    put:
      tags:
      - UserIdentities
      operationId: userIdentityPut
      parameters:
      - $ref: '#/components/parameters/UserIdentityIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/UserIdentityUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/UserIdentityDetailResponse'
        404:
          description: UserIdentity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    patch:
      tags:
      - UserIdentities
      operationId: userIdentityPatch
      parameters:
      - $ref: '#/components/parameters/UserIdentityIdParameter'
      - $ref: '#/components/parameters/IdentityParametersUpdateMask'
      requestBody:
        $ref: '#/components/requestBodies/UserIdentityPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/UserIdentityDetailResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        404:
          description: UserIdentity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/user/roles:
    get:
      tags:
      - UserRoles
      operationId: userRoleList
      parameters:
      - $ref: '#/components/parameters/RoleParametersSearch'
      - $ref: '#/components/parameters/RoleParametersListLimit'
      responses:
        200:
          $ref: '#/components/responses/UserRoleListResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    post:
      tags:
      - UserRoles
      operationId: userRolePost
      requestBody:
        $ref: '#/components/requestBodies/UserRoleRequestBody'
      responses:
        201:
          $ref: '#/components/responses/UserRoleDetailResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - UserRoles
      operationId: userRoleDelete
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/user/roles/query:
    post:
      tags:
      - UserRoles
      operationId: userRoleQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleQueryItemSearchRequestQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/UserRoleQueryItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/user/roles/{userRoleId}:
    get:
      tags:
      - UserRoles
      operationId: userRoleGet
      parameters:
      - $ref: '#/components/parameters/RoleParametersID'
      responses:
        200:
          $ref: '#/components/responses/UserRoleDetailResponse'
        404:
          description: UserRole not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    put:
      tags:
      - UserRoles
      operationId: userRolePut
      parameters:
      - $ref: '#/components/parameters/RoleParametersID'
      requestBody:
        $ref: '#/components/requestBodies/UserRoleUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/UserRoleDetailResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        404:
          description: UserRole not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    patch:
      tags:
      - UserRoles
      operationId: userRolePatch
      parameters:
      - $ref: '#/components/parameters/RoleParametersID'
      - $ref: '#/components/parameters/RoleParametersUpdateMask'
      requestBody:
        $ref: '#/components/requestBodies/UserRolePatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/UserRoleDetailResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        404:
          description: UserRole not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
components:
  schemas:
    UserIdentitySearch:
      type: string
      examples:
      - Ada
    UserRoleNameField:
      type: string
      examples:
      - manager
    UserIdentityListLimit:
      type: integer
      default: 20
      description: Maximum number of identities. Defaults to 20; values are clamped
        to 1-100.
      examples:
      - 100
    UserIdentityListSchema:
      type: array
      items:
        $ref: '#/components/schemas/UserIdentityListItemSchema'
      minItems: 0
      uniqueItems: false
    UserIdentityListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserIdentityIDField'
        name:
          $ref: '#/components/schemas/UserIdentityNameField'
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
        roles:
          $ref: '#/components/schemas/UserIdentityRoleNamesField'
      required:
      - id
      - name
      - status
      - roles
      minProperties: 4
    UserIdentityIDField:
      type: string
      examples:
      - usr_a9x1f7Qk2m
    UserIdentityNameField:
      type: string
      examples:
      - Root User
    UserIdentityStatusField:
      type: string
      enum:
      - invited
      - active
      - suspended
      - deactivated
      - anonymized
      examples:
      - active
    UserIdentityRoleNamesField:
      type: array
      items:
        $ref: '#/components/schemas/UserRoleNameField'
      minItems: 0
      uniqueItems: false
    DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/DefaultHTTPErrorContentSchema'
        trace:
          $ref: '#/components/schemas/ErrorTraceSchema'
      required:
      - error
      minProperties: 1
    DefaultHTTPErrorContentSchema:
      type: object
      properties:
        message:
          type: string
        reason:
          type: string
      required:
      - message
      - reason
      minProperties: 2
    ErrorTraceSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        reasons:
          $ref: '#/components/schemas/ErrorTraceReasonsSchema'
      required:
      - id
      - message
      minProperties: 2
    ErrorTraceReasonsSchema:
      type: array
      items:
        $ref: '#/components/schemas/ErrorTraceReasonSchema'
      minItems: 0
      uniqueItems: false
    ErrorTraceReasonSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
      - id
      - message
      minProperties: 2
    UserIdentityCreateSchema:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/UserIdentityNameField'
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
        roleIds:
          $ref: '#/components/schemas/UserIdentityRoleIdsField'
      required:
      - name
      minProperties: 1
    UserIdentityRoleIdsField:
      type: array
      items:
        $ref: '#/components/schemas/UserRoleIdField'
      minItems: 0
      uniqueItems: false
    UserRoleIdField:
      type: string
      examples:
      - role_manager
    UserIdentityDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserIdentityIDField'
        name:
          $ref: '#/components/schemas/UserIdentityNameField'
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
        roleIds:
          $ref: '#/components/schemas/UserIdentityRoleIDListSchema'
      required:
      - id
      - name
      - status
      minProperties: 3
    UserIdentityRoleIDListSchema:
      type: array
      items:
        type: string
      minItems: 0
      uniqueItems: false
    DeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            examples:
            - id1
          minItems: 0
          uniqueItems: false
      required:
      - ids
      minProperties: 1
    UserIdentityQueryItemSearchRequestQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                const: id
                examples:
                - id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
            minProperties: 2
          minItems: 0
          uniqueItems: false
        filters:
          type: object
          examples:
          - search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
            role:
              $ref: '#/components/schemas/UserRoleNameField'
          minProperties: 0
      required:
      - filters
      minProperties: 1
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      minProperties: 0
    SearchPageSizeField:
      type: integer
      default: 20
      description: Results per page. Defaults to 20 when omitted; values below 1 are
        clamped to 1. Endpoint-specific maximums may apply.
      examples:
      - 20
    SearchPageNumberField:
      type: integer
      default: 1
      description: 1-based page number. Defaults to 1 when omitted; values below 1
        are clamped to 1.
      examples:
      - 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      examples:
      - asc
    SearchStringField:
      type: string
      examples:
      - foo
    UserIdentityQueryItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/UserIdentityQueryItemSearchResponseQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UserIdentityQueryItemSchema'
              minItems: 0
              uniqueItems: false
            total:
              type: integer
              examples:
              - 123
          required:
          - items
          - total
          minProperties: 2
      required:
      - query
      - data
      minProperties: 2
    UserIdentityQueryItemSearchResponseQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchResponsePageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                const: id
                examples:
                - id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
            minProperties: 2
          minItems: 0
          uniqueItems: false
        filters:
          type: object
          examples:
          - search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
            role:
              $ref: '#/components/schemas/UserRoleNameField'
          minProperties: 0
      required:
      - page
      - filters
      minProperties: 2
    SearchResponsePageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
      minProperties: 2
    UserIdentityQueryItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserIdentityIDField'
        name:
          $ref: '#/components/schemas/UserIdentityNameField'
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
        roles:
          $ref: '#/components/schemas/UserIdentityRoleNamesField'
      required:
      - id
      - name
      - status
      - roles
      minProperties: 4
    UserIdentityUpdateSchema:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/UserIdentityNameField'
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
        roleIds:
          $ref: '#/components/schemas/UserIdentityRoleIdsField'
      minProperties: 0
    UserIdentityUpdateMask:
      type: string
      examples:
      - name,status,roleIds
    UserIdentityPatchSchema:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/UserIdentityNameField'
        roleIds:
          $ref: '#/components/schemas/UserIdentityRoleIdsField'
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
      minProperties: 0
    UserRoleSearch:
      type: string
      examples:
      - editor
    UserRoleListLimit:
      type: integer
      default: 20
      description: Maximum number of roles. Defaults to 20; values are clamped to
        1-100.
      examples:
      - 100
    UserRoleListSchema:
      type: array
      items:
        $ref: '#/components/schemas/UserRoleListItemSchema'
      minItems: 0
      uniqueItems: false
    UserRoleListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserRoleIdField'
        key:
          $ref: '#/components/schemas/UserRoleKeyField'
        name:
          $ref: '#/components/schemas/UserRoleNameField'
      required:
      - id
      - key
      minProperties: 2
    UserRoleKeyField:
      type: string
      examples:
      - editor
    UserRoleCreateSchema:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/UserRoleKeyField'
        name:
          $ref: '#/components/schemas/UserRoleNameField'
        notes:
          $ref: '#/components/schemas/UserRoleNotesField'
      required:
      - key
      minProperties: 1
    UserRoleNotesField:
      type: string
      examples:
      - Management role.
    UserRoleDetailSchema:
      type: object
      properties:
        id:
          type: string
          examples:
          - role_manager
        key:
          type: string
          examples:
          - editor
        name:
          $ref: '#/components/schemas/UserRoleNameField'
        notes:
          $ref: '#/components/schemas/UserRoleNotesField'
      required:
      - id
      - key
      minProperties: 2
    UserRoleQueryItemSearchRequestQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - name
                - notes
                examples:
                - id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
            minProperties: 2
          minItems: 0
          uniqueItems: false
        filters:
          type: object
          examples:
          - search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
          minProperties: 0
      required:
      - filters
      minProperties: 1
    UserRoleQueryItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/UserRoleQueryItemSearchResponseQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UserRoleQueryItemSchema'
              minItems: 0
              uniqueItems: false
            total:
              type: integer
              examples:
              - 123
          required:
          - items
          - total
          minProperties: 2
      required:
      - query
      - data
      minProperties: 2
    UserRoleQueryItemSearchResponseQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchResponsePageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - name
                - notes
                examples:
                - id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
            minProperties: 2
          minItems: 0
          uniqueItems: false
        filters:
          type: object
          examples:
          - search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
          minProperties: 0
      required:
      - page
      - filters
      minProperties: 2
    UserRoleQueryItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserRoleIdField'
        key:
          $ref: '#/components/schemas/UserRoleKeyField'
        name:
          $ref: '#/components/schemas/UserRoleNameField'
        notes:
          $ref: '#/components/schemas/UserRoleNotesField'
      required:
      - id
      - key
      minProperties: 2
    UserRoleUpdateSchema:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/UserRoleNameField'
        notes:
          $ref: '#/components/schemas/UserRoleNotesField'
      minProperties: 0
    UserRoleUpdateMask:
      type: string
      examples:
      - name,notes
    UserRolePatchSchema:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/UserRoleNameFieldNullable'
        notes:
          $ref: '#/components/schemas/UserRoleNotesFieldNullable'
      minProperties: 0
    UserRoleNameFieldNullable:
      type:
      - string
      - 'null'
      examples:
      - manager
    UserRoleNotesFieldNullable:
      type:
      - string
