openapi: 3.0.0
info:
  title: User Admin API
  version: 0.1.0
tags:
- name: UserIdentities
  description: User identities related endpoints.
- name: UserRoles
  description: Manage user roles.
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/admin/user/identities:
    post:
      tags:
      - UserIdentities
      summary: Create user identity
      description: Creates an user identity
      operationId: userIdentityCreate
      requestBody:
        $ref: '#/components/requestBodies/UserIdentityCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/UserIdentityDetailResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - UserIdentities
      operationId: userIdentityRemove
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/user/identities/:
    get:
      tags:
      - UserIdentities
      operationId: userIdentityList
      responses:
        200:
          $ref: '#/components/responses/UserIdentityListResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/user/identities/search:
    post:
      tags:
      - UserIdentities
      operationId: userIdentitySearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserIdentityListItemSearchRequestQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/UserIdentityListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/user/identities/{userIdentityId}:
    get:
      tags:
      - UserIdentities
      operationId: userIdentityGet
      parameters:
      - $ref: '#/components/parameters/UserIdentityIdParameter'
      responses:
        200:
          $ref: '#/components/responses/UserIdentityDetailResponse'
        404:
          description: UserIdentity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    put:
      tags:
      - UserIdentities
      operationId: userIdentityUpdate
      parameters:
      - $ref: '#/components/parameters/UserIdentityIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/UserIdentityUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/UserIdentityDetailResponse'
        404:
          description: UserIdentity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    patch:
      tags:
      - UserIdentities
      operationId: userIdentityPatch
      parameters:
      - $ref: '#/components/parameters/UserIdentityIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/UserIdentityPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/UserIdentityDetailResponse'
        404:
          description: UserIdentity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/user/roles:
    post:
      tags:
      - UserRoles
      operationId: userRoleCreate
      requestBody:
        $ref: '#/components/requestBodies/UserRoleRequestBody'
      responses:
        201:
          $ref: '#/components/responses/UserRoleDetailResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - UserRoles
      operationId: userRoleRemove
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/user/roles/:
    get:
      tags:
      - UserRoles
      operationId: userRoleList
      responses:
        200:
          $ref: '#/components/responses/UserRoleListResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/user/roles/search:
    post:
      tags:
      - UserRoles
      operationId: userRoleSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleListItemSearchRequestQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/UserRoleListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/user/roles/{userRoleId}:
    get:
      tags:
      - UserRoles
      operationId: userRoleGet
      parameters:
      - $ref: '#/components/parameters/UserRoleIdParameter'
      responses:
        200:
          $ref: '#/components/responses/UserRoleDetailResponse'
        404:
          description: UserRole not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    put:
      tags:
      - UserRoles
      operationId: userRoleUpdate
      parameters:
      - $ref: '#/components/parameters/UserRoleIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/UserRoleUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/UserRoleDetailResponse'
        404:
          description: UserRole not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    patch:
      tags:
      - UserRoles
      operationId: userRolePatch
      parameters:
      - $ref: '#/components/parameters/UserRoleIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/UserRolePatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/UserRoleDetailResponse'
        404:
          description: UserRole not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
components:
  schemas:
    UserIdentityCreateSchema:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/UserIdentityNameField'
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
        roleIds:
          $ref: '#/components/schemas/UserIdentityRoleIdsField'
      required:
      - name
    UserIdentityNameField:
      type: string
      example: Root User
    UserIdentityStatusField:
      type: string
      enum:
      - invited
      - active
      - suspended
      - deactivated
      - anonymized
      example: active
    UserIdentityRoleIdsField:
      type: array
      items:
        $ref: '#/components/schemas/UserRoleIdField'
    UserRoleIdField:
      type: string
      example: role_manager
    UserIdentityDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserIdentityIDField'
        name:
          $ref: '#/components/schemas/UserIdentityNameField'
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
        roleIds:
          $ref: '#/components/schemas/UserIdentityRoleIDListSchema'
      required:
      - id
      - name
      - status
    UserIdentityIDField:
      type: string
      example: usr_a9x1f7Qk2m
    UserIdentityRoleIDListSchema:
      type: array
      items:
        type: string
    DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/DefaultHTTPErrorContentSchema'
        trace:
          $ref: '#/components/schemas/ErrorTraceSchema'
      required:
      - error
    DefaultHTTPErrorContentSchema:
      type: object
      properties:
        message:
          type: string
        reason:
          type: string
      required:
      - message
      - reason
    ErrorTraceSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        reasons:
          $ref: '#/components/schemas/ErrorTraceReasonsSchema'
      required:
      - id
      - message
    ErrorTraceReasonsSchema:
      type: array
      items:
        $ref: '#/components/schemas/ErrorTraceReasonSchema'
    ErrorTraceReasonSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
      - id
      - message
    DeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            example: id1
      required:
      - ids
    UserIdentityListSchema:
      type: array
      items:
        $ref: '#/components/schemas/UserIdentityListItemSchema'
    UserIdentityListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserIdentityIDField'
        name:
          $ref: '#/components/schemas/UserIdentityNameField'
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
        roles:
          $ref: '#/components/schemas/UserIdentityRoleIDListSchema'
      required:
      - id
      - name
      - status
      - roles
    UserIdentityListItemSearchRequestQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          example:
            search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
            role:
              $ref: '#/components/schemas/UserRoleNameField'
      required:
      - filters
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
    SearchPageSizeField:
      type: integer
      default: 20
      description: Results per page. Defaults to 20 when omitted; values below 1 are
        clamped to 1. Endpoint-specific maximums may apply.
      example: 20
    SearchPageNumberField:
      type: integer
      default: 1
      description: 1-based page number. Defaults to 1 when omitted; values below 1
        are clamped to 1.
      example: 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      example: asc
    SearchStringField:
      type: string
      example: foo
    UserRoleNameField:
      type: string
      example: manager
    UserIdentityListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/UserIdentityListItemSearchResponseQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UserIdentityListItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    UserIdentityListItemSearchResponseQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchResponsePageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          example:
            search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
            role:
              $ref: '#/components/schemas/UserRoleNameField'
      required:
      - page
      - filters
    SearchResponsePageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
    UserIdentityUpdateSchema:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/UserIdentityNameField'
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
        roleIds:
          $ref: '#/components/schemas/UserIdentityRoleIdsField'
    UserIdentityPatchSchema:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/UserIdentityNameField'
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
        roleIds:
          $ref: '#/components/schemas/UserIdentityRoleIdsField'
    UserRoleCreateSchema:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/UserRoleKeyField'
        name:
          $ref: '#/components/schemas/UserRoleNameField'
        notes:
          $ref: '#/components/schemas/UserRoleNotesField'
      required:
      - key
    UserRoleKeyField:
      type: string
      example: editor
    UserRoleNotesField:
      type: string
      example: Management role.
    UserRoleDetailSchema:
      type: object
      properties:
        id:
          type: string
          example: role_manager
        key:
          type: string
          example: editor
        name:
          $ref: '#/components/schemas/UserRoleNameField'
        notes:
          $ref: '#/components/schemas/UserRoleNotesField'
      required:
      - id
      - key
    UserRoleListSchema:
      type: array
      items:
        $ref: '#/components/schemas/UserRoleListItemSchema'
    UserRoleListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserRoleIdField'
        key:
          $ref: '#/components/schemas/UserRoleKeyField'
        name:
          $ref: '#/components/schemas/UserRoleNameField'
      required:
      - id
      - key
    UserRoleListItemSearchRequestQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - name
                - notes
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          example:
            search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
      required:
      - filters
    UserRoleListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/UserRoleListItemSearchResponseQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UserRoleListItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    UserRoleListItemSearchResponseQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchResponsePageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - name
                - notes
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          example:
            search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
      required:
      - page
      - filters
    UserRolePatchSchema:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/UserRoleNameField'
        notes:
          $ref: '#/components/schemas/UserRoleNotesField'
  responses:
    UserIdentityDetailResponse:
      description: UserIdentity response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserIdentityDetailSchema'
    NoContentResponse:
      description: Delete succeeded
    UserIdentityListResponse:
      description: UserIdentity list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserIdentityListSchema'
    UserIdentityListItemSearchSchemaSearchResponse:
      description: Search response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserIdentityListItemSearchSchema'
    UserRoleDetailResponse:
      description: UserRole response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserRoleDetailSchema'
    UserRoleListResponse:
      description: UserRole list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserRoleListSchema'
    UserRoleListItemSearchSchemaSearchResponse:
      description: Search response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserRoleListItemSearchSchema'
  parameters:
    UserIdentityIdParameter:
      name: userIdentityId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserIdentityIDField'
      description: User identity id
    UserRoleIdParameter:
      name: userRoleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserRoleIdField'
      description: UserRole id
  requestBodies:
    UserIdentityCreateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserIdentityCreateSchema'
      required: true
    DeleteRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteRequestSchema'
      required: true
    UserIdentityUpdateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserIdentityUpdateSchema'
      required: true
    UserIdentityPatchRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserIdentityPatchSchema'
      required: true
    UserRoleRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserRoleCreateSchema'
      required: true
    UserRoleUpdateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserRolePatchSchema'
      required: true
    UserRolePatchRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserRolePatchSchema'
      required: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
