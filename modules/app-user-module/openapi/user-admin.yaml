openapi: 3.0.0
info:
  title: User Admin API
  version: 0.1.0
tags:
- name: UserIdentities
  description: User identities related endpoints.
- name: UserRoles
  description: Manage user roles.
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/admin/user/identities:
    post:
      tags:
      - UserIdentities
      summary: Create user identity
      description: Creates an user identity
      operationId: userIdentityCreate
      requestBody:
        $ref: '#/components/requestBodies/UserIdentityCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/UserIdentityDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - UserIdentities
      operationId: userIdentityBulkDelete
      requestBody:
        $ref: '#/components/requestBodies/BulkDeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BulkDeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/user/identities/filters:
    get:
      tags:
      - UserIdentities
      operationId: userIdentityFilters
      responses:
        200:
          $ref: '#/components/responses/UserIdentityFiltersResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/user/identities/search:
    post:
      tags:
      - UserIdentities
      operationId: userIdentitySearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserIdentityListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/UserIdentityListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/user/identities/{userIdentityId}:
    get:
      tags:
      - UserIdentities
      operationId: userIdentityGet
      parameters:
      - $ref: '#/components/parameters/UserIdentityIdParameter'
      responses:
        200:
          $ref: '#/components/responses/UserIdentityDetailResponse'
        404:
          description: UserIdentity not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - UserIdentities
      operationId: userIdentityUpdate
      parameters:
      - $ref: '#/components/parameters/UserIdentityIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/UserIdentityUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/UserIdentityDetailResponse'
        404:
          description: UserIdentity not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - UserIdentities
      operationId: userIdentityPatch
      parameters:
      - $ref: '#/components/parameters/UserIdentityIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/UserIdentityPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/UserIdentityDetailResponse'
        404:
          description: UserIdentity not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/user/roles:
    post:
      tags:
      - UserRoles
      operationId: userRoleCreate
      requestBody:
        $ref: '#/components/requestBodies/UserRoleRequestBody'
      responses:
        201:
          $ref: '#/components/responses/UserRoleDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - UserRoles
      operationId: userRoleBulkDelete
      requestBody:
        $ref: '#/components/requestBodies/BulkDeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BulkDeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/user/roles/filters:
    get:
      tags:
      - UserRoles
      operationId: userRoleFilters
      responses:
        200:
          $ref: '#/components/responses/UserRoleFiltersResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/user/roles/search:
    post:
      tags:
      - UserRoles
      operationId: userRoleSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/UserRoleListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/user/roles/{userRoleId}:
    get:
      tags:
      - UserRoles
      operationId: userRoleGet
      parameters:
      - $ref: '#/components/parameters/UserRoleIdParameter'
      responses:
        200:
          $ref: '#/components/responses/UserRoleDetailResponse'
        404:
          description: UserRole not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - UserRoles
      operationId: userRoleUpdate
      parameters:
      - $ref: '#/components/parameters/UserRoleIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/UserRoleUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/UserRoleDetailResponse'
        404:
          description: UserRole not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - UserRoles
      operationId: userRolePatch
      parameters:
      - $ref: '#/components/parameters/UserRoleIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/UserRolePatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/UserRoleDetailResponse'
        404:
          description: UserRole not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
components:
  schemas:
    UserIdentityCreateSchema:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
    UserIdentityStatusField:
      type: string
      enum:
      - invited
      - active
      - suspended
      - deactivated
      - anonymized
      example: active
    UserIdentityDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserIdentityIDField'
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
        roleIds:
          $ref: '#/components/schemas/UserIdentityRoleIDListSchema'
      required:
      - id
      - status
    UserIdentityIDField:
      type: string
      example: usr_a9x1f7Qk2m
    UserIdentityRoleIDListSchema:
      type: array
      items:
        type: string
    BulkDeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            example: id1
        summary:
          type: boolean
          example: true
      required:
      - ids
      - summary
    BulkDeleteResponseSchema:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: id1
              status:
                type: string
                enum:
                - deleted
                - not_found
                - forbidden
                example: deleted
            required:
            - id
            - status
        summary:
          type: object
          properties:
            requested:
              type: integer
              example: 1
            deleted:
              type: integer
              example: 1
            notFound:
              type: integer
              example: 1
            forbidden:
              type: integer
              example: 1
          required:
          - requested
          - deleted
          - notFound
          - forbidden
      required:
      - results
      - summary
    SearchFilterSchema:
      type: object
      properties:
        search:
          $ref: '#/components/schemas/SearchStringField'
    SearchStringField:
      type: string
      example: foo
    UserIdentityListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
            role:
              $ref: '#/components/schemas/UserRoleNameField'
      required:
      - page
      - filters
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
    SearchPageSizeField:
      type: integer
      example: 20
    SearchPageNumberField:
      type: integer
      example: 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      example: asc
    UserRoleNameField:
      type: string
      example: manager
    UserIdentityListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/UserIdentityListItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UserIdentityListItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    UserIdentityListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserIdentityIDField'
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
        roles:
          $ref: '#/components/schemas/UserIdentityRoleIDListSchema'
      required:
      - id
      - status
      - roles
    UserIdentityUpdateSchema:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
        roleIds:
          $ref: '#/components/schemas/UserIdentityRoleIdsField'
    UserIdentityRoleIdsField:
      type: array
      items:
        $ref: '#/components/schemas/UserRoleIdField'
    UserRoleIdField:
      type: string
      example: role_manager
    UserIdentityPatchSchema:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
        roleIds:
          $ref: '#/components/schemas/UserIdentityRoleIdsField'
    UserRoleCreateSchema:
      type: object
      properties:
        id:
          type: string
          example: role_manager
        name:
          $ref: '#/components/schemas/UserRoleNameField'
        notes:
          $ref: '#/components/schemas/UserRoleNotesField'
      required:
      - id
    UserRoleNotesField:
      type: string
      example: Management role.
    UserRoleDetailSchema:
      type: object
      properties:
        id:
          type: string
          example: role_manager
        name:
          $ref: '#/components/schemas/UserRoleNameField'
        notes:
          $ref: '#/components/schemas/UserRoleNotesField'
      required:
      - id
    UserRoleListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - name
                - notes
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
      required:
      - page
      - filters
    UserRoleListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/UserRoleListItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UserRoleListItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    UserRoleListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserRoleIdField'
        name:
          $ref: '#/components/schemas/UserRoleNameField'
      required:
      - id
    UserRolePatchSchema:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/UserRoleNameField'
        notes:
          $ref: '#/components/schemas/UserRoleNotesField'
  responses:
    UserIdentityDetailResponse:
      description: UserIdentity response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserIdentityDetailSchema'
    BulkDeleteResponse:
      description: Bulk delete response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BulkDeleteResponseSchema'
    UserIdentityFiltersResponse:
      description: UserIdentity filter response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchFilterSchema'
    UserIdentityListItemSearchSchemaSearchResponse:
      description: Search response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserIdentityListItemSearchSchema'
    UserRoleDetailResponse:
      description: UserRole response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserRoleDetailSchema'
    UserRoleFiltersResponse:
      description: UserRole filter response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchFilterSchema'
    UserRoleListItemSearchSchemaSearchResponse:
      description: Search response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserRoleListItemSearchSchema'
  parameters:
    UserIdentityIdParameter:
      name: userIdentityId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserIdentityIDField'
      description: User identity id
    UserRoleIdParameter:
      name: userRoleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserRoleIdField'
      description: UserRole id
  requestBodies:
    UserIdentityCreateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserIdentityCreateSchema'
      required: true
    BulkDeleteRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BulkDeleteRequestSchema'
      required: true
    UserIdentityUpdateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserIdentityUpdateSchema'
      required: true
    UserIdentityPatchRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserIdentityPatchSchema'
      required: true
    UserRoleRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserRoleCreateSchema'
      required: true
    UserRoleUpdateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserRolePatchSchema'
      required: true
    UserRolePatchRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserRolePatchSchema'
      required: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
