services:
    tests:
        build:
            context: ../..
            dockerfile: modules/app-user-module/docker/tests/Dockerfile
        command:
            - swift
            - test
            - --parallel

    openapi-admin:
        image: swaggerapi/swagger-ui:v5.32.15
        ports:
            - '8889:8080'
        environment:
            SWAGGER_JSON: /app/user-admin@v3_2_0.yaml
        volumes:
            - './openapi/user-admin@v3_2_0.yaml:/app/user-admin@v3_2_0.yaml:ro'
