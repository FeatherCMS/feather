components:
  schemas:
    WebMetadataCreateSchema:
      type: object
      properties:
        slug:
          type: string
          example: homepage
        template:
          $ref: '#/components/schemas/WebMetadataTemplateField'
        referenceType:
          $ref: '#/components/schemas/WebMetadataReferenceTypeField'
        referenceId:
          $ref: '#/components/schemas/WebMetadataReferenceIDField'
        publicationDate:
          type: number
          nullable: true
        expirationDate:
          type: number
          nullable: true
        status:
          type: string
          example: draft
        title:
          type: string
          nullable: true
        excerpt:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        canonicalUrl:
          type: string
          nullable: true
        noIndex:
          $ref: '#/components/schemas/WebMetadataNoIndexField'
        primaryKeyword:
          type: string
          nullable: true
        cssCodeInjection:
          type: string
          nullable: true
        javascriptCodeInjection:
          type: string
          nullable: true
        structuredDataCodeInjection:
          type: string
          nullable: true
      required:
      - slug
      - status
    WebMetadataTemplateField:
      type: string
      example: default
    WebMetadataReferenceTypeField:
      type: string
      example: web.page
    WebMetadataReferenceIDField:
      type: string
      example: wp_home
    WebMetadataNoIndexField:
      type: boolean
      example: false
    WebMetadataDetailSchema:
      type: object
      properties:
        id:
          type: string
          example: metadata_homepage
        referenceType:
          $ref: '#/components/schemas/WebMetadataReferenceTypeField'
        referenceId:
          $ref: '#/components/schemas/WebMetadataReferenceIDField'
        slug:
          type: string
          example: homepage
        template:
          type: string
          example: default
        publicationDate:
          type: number
          nullable: true
        expirationDate:
          type: number
          nullable: true
        status:
          type: string
          example: published
        title:
          type: string
          nullable: true
        excerpt:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        canonicalUrl:
          type: string
          nullable: true
        noIndex:
          type: boolean
          example: false
        primaryKeyword:
          type: string
          example: homepage seo
        cssCodeInjection:
          type: string
          nullable: true
        javascriptCodeInjection:
          type: string
          nullable: true
        structuredDataCodeInjection:
          type: string
          nullable: true
        createdAt:
          type: number
          format: double
          example: 1.76e+9
        updatedAt:
          type: number
          format: double
          example: 1.76e+9
      required:
      - id
      - slug
      - template
      - status
      - noIndex
      - primaryKeyword
      - createdAt
      - updatedAt
    DeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            example: id1
        results:
          type: boolean
          example: true
        summary:
          type: boolean
          example: true
      required:
      - ids
      - results
      - summary
    DeleteResponseSchema:
      type: object
      properties:
        results:
          $ref: '#/components/schemas/DeleteResultListSchema'
        summary:
          $ref: '#/components/schemas/DeleteSummarySchema'
    DeleteResultListSchema:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            example: id1
          status:
            type: string
            enum:
            - deleted
            - not_found
            - forbidden
            example: deleted
        required:
        - id
        - status
    DeleteSummarySchema:
      type: object
      properties:
        requested:
          type: integer
          example: 1
        deleted:
          type: integer
          example: 1
        omitted:
          type: integer
          example: 1
      required:
      - requested
      - deleted
      - omitted
    WebMetadataListSchema:
      type: array
      items:
        $ref: '#/components/schemas/WebMetadataListItemSchema'
    WebMetadataListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/WebMetadataIdField'
        referenceType:
          $ref: '#/components/schemas/WebMetadataReferenceTypeField'
        referenceId:
          $ref: '#/components/schemas/WebMetadataReferenceIDField'
        slug:
          $ref: '#/components/schemas/WebMetadataSlugField'
        publicationDate:
          type: number
          nullable: true
        expirationDate:
          type: number
          nullable: true
        status:
          $ref: '#/components/schemas/WebMetadataStatusField'
        title:
          $ref: '#/components/schemas/WebMetadataTitleField'
        createdAt:
          $ref: '#/components/schemas/WebMetadataTimestampField'
        updatedAt:
          $ref: '#/components/schemas/WebMetadataTimestampField'
      required:
      - id
      - slug
      - status
      - title
      - createdAt
      - updatedAt
    WebMetadataIdField:
      type: string
      example: metadata_homepage
    WebMetadataSlugField:
      type: string
      example: homepage
    WebMetadataStatusField:
      type: string
      example: draft
    WebMetadataTitleField:
      type: string
      example: Homepage metadata title
    WebMetadataTimestampField:
      type: number
      format: double
      example: 1.76e+9
    WebMetadataListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - slug
                - publicationDate
                - expirationDate
                - status
                - title
                - createdAt
                - updatedAt
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          example:
            search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
            referenceType:
              $ref: '#/components/schemas/WebMetadataReferenceTypeField'
      required:
      - page
      - filters
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
    SearchPageSizeField:
      type: integer
      example: 20
    SearchPageNumberField:
      type: integer
      example: 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      example: asc
    SearchStringField:
      type: string
      example: foo
    WebMetadataListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/WebMetadataListItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/WebMetadataListItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    WebMetadataPatchSchema:
      type: object
      properties:
        slug:
          $ref: '#/components/schemas/WebMetadataSlugField'
        template:
          $ref: '#/components/schemas/WebMetadataTemplateField'
        referenceType:
          $ref: '#/components/schemas/WebMetadataReferenceTypeField'
        referenceId:
          $ref: '#/components/schemas/WebMetadataReferenceIDField'
        publicationDate:
          type: number
          nullable: true
        expirationDate:
          type: number
          nullable: true
        status:
          $ref: '#/components/schemas/WebMetadataStatusField'
        title:
          type: string
          nullable: true
        excerpt:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        canonicalUrl:
          type: string
          nullable: true
        noIndex:
          $ref: '#/components/schemas/WebMetadataNoIndexField'
        primaryKeyword:
          type: string
          nullable: true
        cssCodeInjection:
          type: string
          nullable: true
        javascriptCodeInjection:
          type: string
          nullable: true
        structuredDataCodeInjection:
          type: string
          nullable: true
    WebPageCreateSchema:
      type: object
      properties:
        title:
          type: string
          example: Homepage
        excerpt:
          type: string
          example: Short page summary.
        content:
          type: string
          example: <h1>Homepage</h1>
        imageAssetId:
          $ref: '#/components/schemas/WebPageImageAssetIdField'
      required:
      - title
      - excerpt
      - content
    WebPageImageAssetIdField:
      type: string
      example: media_asset_1
    WebPageDetailSchema:
      type: object
      properties:
        id:
          type: string
          example: wp_home
        title:
          type: string
          example: Homepage
        excerpt:
          type: string
          example: Short page summary.
        content:
          type: string
          example: <h1>Homepage</h1>
        imageAssetId:
          $ref: '#/components/schemas/WebPageImageAssetIdField'
        metadata:
          $ref: '#/components/schemas/WebMetadataDetailSchema'
        createdAt:
          type: number
          format: double
          example: 1.76e+9
        updatedAt:
          type: number
          format: double
          example: 1.76e+9
      required:
      - id
      - title
      - excerpt
      - content
      - metadata
      - createdAt
      - updatedAt
    WebPageListSchema:
      type: array
      items:
        $ref: '#/components/schemas/WebPageListItemSchema'
    WebPageListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/WebPageIdField'
        title:
          $ref: '#/components/schemas/WebPageTitleField'
        excerpt:
          $ref: '#/components/schemas/WebPageExcerptField'
        imageAssetId:
          $ref: '#/components/schemas/WebPageImageAssetIdField'
        createdAt:
          $ref: '#/components/schemas/WebPageCreatedAtField'
        updatedAt:
          $ref: '#/components/schemas/WebPageUpdatedAtField'
      required:
      - id
      - title
      - excerpt
      - createdAt
      - updatedAt
    WebPageIdField:
      type: string
      example: wp_home
    WebPageTitleField:
      type: string
      example: Homepage
    WebPageExcerptField:
      type: string
      example: Short page summary.
    WebPageCreatedAtField:
      type: number
      format: double
      example: 1.76e+9
    WebPageUpdatedAtField:
      type: number
      format: double
      example: 1.76e+9
    WebPageListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
