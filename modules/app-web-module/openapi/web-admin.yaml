openapi: 3.0.0
info:
  title: Admin API
  version: 0.1.0
tags:
- name: MetadataEntries
  description: Manage metadata entries.
- name: WebPages
  description: Manage web pages.
- name: WebMenus
  description: Manage web menus.
- name: WebMenuItems
  description: Manage web menu items.
- name: WebSettings
  description: Manage web settings.
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
