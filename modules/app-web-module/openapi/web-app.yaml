openapi: 3.0.0
info:
  title: App API
  version: 0.1.0
tags:
- name: Web
  description: Public app web endpoints
servers:
- url: http://127.0.0.1:8080/
paths:
  /api/v1/web/menus:
    get:
      tags:
      - Web
      operationId: menuList
      responses:
        200:
          $ref: '#/components/responses/MenuListResponse'
  /api/v1/web/menus/{key}:
    get:
      tags:
      - Web
      operationId: menuGetByKey
      parameters:
      - $ref: '#/components/parameters/MenuKeyParameter'
      responses:
        200:
          $ref: '#/components/responses/MenuResponse'
        404:
          description: Web menu not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
  /api/v1/web/routes/{slug}:
    get:
      tags:
      - Web
      operationId: metadataGet
      parameters:
      - $ref: '#/components/parameters/MetadataSlugParameter'
      responses:
        200:
          $ref: '#/components/responses/MetadataResponse'
        404:
          description: Web metadata not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
  /api/v1/web/metadata:
    get:
      tags:
      - Web
      operationId: metadataList
      responses:
        200:
          $ref: '#/components/responses/MetadataListResponse'
  /api/v1/web/pages/{id}:
    get:
      tags:
      - Web
      operationId: pageGet
      parameters:
      - $ref: '#/components/parameters/MetadataIdParameter'
      responses:
        200:
          $ref: '#/components/responses/PageDetailResponse'
        404:
          description: Web page not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
  /api/v1/web/settings:
    get:
      tags:
      - Web
      operationId: siteSettings
      responses:
        200:
          $ref: '#/components/responses/SiteSettingsResponse'
components:
  schemas:
    MenuListSchema:
      type: array
      items:
        $ref: '#/components/schemas/MenuSchema'
    MenuSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MenuIdField'
        key:
          $ref: '#/components/schemas/MenuKeyField'
        name:
          $ref: '#/components/schemas/MenuNameField'
        items:
          $ref: '#/components/schemas/MenuItemListSchema'
      required:
      - id
      - key
      - name
      - items
    MenuIdField:
      type: string
      example: wm_header
    MenuKeyField:
      type: string
      example: header
    MenuNameField:
      type: string
      example: Header menu
    MenuItemListSchema:
      type: array
      items:
        $ref: '#/components/schemas/MenuItemSchema'
    MenuItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MenuItemIdField'
        label:
          $ref: '#/components/schemas/MenuItemLabelField'
        url:
          $ref: '#/components/schemas/MenuItemURLField'
        priority:
          $ref: '#/components/schemas/MenuItemPriorityField'
        isBlank:
          $ref: '#/components/schemas/MenuItemIsBlankField'
      required:
      - id
      - label
      - url
      - priority
      - isBlank
    MenuItemIdField:
      type: string
      example: wmi_home
    MenuItemLabelField:
      type: string
      example: Home
    MenuItemURLField:
      type: string
      example: /
    MenuItemPriorityField:
      type: integer
      example: 10
    MenuItemIsBlankField:
      type: boolean
      example: false
    DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/DefaultHTTPErrorContentSchema'
        trace:
          $ref: '#/components/schemas/ErrorTraceSchema'
      required:
      - error
    DefaultHTTPErrorContentSchema:
      type: object
      properties:
        message:
          type: string
        reason:
          type: string
      required:
      - message
      - reason
    ErrorTraceSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        reasons:
          $ref: '#/components/schemas/ErrorTraceReasonsSchema'
      required:
      - id
      - message
    ErrorTraceReasonsSchema:
      type: array
      items:
        $ref: '#/components/schemas/ErrorTraceReasonSchema'
    ErrorTraceReasonSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
      - id
      - message
    MetadataSlugField:
      type: string
      example: homepage
    MetadataSchema:
      type: object
      properties:
        referenceType:
          $ref: '#/components/schemas/MetadataReferenceTypeField'
        referenceId:
          $ref: '#/components/schemas/MetadataReferenceIDField'
        slug:
          $ref: '#/components/schemas/MetadataSlugField'
        template:
          $ref: '#/components/schemas/MetadataTemplateField'
      required:
      - referenceType
      - referenceId
      - slug
    MetadataReferenceTypeField:
      type: string
      example: web.page
    MetadataReferenceIDField:
      type: string
      example: wp_home
    MetadataTemplateField:
      type: string
      example: default
    MetadataSlugListSchema:
      type: array
      items:
        $ref: '#/components/schemas/MetadataSlugField'
    PageDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/PageIdField'
        title:
          $ref: '#/components/schemas/PageTitleField'
        excerpt:
          $ref: '#/components/schemas/PageExcerptField'
        content:
          $ref: '#/components/schemas/PageContentField'
        imageURL:
          $ref: '#/components/schemas/PageImageURLField'
        media:
          $ref: '#/components/schemas/MediaAssetSchema'
        metadata:
          $ref: '#/components/schemas/MetadataContentSchema'
      required:
      - id
      - title
      - excerpt
      - content
      - imageURL
      - metadata
    PageIdField:
      type: string
      example: wp_home
    PageTitleField:
      type: string
      example: Homepage
    PageExcerptField:
      type: string
      example: Short page summary.
    PageContentField:
      type: string
      example: <h1>Homepage</h1>
    PageImageURLField:
      type: string
      example: /public/12/34/56789/originals/homepage.png
    MediaAssetSchema:
      type: object
      properties:
        assetId:
          $ref: '#/components/schemas/MediaAssetIdField'
        originalURL:
          $ref: '#/components/schemas/MediaAssetURLField'
        defaultURL:
          $ref: '#/components/schemas/MediaAssetURLField'
        variants:
          $ref: '#/components/schemas/MediaAssetVariantListSchema'
      required:
      - assetId
      - originalURL
      - defaultURL
      - variants
    MediaAssetIdField:
      type: string
      example: media_asset_1
    MediaAssetURLField:
      type: string
      example: /public/12/34/56789/originals/example.png
    MediaAssetVariantListSchema:
      type: array
      items:
        $ref: '#/components/schemas/MediaAssetVariantSchema'
    MediaAssetVariantSchema:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/MediaAssetKeyField'
        url:
          $ref: '#/components/schemas/MediaAssetURLField'
      required:
      - key
      - url
    MediaAssetKeyField:
      type: string
      example: preview
    MetadataContentSchema:
      type: object
      properties:
        slug:
          $ref: '#/components/schemas/MetadataSlugField'
        template:
          $ref: '#/components/schemas/MetadataTemplateField'
        publicationDate:
          $ref: '#/components/schemas/MetadataTimestampField'
        expirationDate:
          $ref: '#/components/schemas/MetadataTimestampField'
        status:
          $ref: '#/components/schemas/MetadataStatusField'
        title:
          $ref: '#/components/schemas/MetadataTitleField'
        excerpt:
          $ref: '#/components/schemas/MetadataExcerptField'
        imageURL:
          $ref: '#/components/schemas/MetadataImageURLField'
        canonicalURL:
          $ref: '#/components/schemas/MetadataCanonicalURLField'
        noIndex:
          $ref: '#/components/schemas/MetadataNoIndexField'
        cssCodeInjection:
          $ref: '#/components/schemas/MetadataCodeInjectionField'
        javascriptCodeInjection:
          $ref: '#/components/schemas/MetadataCodeInjectionField'
        structuredDataCodeInjection:
          $ref: '#/components/schemas/MetadataCodeInjectionField'
      required:
      - slug
      - status
      - title
      - excerpt
      - imageURL
      - noIndex
    MetadataTimestampField:
      type: number
      format: double
      example: 1.76e+9
    MetadataStatusField:
      type: string
      example: published
    MetadataTitleField:
      type: string
      example: Hello world
    MetadataExcerptField:
      type: string
      example: Short summary
    MetadataImageURLField:
      type: string
      example: /public/12/34/56789/originals/example.png
    MetadataCanonicalURLField:
      type: string
      example: https://example.com/posts/hello-world
    MetadataNoIndexField:
      type: boolean
      example: false
    MetadataCodeInjectionField:
      type: string
      example: <p>Hello world</p>
    SiteSettingsSchema:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/SiteSettingsTitleField'
        excerpt:
          $ref: '#/components/schemas/SiteSettingsExcerptField'
        locale:
          $ref: '#/components/schemas/SiteSettingsLocaleField'
        noIndex:
          $ref: '#/components/schemas/SiteSettingsNoIndexField'
        logo:
          $ref: '#/components/schemas/SiteSettingsLogoField'
        logoDark:
          $ref: '#/components/schemas/SiteSettingsLogoDarkField'
        metaImage:
          $ref: '#/components/schemas/SiteSettingsMetaImageField'
        primaryColor:
          $ref: '#/components/schemas/SiteSettingsPrimaryColorField'
        secondaryColor:
          $ref: '#/components/schemas/SiteSettingsSecondaryColorField'
        tertiaryColor:
          $ref: '#/components/schemas/SiteSettingsTertiaryColorField'
        primaryFont:
          $ref: '#/components/schemas/SiteSettingsPrimaryFontField'
        secondaryFont:
          $ref: '#/components/schemas/SiteSettingsSecondaryFontField'
        homePageId:
          $ref: '#/components/schemas/SiteSettingsHomePageIDField'
        css:
          $ref: '#/components/schemas/SiteSettingsCSSField'
        js:
          $ref: '#/components/schemas/SiteSettingsJSField'
      required:
      - title
      - excerpt
      - locale
      - noIndex
      - logo
      - logoDark
      - metaImage
      - primaryColor
      - secondaryColor
      - tertiaryColor
      - primaryFont
      - secondaryFont
      - css
      - js
    SiteSettingsTitleField:
      type: string
      example: Example Site
    SiteSettingsExcerptField:
      type: string
      example: A concise site description.
    SiteSettingsLocaleField:
      type: string
      example: en-US
    SiteSettingsNoIndexField:
      type: boolean
      example: false
    SiteSettingsLogoField:
      type: string
      example: /images/logo.svg
    SiteSettingsLogoDarkField:
      type: string
      example: /images/logo-dark.svg
    SiteSettingsMetaImageField:
      type: string
      example: /public/12/34/56789/originals/default-meta-image.webp
    SiteSettingsPrimaryColorField:
      type: string
      example: '#1d4ed8'
    SiteSettingsSecondaryColorField:
      type: string
      example: '#0f172a'
    SiteSettingsTertiaryColorField:
      type: string
      example: '#e2e8f0'
    SiteSettingsPrimaryFontField:
      type: string
      example: Geist
    SiteSettingsSecondaryFontField:
      type: string
      example: Merriweather
    SiteSettingsHomePageIDField:
      type: string
      example: web_page_1
    SiteSettingsCSSField:
      type: string
      example: body { }
    SiteSettingsJSField:
      type: string
      example: console.log('web');
  responses:
    MenuListResponse:
      description: Web menu list
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MenuListSchema'
    MenuResponse:
      description: Web menu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MenuSchema'
    MetadataResponse:
      description: Web metadata resolution
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MetadataSchema'
    MetadataListResponse:
      description: Public web metadata slugs
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MetadataSlugListSchema'
    PageDetailResponse:
      description: Web page detail
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PageDetailSchema'
    SiteSettingsResponse:
      description: Web site settings
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SiteSettingsSchema'
  parameters:
    MenuKeyParameter:
      name: key
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MenuKeyField'
      description: Web menu key
    MetadataSlugParameter:
      name: slug
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MetadataSlugField'
      description: Web metadata slug
    MetadataIdParameter:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MetadataReferenceIDField'
      description: Web metadata identifier
