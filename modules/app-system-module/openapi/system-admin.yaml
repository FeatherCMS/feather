openapi: 3.0.0
info:
  title: System Admin API
  version: 0.1.0
tags:
- name: SystemPermissions
  description: Manage system permissions.
- name: SystemVariables
  description: Manage system variables.
- name: System jobs
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/admin/system/permissions:
    post:
      tags:
      - SystemPermissions
      operationId: systemPermissionCreate
      requestBody:
        $ref: '#/components/requestBodies/SystemPermissionRequestBody'
      responses:
        201:
          $ref: '#/components/responses/SystemPermissionDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - SystemPermissions
      operationId: systemPermissionBulkDelete
      requestBody:
        $ref: '#/components/requestBodies/BulkDeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BulkDeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/system/permissions/filters:
    get:
      tags:
      - SystemPermissions
      operationId: systemPermissionFilters
      responses:
        200:
          $ref: '#/components/responses/SystemPermissionFiltersResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/system/permissions/search:
    post:
      tags:
      - SystemPermissions
      operationId: systemPermissionSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemPermissionListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/SystemPermissionListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/system/permissions/{systemPermissionId}:
    get:
      tags:
      - SystemPermissions
      operationId: systemPermissionGet
      parameters:
      - $ref: '#/components/parameters/SystemPermissionIdParameter'
      responses:
        200:
          $ref: '#/components/responses/SystemPermissionDetailResponse'
        404:
          description: SystemPermission not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - SystemPermissions
      operationId: systemPermissionUpdate
      parameters:
      - $ref: '#/components/parameters/SystemPermissionIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/SystemPermissionUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/SystemPermissionDetailResponse'
        404:
          description: SystemPermission not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - SystemPermissions
      operationId: systemPermissionDelete
      parameters:
      - $ref: '#/components/parameters/SystemPermissionIdParameter'
      responses:
        204:
          description: SystemPermission deleted
        404:
          description: SystemPermission not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - SystemPermissions
      operationId: systemPermissionPatch
      parameters:
      - $ref: '#/components/parameters/SystemPermissionIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/SystemPermissionPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/SystemPermissionDetailResponse'
        404:
          description: SystemPermission not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/system/variables:
    post:
      tags:
      - SystemVariables
      operationId: systemVariableCreate
      requestBody:
        $ref: '#/components/requestBodies/SystemVariableRequestBody'
      responses:
        201:
          $ref: '#/components/responses/SystemVariableDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - SystemVariables
      operationId: systemVariableBulkDelete
      requestBody:
        $ref: '#/components/requestBodies/BulkDeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BulkDeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/system/variables/filters:
    get:
      tags:
      - SystemVariables
      operationId: systemVariableFilters
      responses:
        200:
          $ref: '#/components/responses/SystemVariableFiltersResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/system/variables/search:
    post:
      tags:
      - SystemVariables
      operationId: systemVariableSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemVariableListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/SystemVariableListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/system/variables/{systemVariableId}:
    get:
      tags:
      - SystemVariables
      operationId: systemVariableGet
      parameters:
      - $ref: '#/components/parameters/SystemVariableIdParameter'
      responses:
        200:
          $ref: '#/components/responses/SystemVariableDetailResponse'
        404:
          description: SystemVariable not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - SystemVariables
      operationId: systemVariableUpdate
      parameters:
      - $ref: '#/components/parameters/SystemVariableIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/SystemVariableUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/SystemVariableDetailResponse'
        404:
          description: SystemVariable not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - SystemVariables
      operationId: systemVariableDelete
      parameters:
      - $ref: '#/components/parameters/SystemVariableIdParameter'
      responses:
        204:
          description: SystemVariable deleted
        404:
          description: SystemVariable not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - SystemVariables
      operationId: systemVariablePatch
      parameters:
      - $ref: '#/components/parameters/SystemVariableIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/SystemVariablePatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/SystemVariableDetailResponse'
        404:
          description: SystemVariable not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/system/jobs:
    get:
      tags:
      - System jobs
      operationId: systemJobList
      responses:
        200:
          $ref: '#/components/responses/SystemJobListResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/system/jobs/{systemJobId}:
    get:
      tags:
      - System jobs
      operationId: systemJobGet
      parameters:
      - $ref: '#/components/parameters/SystemJobIdParameter'
      responses:
        200:
          $ref: '#/components/responses/SystemJobResponse'
        404:
          description: Worker job not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
components:
  schemas:
    SystemPermissionCreateSchema:
      type: object
      properties:
        id:
          type: string
          example: system.permission:read
        name:
          $ref: '#/components/schemas/SystemPermissionNameField'
        notes:
          $ref: '#/components/schemas/SystemPermissionNotesField'
      required:
      - id
    SystemPermissionNameField:
      type: string
      example: system.permission:read
    SystemPermissionNotesField:
      type: string
      example: Read system permissions.
    SystemPermissionDetailSchema:
      type: object
      properties:
        id:
          type: string
          example: system.permission:read
        name:
          $ref: '#/components/schemas/SystemPermissionNameField'
        notes:
          $ref: '#/components/schemas/SystemPermissionNotesField'
      required:
      - id
    BulkDeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            example: id1
        summary:
          type: boolean
          example: true
      required:
      - ids
      - summary
    BulkDeleteResponseSchema:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: id1
              status:
                type: string
                enum:
                - deleted
                - not_found
                - forbidden
                example: deleted
            required:
            - id
            - status
        summary:
          type: object
          properties:
            requested:
              type: integer
              example: 1
            deleted:
              type: integer
              example: 1
            notFound:
              type: integer
              example: 1
            forbidden:
              type: integer
              example: 1
          required:
          - requested
          - deleted
          - notFound
          - forbidden
      required:
      - results
      - summary
    SearchFilterSchema:
      type: object
      properties:
        search:
          $ref: '#/components/schemas/SearchStringField'
    SearchStringField:
      type: string
      example: foo
    SystemPermissionListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - name
                - notes
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
      required:
      - page
      - filters
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
    SearchPageSizeField:
      type: integer
      example: 20
    SearchPageNumberField:
      type: integer
      example: 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      example: asc
    SystemPermissionListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/SystemPermissionListItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SystemPermissionListItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    SystemPermissionListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SystemPermissionIdField'
        name:
          $ref: '#/components/schemas/SystemPermissionNameField'
        notes:
          $ref: '#/components/schemas/SystemPermissionNotesField'
      required:
      - id
    SystemPermissionIdField:
      type: string
      example: system.permission:read
    SystemPermissionPatchSchema:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/SystemPermissionNameField'
        notes:
          $ref: '#/components/schemas/SystemPermissionNotesField'
    SystemVariableCreateSchema:
      type: object
      properties:
        id:
          type: string
          example: sys_variable_timezone
        value:
          type: string
          example: UTC
        name:
          $ref: '#/components/schemas/SystemVariableNameField'
        notes:
          $ref: '#/components/schemas/SystemVariableNotesField'
      required:
      - id
      - value
    SystemVariableNameField:
      type: string
      example: default_timezone
    SystemVariableNotesField:
      type: string
      example: Application default timezone.
    SystemVariableDetailSchema:
      type: object
      properties:
        id:
          type: string
          example: sys_variable_timezone
        value:
          type: string
          example: UTC
        name:
          $ref: '#/components/schemas/SystemVariableNameField'
        notes:
          $ref: '#/components/schemas/SystemVariableNotesField'
      required:
      - id
      - value
    SystemVariableListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - name
                - value
                - notes
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
      required:
      - page
      - filters
    SystemVariableListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/SystemVariableListItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SystemVariableListItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    SystemVariableListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SystemVariableIdField'
        value:
          $ref: '#/components/schemas/SystemVariableValueField'
        name:
          $ref: '#/components/schemas/SystemVariableNameField'
        notes:
          $ref: '#/components/schemas/SystemVariableNotesField'
      required:
      - id
      - value
    SystemVariableIdField:
      type: string
      example: sys_variable_timezone
    SystemVariableValueField:
      type: string
      example: UTC
    SystemVariablePatchSchema:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/SystemVariableValueField'
        name:
          $ref: '#/components/schemas/SystemVariableNameField'
        notes:
          $ref: '#/components/schemas/SystemVariableNotesField'
    SystemJobListSchema:
      type: array
      items:
        $ref: '#/components/schemas/SystemJobSchema'
    SystemJobSchema:
      type: object
      properties:
        id:
          type: string
        queueName:
          type: string
        status:
          type: integer
        workerId:
          $ref: '#/components/schemas/SystemJobWorkerIdField'
        lastModified:
          type: number
          format: double
        payload:
          type: string
      required:
      - id
      - queueName
      - status
      - lastModified
      - payload
    SystemJobWorkerIdField:
      type: string
    SystemJobIdField:
      type: string
  responses:
    SystemPermissionDetailResponse:
      description: SystemPermission response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemPermissionDetailSchema'
    BulkDeleteResponse:
      description: Bulk delete response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BulkDeleteResponseSchema'
    SystemPermissionFiltersResponse:
      description: SystemPermission filter response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchFilterSchema'
    SystemPermissionListItemSearchSchemaSearchResponse:
      description: Search response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemPermissionListItemSearchSchema'
    SystemVariableDetailResponse:
      description: SystemVariable response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemVariableDetailSchema'
    SystemVariableFiltersResponse:
      description: SystemVariable filter response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchFilterSchema'
    SystemVariableListItemSearchSchemaSearchResponse:
      description: Search response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemVariableListItemSearchSchema'
    SystemJobListResponse:
      description: Worker job list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemJobListSchema'
    SystemJobResponse:
      description: Worker job response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemJobSchema'
  parameters:
    SystemPermissionIdParameter:
      name: systemPermissionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SystemPermissionIdField'
      description: SystemPermission id
    SystemVariableIdParameter:
      name: systemVariableId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SystemVariableIdField'
      description: SystemVariable id
    SystemJobIdParameter:
      name: systemJobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SystemJobIdField'
      description: Worker job id
  requestBodies:
    SystemPermissionRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemPermissionCreateSchema'
      required: true
    BulkDeleteRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BulkDeleteRequestSchema'
      required: true
    SystemPermissionUpdateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemPermissionCreateSchema'
      required: true
    SystemPermissionPatchRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemPermissionPatchSchema'
      required: true
    SystemVariableRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemVariableCreateSchema'
      required: true
    SystemVariableUpdateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemVariableCreateSchema'
      required: true
    SystemVariablePatchRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemVariablePatchSchema'
      required: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
