openapi: 3.2.0
info:
  title: System Admin API
  version: 0.1.0
tags:
- name: SystemPermissions
  description: Manage system permissions.
- name: SystemVariables
  description: Manage system variables.
- name: System jobs
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/admin/system/permissions:
    get:
      tags:
      - SystemPermissions
      operationId: systemPermissionList
      parameters:
      - $ref: '#/components/parameters/PermissionParametersSearch'
      - $ref: '#/components/parameters/PermissionParametersIDs'
      - $ref: '#/components/parameters/PermissionParametersLimit'
      responses:
        200:
          $ref: '#/components/responses/SystemPermissionListResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    post:
      tags:
      - SystemPermissions
      operationId: systemPermissionPost
      requestBody:
        $ref: '#/components/requestBodies/SystemPermissionRequestBody'
      responses:
        201:
          $ref: '#/components/responses/SystemPermissionDetailResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        409:
          description: Permission key already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - SystemPermissions
      operationId: systemPermissionDelete
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/system/permissions/query:
    post:
      tags:
      - SystemPermissions
      operationId: systemPermissionQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemPermissionQueryItemSearchRequestQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/SystemPermissionQueryItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/system/permissions/{systemPermissionId}:
    get:
      tags:
      - SystemPermissions
      operationId: systemPermissionGet
      parameters:
      - $ref: '#/components/parameters/SystemPermissionIDParameter'
      responses:
        200:
          $ref: '#/components/responses/SystemPermissionDetailResponse'
        404:
          description: SystemPermission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    put:
      tags:
      - SystemPermissions
      operationId: systemPermissionPut
      parameters:
      - $ref: '#/components/parameters/SystemPermissionIDParameter'
      requestBody:
        $ref: '#/components/requestBodies/SystemPermissionPutRequestBody'
      responses:
        200:
          $ref: '#/components/responses/SystemPermissionDetailResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        404:
          description: SystemPermission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        409:
          description: Permission key already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    patch:
      tags:
      - SystemPermissions
      operationId: systemPermissionPatch
      parameters:
      - $ref: '#/components/parameters/SystemPermissionIDParameter'
      - $ref: '#/components/parameters/PermissionParametersUpdateMask'
      requestBody:
        $ref: '#/components/requestBodies/SystemPermissionPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/SystemPermissionDetailResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        404:
          description: SystemPermission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        409:
          description: Permission key already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/system/variables:
    get:
      tags:
      - SystemVariables
      operationId: systemVariableList
      parameters:
      - $ref: '#/components/parameters/VariableParametersSearch'
      - $ref: '#/components/parameters/VariableParametersIDs'
      - $ref: '#/components/parameters/VariableParametersLimit'
      responses:
        200:
          $ref: '#/components/responses/SystemVariableListResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    post:
      tags:
      - SystemVariables
      operationId: systemVariablePost
      requestBody:
        $ref: '#/components/requestBodies/SystemVariableRequestBody'
      responses:
        201:
          $ref: '#/components/responses/SystemVariableDetailResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        409:
          description: Variable key already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - SystemVariables
      operationId: systemVariableDelete
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/system/variables/query:
    post:
      tags:
      - SystemVariables
      operationId: systemVariableQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemVariableQueryItemSearchRequestQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/SystemVariableQueryItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/system/variables/{systemVariableId}:
    get:
      tags:
      - SystemVariables
      operationId: systemVariableGet
      parameters:
      - $ref: '#/components/parameters/SystemVariableIDParameter'
      responses:
        200:
          $ref: '#/components/responses/SystemVariableDetailResponse'
        404:
          description: SystemVariable not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    put:
      tags:
      - SystemVariables
      operationId: systemVariablePut
      parameters:
      - $ref: '#/components/parameters/SystemVariableIDParameter'
      requestBody:
        $ref: '#/components/requestBodies/SystemVariablePutRequestBody'
      responses:
        200:
          $ref: '#/components/responses/SystemVariableDetailResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        404:
          description: SystemVariable not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        409:
          description: Variable key already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    patch:
      tags:
      - SystemVariables
      operationId: systemVariablePatch
      parameters:
      - $ref: '#/components/parameters/SystemVariableIDParameter'
      - $ref: '#/components/parameters/VariableParametersUpdateMask'
      requestBody:
        $ref: '#/components/requestBodies/SystemVariablePatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/SystemVariableDetailResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        404:
          description: SystemVariable not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        409:
          description: Variable key already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/system/jobs/query:
    post:
      tags:
      - System jobs
      operationId: systemJobQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemJobQueryItemSearchRequestQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/SystemJobQueryItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/system/jobs/{systemJobId}:
    get:
      tags:
      - System jobs
      operationId: systemJobGet
      parameters:
      - $ref: '#/components/parameters/SystemJobIdParameter'
      responses:
        200:
          $ref: '#/components/responses/SystemJobResponse'
        404:
          description: Worker job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
components:
  schemas:
    SystemPermissionSearch:
      type: string
      examples:
      - admin
    SystemPermissionIDsFilter:
      type: array
      items:
        type: string
        examples:
        - V1StGXR8_Z5jdHi6B-myT
      minItems: 0
      uniqueItems: false
    SystemPermissionListLimit:
      type: integer
      default: 20
      description: Maximum number of results. Defaults to 20; values are clamped to
        1-100.
      examples:
      - 20
    SystemPermissionListSchema:
      type: array
      items:
        $ref: '#/components/schemas/SystemPermissionListItemSchema'
      minItems: 0
      uniqueItems: false
    SystemPermissionListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SystemPermissionIDField'
        key:
          $ref: '#/components/schemas/SystemPermissionKeyField'
        name:
          $ref: '#/components/schemas/SystemPermissionNameField'
        notes:
          $ref: '#/components/schemas/SystemPermissionNotesField'
      required:
      - id
      - key
      minProperties: 2
    SystemPermissionIDField:
      type: string
      examples:
      - V1StGXR8_Z5jdHi6B-myT
    SystemPermissionKeyField:
      type: string
      examples:
      - system.permission:read
    SystemPermissionNameField:
      type: string
      examples:
      - system.permission:read
    SystemPermissionNotesField:
      type: string
      examples:
      - Read system permissions.
    DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/DefaultHTTPErrorContentSchema'
        trace:
          $ref: '#/components/schemas/ErrorTraceSchema'
      required:
      - error
      minProperties: 1
    DefaultHTTPErrorContentSchema:
      type: object
      properties:
        message:
          type: string
        reason:
          type: string
      required:
      - message
      - reason
      minProperties: 2
    ErrorTraceSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        reasons:
          $ref: '#/components/schemas/ErrorTraceReasonsSchema'
      required:
      - id
      - message
      minProperties: 2
    ErrorTraceReasonsSchema:
      type: array
      items:
        $ref: '#/components/schemas/ErrorTraceReasonSchema'
      minItems: 0
      uniqueItems: false
    ErrorTraceReasonSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
      - id
      - message
      minProperties: 2
    SystemPermissionCreateSchema:
      type: object
      properties:
        key:
          type: string
          examples:
          - system.permission:read
        name:
          $ref: '#/components/schemas/SystemPermissionNameField'
        notes:
          $ref: '#/components/schemas/SystemPermissionNotesField'
      required:
      - key
      minProperties: 1
    SystemPermissionDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SystemPermissionIDField'
        key:
          type: string
          examples:
          - system.permission:read
        name:
          $ref: '#/components/schemas/SystemPermissionNameField'
        notes:
          $ref: '#/components/schemas/SystemPermissionNotesField'
      required:
      - id
      - key
      minProperties: 2
    DeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            examples:
            - id1
          minItems: 0
          uniqueItems: false
      required:
      - ids
      minProperties: 1
    SystemPermissionQueryItemSearchRequestQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - key
                - name
                - notes
                examples:
                - key
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
            minProperties: 2
          minItems: 0
          uniqueItems: false
        filters:
          type: object
          examples:
          - search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
            ids:
              type: array
              items:
                type: string
                examples:
                - V1StGXR8_Z5jdHi6B-myT
              minItems: 0
              uniqueItems: false
          minProperties: 0
      required:
      - filters
      minProperties: 1
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      minProperties: 0
    SearchPageSizeField:
      type: integer
      default: 20
      description: Results per page. Defaults to 20 when omitted; values below 1 are
        clamped to 1. Endpoint-specific maximums may apply.
      examples:
      - 20
    SearchPageNumberField:
      type: integer
      default: 1
      description: 1-based page number. Defaults to 1 when omitted; values below 1
        are clamped to 1.
      examples:
      - 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      examples:
      - asc
    SearchStringField:
      type: string
      examples:
      - foo
    SystemPermissionQueryItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/SystemPermissionQueryItemSearchResponseQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SystemPermissionQueryItemSchema'
              minItems: 0
              uniqueItems: false
            total:
              type: integer
              examples:
              - 123
          required:
          - items
          - total
          minProperties: 2
      required:
      - query
      - data
      minProperties: 2
    SystemPermissionQueryItemSearchResponseQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchResponsePageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - key
                - name
                - notes
                examples:
                - key
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
            minProperties: 2
          minItems: 0
          uniqueItems: false
        filters:
          type: object
          examples:
          - search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
            ids:
              type: array
              items:
                type: string
                examples:
                - V1StGXR8_Z5jdHi6B-myT
              minItems: 0
              uniqueItems: false
          minProperties: 0
      required:
      - page
      - filters
      minProperties: 2
    SearchResponsePageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
      minProperties: 2
    SystemPermissionQueryItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SystemPermissionIDField'
        key:
          $ref: '#/components/schemas/SystemPermissionKeyField'
        name:
          $ref: '#/components/schemas/SystemPermissionNameField'
        notes:
          $ref: '#/components/schemas/SystemPermissionNotesField'
      required:
      - id
      - key
      minProperties: 2
    SystemPermissionUpdateMask:
      type: string
      examples:
      - key,name,notes
    SystemPermissionPatchSchema:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/SystemPermissionKeyField'
        name:
          $ref: '#/components/schemas/SystemPermissionNameFieldNullable'
        notes:
          $ref: '#/components/schemas/SystemPermissionNotesFieldNullable'
      minProperties: 0
    SystemPermissionNameFieldNullable:
      type:
      - string
      - 'null'
      examples:
      - system.permission:read
    SystemPermissionNotesFieldNullable:
      type:
      - string
      - 'null'
      examples:
      - Read system permissions.
    SystemVariableSearch:
      type: string
      examples:
      - mail
    SystemVariableIDsFilter:
      type: array
      items:
        type: string
        examples:
        - V1StGXR8_Z5jdHi6B-myT
      minItems: 0
      uniqueItems: false
    SystemVariableListLimit:
      type: integer
      default: 20
      description: Maximum number of results. Defaults to 20; values are clamped to
        1-100.
      examples:
      - 20
    SystemVariableListSchema:
      type: array
      items:
        $ref: '#/components/schemas/SystemVariableListItemSchema'
      minItems: 0
      uniqueItems: false
    SystemVariableListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SystemVariableIDField'
        key:
          $ref: '#/components/schemas/SystemVariableKeyField'
        value:
          $ref: '#/components/schemas/SystemVariableValueField'
        name:
          $ref: '#/components/schemas/SystemVariableNameField'
        notes:
          $ref: '#/components/schemas/SystemVariableNotesField'
      required:
      - id
      - key
      - value
      minProperties: 3
    SystemVariableIDField:
      type: string
      examples:
      - V1StGXR8_Z5jdHi6B-myT
    SystemVariableKeyField:
      type: string
      examples:
      - sys_variable_timezone
    SystemVariableValueField:
      type: string
      examples:
      - UTC
    SystemVariableNameField:
      type: string
      examples:
      - default_timezone
    SystemVariableNotesField:
      type: string
      examples:
      - Application default timezone.
    SystemVariableCreateSchema:
      type: object
      properties:
        key:
          type: string
          examples:
          - sys_variable_timezone
        value:
          type: string
          examples:
          - UTC
        name:
          $ref: '#/components/schemas/SystemVariableNameField'
        notes:
          $ref: '#/components/schemas/SystemVariableNotesField'
      required:
      - key
      - value
      minProperties: 2
    SystemVariableDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SystemVariableIDField'
        key:
