components:
  schemas:
    UserIdentityIDField:
      type: string
      examples:
      - usr_a9x1f7Qk2m
    UserAuthSessionListSchema:
      type: object
      properties:
        items:
          $ref: '#/components/schemas/UserAuthSessionListItemsField'
      required:
      - items
      minProperties: 1
    UserAuthSessionListItemsField:
      type: array
      items:
        $ref: '#/components/schemas/UserAuthSessionListItemSchema'
      minItems: 0
      uniqueItems: false
    UserAuthSessionListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserIdentityIDField'
        authenticationType:
          $ref: '#/components/schemas/UserAuthSessionAuthenticationTypeField'
        authenticationReference:
          $ref: '#/components/schemas/UserAuthSessionAuthenticationReferenceField'
        expiresAt:
          $ref: '#/components/schemas/UserAuthSessionTimestampField'
        isPersistent:
          $ref: '#/components/schemas/UserAuthSessionPersistentField'
        createdAt:
          $ref: '#/components/schemas/UserAuthSessionTimestampField'
        updatedAt:
          $ref: '#/components/schemas/UserAuthSessionTimestampField'
      required:
      - id
      - authenticationType
      - authenticationReference
      - expiresAt
      - isPersistent
      - createdAt
      - updatedAt
      minProperties: 7
    UserAuthSessionAuthenticationTypeField:
      type: string
    UserAuthSessionAuthenticationReferenceField:
      type: string
    UserAuthSessionTimestampField:
      type: number
      format: double
    UserAuthSessionPersistentField:
      type: boolean
    DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/DefaultHTTPErrorContentSchema'
        trace:
          $ref: '#/components/schemas/ErrorTraceSchema'
      required:
      - error
      minProperties: 1
    DefaultHTTPErrorContentSchema:
      type: object
      properties:
        message:
          type: string
        reason:
          type: string
      required:
      - message
      - reason
      minProperties: 2
    ErrorTraceSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        reasons:
          $ref: '#/components/schemas/ErrorTraceReasonsSchema'
      required:
      - id
      - message
      minProperties: 2
    ErrorTraceReasonsSchema:
      type: array
      items:
        $ref: '#/components/schemas/ErrorTraceReasonSchema'
      minItems: 0
      uniqueItems: false
    ErrorTraceReasonSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
      - id
      - message
      minProperties: 2
    DeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            examples:
            - id1
          minItems: 0
          uniqueItems: false
      required:
      - ids
      minProperties: 1
    UserIdentitySessionQueryItemSearchRequestQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - createdAt
                examples:
                - id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
            minProperties: 2
          minItems: 0
          uniqueItems: false
        filters:
          type: object
          examples:
          - search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
          minProperties: 0
      required:
      - filters
      minProperties: 1
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      minProperties: 0
    SearchPageSizeField:
      type: integer
      default: 20
      description: Results per page. Defaults to 20 when omitted; values below 1 are
        clamped to 1. Endpoint-specific maximums may apply.
      examples:
      - 20
    SearchPageNumberField:
      type: integer
      default: 1
      description: 1-based page number. Defaults to 1 when omitted; values below 1
        are clamped to 1.
      examples:
      - 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      examples:
      - asc
    SearchStringField:
      type: string
      examples:
      - foo
    UserIdentitySessionQueryItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/UserIdentitySessionQueryItemSearchResponseQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UserIdentitySessionQueryItem'
              minItems: 0
              uniqueItems: false
            total:
              type: integer
              examples:
              - 123
          required:
          - items
          - total
          minProperties: 2
      required:
      - query
      - data
      minProperties: 2
    UserIdentitySessionQueryItemSearchResponseQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchResponsePageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - createdAt
