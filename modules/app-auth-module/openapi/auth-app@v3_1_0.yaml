openapi: 3.1.0
info:
  title: User App API
  version: 0.1.0
tags: []
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/auth/me:
    get:
      operationId: authMe
      responses:
        200:
          $ref: '#/components/responses/AuthMeResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/auth/login:
    post:
      operationId: authLogin
      requestBody:
        $ref: '#/components/requestBodies/AuthLoginRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AuthResponse'
  /api/v1/auth/logout:
    post:
      operationId: authLogout
      responses:
        204:
          description: Logged out
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/auth/magic-link:
    post:
      operationId: authMagicLink
      requestBody:
        $ref: '#/components/requestBodies/AuthMagicLinkRequestBody'
      responses:
        204:
          description: Magic link requested
  /api/v1/auth/magic-link/verify:
    post:
      operationId: authMagicLinkVerify
      requestBody:
        $ref: '#/components/requestBodies/AuthMagicLinkVerifyRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AuthResponse'
        401:
          description: Unauthorized
components:
  schemas:
    AuthResponseSchema:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthUserIdentityDetailSchema'
        roles:
          type: array
          items:
            type: string
          minItems: 0
          uniqueItems: false
        permissions:
          type: array
          items:
            type: string
          minItems: 0
          uniqueItems: false
        token:
          $ref: '#/components/schemas/UserAuthTokenField'
      required:
      - user
      - roles
      - permissions
      - token
      minProperties: 4
    AuthUserIdentityDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserIdentityIDField'
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
      required:
      - id
      - status
      minProperties: 2
    UserIdentityIDField:
      type: string
      examples:
      - usr_a9x1f7Qk2m
    UserIdentityStatusField:
      type: string
      enum:
      - invited
      - active
      - suspended
      - deactivated
      - anonymized
      examples:
      - active
    UserAuthTokenField:
      type: string
      examples:
      - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    AuthLoginRequestSchema:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/AuthEmailField'
        password:
          $ref: '#/components/schemas/AuthPasswordField'
        isPersistent:
          $ref: '#/components/schemas/AuthIsPersistentField'
      required:
      - email
      - password
      - isPersistent
      minProperties: 3
    AuthEmailField:
      type: string
      examples:
      - admin@example.com
    AuthPasswordField:
      type: string
      examples:
      - password
    AuthIsPersistentField:
      type: boolean
      examples:
      - true
    AuthMagicLinkRequestSchema:
      type: object
      properties:
        email:
          type: string
          examples:
          - admin@example.com
        isPersistent:
          type: boolean
          examples:
          - true
      required:
      - email
      - isPersistent
      minProperties: 2
    AuthMagicLinkVerifyRequestSchema:
      type: object
      properties:
        token:
          type: string
          examples:
          - mgl_3XbY...
      required:
      - token
      minProperties: 1
  responses:
    AuthMeResponse:
      description: Auth response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponseSchema'
    AuthResponse:
      description: Auth response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponseSchema'
  requestBodies:
    AuthLoginRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthLoginRequestSchema'
      required: true
    AuthMagicLinkRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthMagicLinkRequestSchema'
      required: true
    AuthMagicLinkVerifyRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthMagicLinkVerifyRequestSchema'
      required: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
