openapi: 3.0.0
info:
  title: Auth Admin API
  version: 0.1.0
tags:
- name: UserIdentities
  description: User identities related endpoints.
- name: AuthCredentials
  description: Manage user credentials.
- name: AuthEmails
- name: AuthRolePermissions
  description: Manage role-permission assignments.
- name: AuthMagicLinks
  description: Manage user magic links.
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/admin/user/identities/{userIdentityId}/sessions:
    get:
      tags:
      - UserIdentities
      operationId: userIdentitySessionList
      parameters:
      - $ref: '#/components/parameters/UserIdentityIdParameter'
      responses:
        200:
          $ref: '#/components/responses/UserIdentitySessionListResponse'
        404:
          description: UserIdentity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - UserIdentities
      operationId: userIdentitySessionRemove
      parameters:
      - $ref: '#/components/parameters/UserIdentityIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
