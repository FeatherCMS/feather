openapi: 3.0.0
info:
  title: User Admin API
  version: 0.1.0
tags:
- name: Auth
  description: Authentication endpoints.
- name: UserIdentities
  description: User identities related endpoints.
- name: AuthCredentials
  description: Manage user credentials.
- name: AuthRolePermissions
  description: Manage role-permission assignments.
- name: AuthMagicLinks
  description: Manage user magic links.
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/admin/auth/me:
    get:
      tags:
      - Auth
      operationId: authMe
      responses:
        200:
          $ref: '#/components/responses/AuthMeResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/auth/login:
    post:
      tags:
      - Auth
      operationId: authLogin
      requestBody:
        $ref: '#/components/requestBodies/AuthLoginRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AuthResponse'
  /api/v1/admin/auth/logout:
    post:
      tags:
      - Auth
      operationId: authLogout
      responses:
        204:
          description: Logged out
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/auth/magic-link:
    post:
      tags:
      - Auth
      operationId: authMagicLink
      requestBody:
        $ref: '#/components/requestBodies/AuthMagicLinkRequestBody'
      responses:
        204:
          description: Magic link requested
  /api/v1/admin/auth/magic-link/verify:
    post:
      tags:
      - Auth
      operationId: authMagicLinkVerify
      requestBody:
        $ref: '#/components/requestBodies/AuthMagicLinkVerifyRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AuthResponse'
  /api/v1/admin/user/identities/{userIdentityId}/sessions:
    get:
      tags:
      - UserIdentities
      operationId: userIdentitySessionList
      parameters:
      - $ref: '#/components/parameters/UserIdentityIdParameter'
      responses:
        200:
          $ref: '#/components/responses/UserIdentitySessionListResponse'
        404:
          description: UserIdentity not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - UserIdentities
      operationId: userIdentitySessionDelete
      parameters:
      - $ref: '#/components/parameters/UserIdentityIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/DeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/user/identities/{userIdentityId}/sessions/{sessionId}: {}
  /api/v1/admin/auth/credentials:
    post:
      tags:
      - AuthCredentials
      operationId: authCredentialCreate
      requestBody:
        $ref: '#/components/requestBodies/AuthCredentialRequestBody'
      responses:
        201:
          $ref: '#/components/responses/AuthCredentialDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - AuthCredentials
      operationId: authCredentialDelete
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/DeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/auth/credentials/:
    get:
      tags:
      - AuthCredentials
      operationId: authCredentialList
      responses:
        200:
          $ref: '#/components/responses/AuthCredentialListResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/auth/credentials/search:
    post:
      tags:
      - AuthCredentials
      operationId: authCredentialSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentialListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/AuthCredentialListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/auth/credentials/{authCredentialId}:
    get:
      tags:
      - AuthCredentials
      operationId: authCredentialGet
      parameters:
      - $ref: '#/components/parameters/AuthCredentialIdParameter'
      responses:
        200:
          $ref: '#/components/responses/AuthCredentialDetailResponse'
        404:
          description: AuthCredential not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - AuthCredentials
      operationId: authCredentialUpdate
      parameters:
      - $ref: '#/components/parameters/AuthCredentialIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/AuthCredentialUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AuthCredentialDetailResponse'
        404:
          description: AuthCredential not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - AuthCredentials
      operationId: authCredentialPatch
      parameters:
      - $ref: '#/components/parameters/AuthCredentialIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/AuthCredentialPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AuthCredentialDetailResponse'
        404:
          description: AuthCredential not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/auth/role-permissions:
    post:
      tags:
      - AuthRolePermissions
      operationId: authRolePermissionCreate
      requestBody:
        $ref: '#/components/requestBodies/AuthRolePermissionRequestBody'
      responses:
        201:
          $ref: '#/components/responses/AuthRolePermissionDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - AuthRolePermissions
      operationId: authRolePermissionDelete
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/DeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/auth/role-permissions/search:
    post:
      tags:
      - AuthRolePermissions
      operationId: authRolePermissionSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRolePermissionListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/AuthRolePermissionListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/auth/role-permissions/{userRoleId}/{systemPermissionId}: {}
  /api/v1/admin/auth/magic-links:
    post:
      tags:
      - AuthMagicLinks
      operationId: authMagicLinkCreate
      requestBody:
        $ref: '#/components/requestBodies/AuthMagicLinkManagementRequestBody'
      responses:
        201:
          $ref: '#/components/responses/AuthMagicLinkDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - AuthMagicLinks
      operationId: authMagicLinkDelete
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/DeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/auth/magic-links/:
    get:
      tags:
      - AuthMagicLinks
      operationId: authMagicLinkList
      responses:
        200:
          $ref: '#/components/responses/AuthMagicLinkListResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/auth/magic-links/search:
    post:
      tags:
      - AuthMagicLinks
      operationId: authMagicLinkSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthMagicLinkListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/AuthMagicLinkListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/auth/magic-links/{authMagicLinkId}:
    get:
      tags:
      - AuthMagicLinks
      operationId: authMagicLinkGet
      parameters:
      - $ref: '#/components/parameters/AuthMagicLinkIdParameter'
      responses:
        200:
          $ref: '#/components/responses/AuthMagicLinkDetailResponse'
        404:
          description: AuthMagicLink not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - AuthMagicLinks
      operationId: authMagicLinkUpdate
      parameters:
      - $ref: '#/components/parameters/AuthMagicLinkIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/AuthMagicLinkUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AuthMagicLinkDetailResponse'
        404:
          description: AuthMagicLink not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - AuthMagicLinks
      operationId: authMagicLinkPatch
      parameters:
      - $ref: '#/components/parameters/AuthMagicLinkIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/AuthMagicLinkPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AuthMagicLinkDetailResponse'
        404:
          description: AuthMagicLink not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
components:
  schemas:
    AuthResponseSchema:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthUserIdentityDetailSchema'
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        token:
          $ref: '#/components/schemas/UserAuthTokenField'
      required:
      - user
      - roles
      - permissions
      - token
    AuthUserIdentityDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserIdentityIDField'
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
      required:
      - id
      - status
    UserIdentityIDField:
      type: string
      example: usr_a9x1f7Qk2m
    UserIdentityStatusField:
      type: string
      enum:
      - invited
      - active
      - suspended
      - deactivated
      - anonymized
      example: active
    UserAuthTokenField:
      type: string
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    AuthLoginRequestSchema:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/UserAuthEmailField'
        password:
          $ref: '#/components/schemas/UserAuthPasswordField'
        isPersistent:
          $ref: '#/components/schemas/UserAuthIsPersistentField'
      required:
      - email
      - password
      - isPersistent
    UserAuthEmailField:
      type: string
      example: admin@example.com
    UserAuthPasswordField:
      type: string
      example: password
    UserAuthIsPersistentField:
      type: boolean
      example: true
    AuthMagicLinkRequestSchema:
      type: object
      properties:
        email:
          type: string
          example: admin@example.com
        isPersistent:
          type: boolean
          example: true
      required:
      - email
      - isPersistent
    AuthMagicLinkVerifyRequestSchema:
      type: object
      properties:
        token:
          type: string
          example: mgl_3XbY...
      required:
      - token
    UserAuthSessionListSchema:
      type: object
      properties:
        items:
          $ref: '#/components/schemas/UserAuthSessionListItemsField'
      required:
      - items
    UserAuthSessionListItemsField:
      type: array
      items:
        $ref: '#/components/schemas/UserAuthSessionListItemSchema'
    UserAuthSessionListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserAuthSessionIdField'
        authenticationType:
          $ref: '#/components/schemas/UserAuthSessionAuthenticationTypeField'
        authenticationReference:
          $ref: '#/components/schemas/UserAuthSessionAuthenticationReferenceField'
        expiresAt:
          $ref: '#/components/schemas/UserAuthSessionTimestampField'
        isPersistent:
          $ref: '#/components/schemas/UserAuthSessionPersistentField'
        createdAt:
          $ref: '#/components/schemas/UserAuthSessionTimestampField'
        updatedAt:
          $ref: '#/components/schemas/UserAuthSessionTimestampField'
      required:
      - id
      - authenticationType
      - authenticationReference
      - expiresAt
      - isPersistent
      - createdAt
      - updatedAt
    UserAuthSessionIdField:
      type: string
      example: sess_3XbY...
    UserAuthSessionAuthenticationTypeField:
      type: string
    UserAuthSessionAuthenticationReferenceField:
      type: string
    UserAuthSessionTimestampField:
      type: number
      format: double
    UserAuthSessionPersistentField:
      type: boolean
    DeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            example: id1
        results:
          type: boolean
          example: true
        summary:
          type: boolean
          example: true
      required:
      - ids
      - results
      - summary
    DeleteResponseSchema:
      type: object
      properties:
        results:
          $ref: '#/components/schemas/DeleteResultListSchema'
        summary:
          $ref: '#/components/schemas/DeleteSummarySchema'
    DeleteResultListSchema:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            example: id1
          status:
            type: string
            enum:
            - deleted
            - not_found
            - forbidden
            example: deleted
        required:
        - id
        - status
    DeleteSummarySchema:
      type: object
      properties:
        requested:
          type: integer
          example: 1
        deleted:
          type: integer
          example: 1
        omitted:
          type: integer
          example: 1
      required:
      - requested
      - deleted
      - omitted
    AuthCredentialCreateSchema:
      type: object
      properties:
        userId:
          type: string
          example: user_7nL3xQ2v
        email:
          type: string
          example: john.doe@example.com
        password:
          type: string
          example: correct-horse-battery-staple
      required:
      - userId
      - email
      - password
    AuthCredentialDetailSchema:
      type: object
      properties:
        id:
          type: string
          example: credential_7nL3xQ2v
        userId:
          type: string
          example: user_7nL3xQ2v
        email:
          type: string
          example: john.doe@example.com
      required:
      - id
      - userId
      - email
    AuthCredentialListSchema:
      type: array
      items:
        $ref: '#/components/schemas/AuthCredentialListItemSchema'
    AuthCredentialListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/AuthCredentialIdField'
        userId:
          $ref: '#/components/schemas/AuthCredentialUserIdField'
        email:
          $ref: '#/components/schemas/AuthCredentialEmailField'
      required:
      - id
      - userId
      - email
    AuthCredentialIdField:
      type: string
      example: credential_7nL3xQ2v
    AuthCredentialUserIdField:
      type: string
      example: user_7nL3xQ2v
    AuthCredentialEmailField:
      type: string
      example: john.doe@example.com
    AuthCredentialListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - userId
                - email
                example: userId
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          example:
            userId: user_7nL3xQ2v
            search: foo
          properties:
            search:
              $ref: '#/components/schemas/AuthCredentialSearchField'
            userId:
              $ref: '#/components/schemas/AuthCredentialUserIdField'
      required:
      - page
      - filters
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
    SearchPageSizeField:
      type: integer
      example: 20
    SearchPageNumberField:
      type: integer
      example: 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      example: asc
    AuthCredentialSearchField:
      type: string
      example: foo
    AuthCredentialListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/AuthCredentialListItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuthCredentialListItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    AuthCredentialPatchSchema:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/AuthCredentialEmailField'
        password:
          $ref: '#/components/schemas/AuthCredentialPasswordField'
    AuthCredentialPasswordField:
      type: string
      example: correct-horse-battery-staple
    AuthRolePermissionCreateSchema:
      type: object
      properties:
        roleId:
          type: string
          example: role_manager
        permissionId:
          type: string
          example: user_roles.list
      required:
      - roleId
      - permissionId
    AuthRolePermissionDetailSchema:
      type: object
      properties:
        roleId:
          $ref: '#/components/schemas/AuthRolePermissionRoleIdField'
        permissionId:
          $ref: '#/components/schemas/AuthRolePermissionPermissionIdField'
      required:
      - roleId
      - permissionId
    AuthRolePermissionRoleIdField:
      type: string
      example: role_manager
    AuthRolePermissionPermissionIdField:
      type: string
      example: user_roles.list
    AuthRolePermissionListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - roleId
                - permissionId
                example: roleId
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          example:
            search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
      required:
      - page
      - filters
    SearchStringField:
      type: string
      example: foo
    AuthRolePermissionListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/AuthRolePermissionListItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuthRolePermissionListItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    AuthRolePermissionListItemSchema:
      type: object
      properties:
        roleId:
          $ref: '#/components/schemas/AuthRolePermissionRoleIdField'
        permissionId:
          $ref: '#/components/schemas/AuthRolePermissionPermissionIdField'
      required:
      - roleId
      - permissionId
    AuthMagicLinkCreateSchema:
      type: object
      properties:
        credentialId:
          type: string
          example: cred_k3P9qN2v
        isPersistent:
          type: boolean
          example: true
      required:
      - credentialId
      - isPersistent
    AuthMagicLinkDetailSchema:
      type: object
      properties:
        id:
          type: string
          example: uml_k3P9qN2v
        credentialId:
          type: string
          example: cred_k3P9qN2v
        token:
          type: string
          example: mgl_3XbY...
        expiresAt:
          type: number
          format: double
          example: 1.76e+9
        isPersistent:
          type: boolean
          example: true
        isUsed:
          type: boolean
          example: false
      required:
      - id
      - credentialId
      - token
      - expiresAt
      - isPersistent
      - isUsed
    AuthMagicLinkListSchema:
      type: array
      items:
        $ref: '#/components/schemas/AuthMagicLinkListItemSchema'
    AuthMagicLinkListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/AuthMagicLinkIdField'
        credentialId:
          $ref: '#/components/schemas/AuthMagicLinkCredentialIdField'
        token:
          $ref: '#/components/schemas/AuthMagicLinkTokenField'
        expiresAt:
          $ref: '#/components/schemas/AuthMagicLinkExpiresAtField'
        isPersistent:
          $ref: '#/components/schemas/AuthMagicLinkIsPersistentField'
        isUsed:
          $ref: '#/components/schemas/AuthMagicLinkIsUsedField'
      required:
      - id
      - credentialId
      - token
      - expiresAt
      - isPersistent
      - isUsed
    AuthMagicLinkIdField:
      type: string
      example: uml_k3P9qN2v
    AuthMagicLinkCredentialIdField:
      type: string
      example: cred_k3P9qN2v
    AuthMagicLinkTokenField:
      type: string
      example: mgl_3XbY...
    AuthMagicLinkExpiresAtField:
      type: number
      format: double
      example: 1.76e+9
    AuthMagicLinkIsPersistentField:
      type: boolean
      example: true
    AuthMagicLinkIsUsedField:
      type: boolean
      example: false
    AuthMagicLinkListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - credentialId
                - token
                - expiresAt
                - isPersistent
                - isUsed
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          example:
            search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
            userId:
              $ref: '#/components/schemas/AuthMagicLinkUserIdField'
      required:
      - page
      - filters
    AuthMagicLinkUserIdField:
      type: string
    AuthMagicLinkListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/AuthMagicLinkListItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuthMagicLinkListItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    AuthMagicLinkPatchSchema:
      type: object
      properties:
        credentialId:
          $ref: '#/components/schemas/AuthMagicLinkCredentialIdField'
        isPersistent:
          $ref: '#/components/schemas/AuthMagicLinkIsPersistentField'
  responses:
    AuthMeResponse:
      description: Auth response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponseSchema'
    AuthResponse:
      description: Auth response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponseSchema'
    UserIdentitySessionListResponse:
      description: UserIdentity session list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserAuthSessionListSchema'
    DeleteResponse:
      description: Delete response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteResponseSchema'
    AuthCredentialDetailResponse:
      description: User credential response
      content:
        application/json:
