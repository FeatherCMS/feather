services:
    tests:
        build:
            context: ../..
            dockerfile: modules/app-auth-module/docker/tests/Dockerfile
        command:
            - swift
            - test
            - --parallel

    openapi-app:
        image: swaggerapi/swagger-ui:v5.32.15
        ports:
            - '8888:8080'
        environment:
            SWAGGER_JSON: /app/auth-app@v3_2_0.yaml
        volumes:
            - './openapi/auth-app@v3_2_0.yaml:/app/auth-app@v3_2_0.yaml:ro'

    openapi-admin:
        image: swaggerapi/swagger-ui:v5.32.15
        ports:
            - '8889:8080'
        environment:
            SWAGGER_JSON: /app/auth-admin@v3_2_0.yaml
        volumes:
            - './openapi/auth-admin@v3_2_0.yaml:/app/auth-admin@v3_2_0.yaml:ro'
