openapi: 3.1.0
info:
  title: Admin API
  version: 0.1.0
tags:
- name: Newsletter
  description: Manage newsletters, issues, and subscribers.
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/admin/newsletter/campaign:
    get:
      tags:
      - Newsletter
      operationId: newsletterCampaignList
      responses:
        200:
          $ref: '#/components/responses/NewsletterCampaignListResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    post:
      tags:
      - Newsletter
      operationId: newsletterCampaignCreate
      requestBody:
        $ref: '#/components/requestBodies/NewsletterCampaignCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/NewsletterCampaignResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Newsletter
      operationId: newsletterCampaignRemove
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/newsletter/campaign/query:
    post:
      tags:
      - Newsletter
      operationId: newsletterCampaignQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsletterCampaignQueryItemSearchRequestQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/NewsletterCampaignQueryItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/newsletter/campaign/{newsletterCampaignKey}:
    get:
      tags:
      - Newsletter
      operationId: newsletterCampaignGet
      parameters:
      - $ref: '#/components/parameters/NewsletterCampaignKeyParameter'
      responses:
        200:
          $ref: '#/components/responses/NewsletterCampaignResponse'
        404:
          description: Newsletter not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Newsletter
      operationId: newsletterCampaignUpdate
      parameters:
      - $ref: '#/components/parameters/NewsletterCampaignKeyParameter'
      - $ref: '#/components/parameters/NewsletterCampaignUpdateMaskParameter'
      requestBody:
        $ref: '#/components/requestBodies/NewsletterCampaignPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/NewsletterCampaignResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        404:
          description: Newsletter not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/newsletter/campaign/{newsletterCampaignKey}/issues:
