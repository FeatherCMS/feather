        $ref: '#/components/requestBodies/NewsletterIssueTestEmailRequestBody'
      responses:
        204:
          description: Test email queued
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/newsletter/campaign/{newsletterCampaignKey}/issues/{newsletterIssueId}:
    get:
      tags:
      - Newsletter
      operationId: newsletterIssueGet
      parameters:
      - $ref: '#/components/parameters/NewsletterCampaignKeyParameter'
      - $ref: '#/components/parameters/NewsletterIssueIdParameter'
      responses:
        200:
          $ref: '#/components/responses/NewsletterIssueResponse'
        404:
          description: Newsletter issue not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Newsletter
      operationId: newsletterIssueUpdate
      parameters:
      - $ref: '#/components/parameters/NewsletterCampaignKeyParameter'
      - $ref: '#/components/parameters/NewsletterIssueIdParameter'
      - $ref: '#/components/parameters/NewsletterIssueUpdateMaskParameter'
      requestBody:
        $ref: '#/components/requestBodies/NewsletterIssuePatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/NewsletterIssueResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        404:
          description: Newsletter issue not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/newsletter/campaign/{newsletterCampaignKey}/issues/{newsletterIssueId}/deliveries:
    get:
      tags:
      - Newsletter
      operationId: newsletterIssueDeliveryList
      parameters:
      - $ref: '#/components/parameters/NewsletterCampaignKeyParameter'
      - $ref: '#/components/parameters/NewsletterIssueIdParameter'
      responses:
        200:
          $ref: '#/components/responses/NewsletterDeliveryListResponse'
        404:
          description: Newsletter issue not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/newsletter/campaign/{newsletterCampaignKey}/issues/{newsletterIssueId}/test-email:
    post:
      tags:
      - Newsletter
      operationId: newsletterIssueTestEmail
      parameters:
      - $ref: '#/components/parameters/NewsletterCampaignKeyParameter'
      - $ref: '#/components/parameters/NewsletterIssueIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/NewsletterIssueTestEmailRequestBody'
      responses:
        204:
          description: Test email queued
        404:
          description: Newsletter issue not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/newsletter/campaign/{newsletterCampaignKey}/subscribers:
    get:
      tags:
      - Newsletter
      operationId: newsletterSubscriberList
      parameters:
      - $ref: '#/components/parameters/NewsletterCampaignKeyParameter'
      responses:
        200:
          $ref: '#/components/responses/NewsletterSubscriberListResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    post:
      tags:
      - Newsletter
      operationId: newsletterSubscriberCreate
      parameters:
      - $ref: '#/components/parameters/NewsletterCampaignKeyParameter'
      requestBody:
        $ref: '#/components/requestBodies/NewsletterSubscriberCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/NewsletterSubscriberResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Newsletter
      operationId: newsletterSubscriberRemove
      parameters:
      - $ref: '#/components/parameters/NewsletterCampaignKeyParameter'
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/newsletter/subscribers/query:
    post:
      operationId: newsletterSubscriberQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsletterSubscriberQueryItemSearchRequestQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/NewsletterSubscriberQueryItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/newsletter/campaign/{newsletterCampaignKey}/subscribers/{email}:
    get:
      tags:
      - Newsletter
      operationId: newsletterSubscriberGet
      parameters:
      - $ref: '#/components/parameters/NewsletterCampaignKeyParameter'
      - $ref: '#/components/parameters/NewsletterSubscriberEmailParameter'
      responses:
        200:
          $ref: '#/components/responses/NewsletterSubscriberResponse'
        404:
          description: Newsletter subscriber not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Newsletter
      operationId: newsletterSubscriberUpdate
      parameters:
      - $ref: '#/components/parameters/NewsletterCampaignKeyParameter'
      - $ref: '#/components/parameters/NewsletterSubscriberEmailParameter'
      - $ref: '#/components/parameters/NewsletterSubscriberUpdateMaskParameter'
      requestBody:
        $ref: '#/components/requestBodies/NewsletterSubscriberPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/NewsletterSubscriberResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        404:
          description: Newsletter subscriber not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
components:
  schemas:
    NewsletterCampaignListSchema:
      type: array
      items:
        $ref: '#/components/schemas/NewsletterCampaignSchema'
      minItems: 0
      uniqueItems: false
    NewsletterCampaignSchema:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        fromEmail:
          type: string
        createdAt:
          type: number
          format: double
        updatedAt:
          type: number
          format: double
      required:
      - key
      - name
      - fromEmail
      - createdAt
      - updatedAt
      minProperties: 5
    DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/DefaultHTTPErrorContentSchema'
        trace:
          $ref: '#/components/schemas/ErrorTraceSchema'
      required:
      - error
      minProperties: 1
    DefaultHTTPErrorContentSchema:
      type: object
      properties:
        message:
          type: string
        reason:
          type: string
      required:
      - message
      - reason
      minProperties: 2
    ErrorTraceSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        reasons:
          $ref: '#/components/schemas/ErrorTraceReasonsSchema'
      required:
      - id
      - message
      minProperties: 2
    ErrorTraceReasonsSchema:
      type: array
      items:
        $ref: '#/components/schemas/ErrorTraceReasonSchema'
      minItems: 0
      uniqueItems: false
    ErrorTraceReasonSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
      - id
      - message
      minProperties: 2
    NewsletterCampaignCreateSchema:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        fromEmail:
          type: string
      required:
      - key
      - name
      - fromEmail
      minProperties: 3
    DeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            examples:
            - id1
          minItems: 0
          uniqueItems: false
      required:
      - ids
      minProperties: 1
    NewsletterCampaignQueryItemSearchRequestQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - key
                - name
                examples:
                - key
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
            minProperties: 2
          minItems: 0
          uniqueItems: false
        filters:
          type: object
          examples:
          - search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
          minProperties: 0
      required:
      - filters
      minProperties: 1
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      minProperties: 0
    SearchPageSizeField:
      type: integer
      default: 20
      description: Results per page. Defaults to 20 when omitted; values below 1 are
        clamped to 1. Endpoint-specific maximums may apply.
      examples:
      - 20
    SearchPageNumberField:
      type: integer
      default: 1
      description: 1-based page number. Defaults to 1 when omitted; values below 1
        are clamped to 1.
      examples:
      - 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      examples:
      - asc
    SearchStringField:
      type: string
      examples:
      - foo
    NewsletterCampaignQueryItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/NewsletterCampaignQueryItemSearchResponseQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/NewsletterCampaignQueryItemSchema'
              minItems: 0
              uniqueItems: false
            total:
              type: integer
              examples:
              - 123
          required:
          - items
          - total
          minProperties: 2
      required:
      - query
      - data
      minProperties: 2
    NewsletterCampaignQueryItemSearchResponseQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchResponsePageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - key
                - name
                examples:
                - key
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
            minProperties: 2
          minItems: 0
          uniqueItems: false
        filters:
          type: object
          examples:
          - search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
          minProperties: 0
      required:
      - page
      - filters
      minProperties: 2
    SearchResponsePageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
      minProperties: 2
    NewsletterCampaignQueryItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/NewsletterIdField'
        key:
          $ref: '#/components/schemas/NewsletterKeyField'
        name:
          $ref: '#/components/schemas/NewsletterNameField'
        fromEmail:
          $ref: '#/components/schemas/NewsletterEmailField'
      required:
      - id
      - key
      - name
      - fromEmail
      minProperties: 4
    NewsletterIdField:
      type: string
    NewsletterKeyField:
      type: string
    NewsletterNameField:
      type: string
    NewsletterEmailField:
      type: string
    NewsletterCampaignUpdateMask:
      type: string
      examples:
      - key,name,fromEmail
    NewsletterCampaignPatchSchema:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/NewsletterKeyField'
        name:
          $ref: '#/components/schemas/NewsletterNameField'
        fromEmail:
          $ref: '#/components/schemas/NewsletterEmailField'
      minProperties: 0
    NewsletterIssueListSchema:
      type: array
      items:
        $ref: '#/components/schemas/NewsletterIssueSchema'
      minItems: 0
      uniqueItems: false
    NewsletterIssueSchema:
      type: object
      properties:
        id:
          type: string
        campaignKey:
          type: string
        subject:
          type: string
        content:
          type: string
        status:
          type: string
        scheduledAt:
          $ref: '#/components/schemas/NewsletterTimestampField'
        sentAt:
          $ref: '#/components/schemas/NewsletterTimestampField'
        createdAt:
          type: number
          format: double
        updatedAt:
          type: number
          format: double
      required:
      - id
      - campaignKey
      - subject
      - content
      - status
      - createdAt
