    post:
      tags:
      - Newsletter
      operationId: newsletterIssueCreate
      parameters:
      - $ref: '#/components/parameters/NewsletterCampaignKeyParameter'
      requestBody:
        $ref: '#/components/requestBodies/NewsletterIssueCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/NewsletterIssueResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Newsletter
      operationId: newsletterIssueRemove
      parameters:
      - $ref: '#/components/parameters/NewsletterCampaignKeyParameter'
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
