        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/newsletter/campaign/{newsletterCampaignKey}/issues/query:
    post:
      tags:
      - Newsletter
      operationId: newsletterIssueQuery
      parameters:
      - $ref: '#/components/parameters/NewsletterCampaignKeyParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsletterIssueQueryItemSearchRequestQuerySchema'
        required: true
