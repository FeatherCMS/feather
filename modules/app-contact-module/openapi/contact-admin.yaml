openapi: 3.0.0
info:
  title: Admin API
  version: 0.1.0
tags:
- name: ContactForms
  description: Manage contact forms, fields, and submissions.
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/admin/contact/form:
    get:
      tags:
      - ContactForms
      operationId: contactFormList
      responses:
        200:
          $ref: '#/components/responses/ContactFormListResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    post:
      tags:
      - ContactForms
      operationId: contactFormCreate
      requestBody:
        $ref: '#/components/requestBodies/ContactFormCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/ContactFormResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - ContactForms
      operationId: contactFormRemove
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/DeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/contact/form/{contactFormKey}:
    get:
      tags:
      - ContactForms
      operationId: contactFormGet
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      responses:
        200:
          $ref: '#/components/responses/ContactFormResponse'
        404:
          description: Contact form not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - ContactForms
      operationId: contactFormUpdate
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      requestBody:
        $ref: '#/components/requestBodies/ContactFormCreateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/ContactFormResponse'
        404:
          description: Contact form not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/contact/field:
    get:
      tags:
      - ContactForms
      operationId: contactFieldList
      responses:
        200:
          $ref: '#/components/responses/FormFieldListResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    post:
      tags:
      - ContactForms
      operationId: contactFieldCreate
      requestBody:
        $ref: '#/components/requestBodies/FormFieldCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/FormFieldResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - ContactForms
      operationId: contactFieldRemove
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/DeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/contact/field/{formFieldId}:
    get:
      tags:
      - ContactForms
      operationId: contactFieldGet
      parameters:
      - $ref: '#/components/parameters/FormFieldIdParameter'
      responses:
        200:
          $ref: '#/components/responses/FormFieldResponse'
        404:
          description: Contact field not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - ContactForms
      operationId: contactFieldUpdate
      parameters:
      - $ref: '#/components/parameters/FormFieldIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/FormFieldPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/FormFieldResponse'
        404:
          description: Contact field not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/contact/form/{contactFormKey}/submission:
    get:
      tags:
      - ContactForms
      operationId: contactFormSubmissionList
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      responses:
        200:
          $ref: '#/components/responses/ContactFormSubmissionListResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - ContactForms
      operationId: contactFormSubmissionRemove
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/DeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/contact/form/{contactFormKey}/submission/{contactFormSubmissionId}:
    get:
      tags:
      - ContactForms
      operationId: contactFormSubmissionGet
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      - $ref: '#/components/parameters/ContactFormSubmissionIdParameter'
      responses:
        200:
          $ref: '#/components/responses/ContactFormSubmissionResponse'
        404:
          description: Contact form submission not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - ContactForms
      operationId: contactFormSubmissionUpdate
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      - $ref: '#/components/parameters/ContactFormSubmissionIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/ContactFormSubmissionPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/ContactFormSubmissionResponse'
        404:
          description: Contact form submission not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
components:
  schemas:
    ContactFormListSchema:
      type: array
      items:
        $ref: '#/components/schemas/ContactFormSchema'
    ContactFormSchema:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        successMessage:
          type: string
        failureMessage:
          type: string
        redirectUrl:
          $ref: '#/components/schemas/ContactContentField'
        items:
          $ref: '#/components/schemas/FormFieldsSchema'
        mails:
          $ref: '#/components/schemas/SubmissionMailsSchema'
        createdAt:
          type: number
          format: double
        updatedAt:
          type: number
          format: double
      required:
      - key
      - name
      - successMessage
      - failureMessage
      - createdAt
      - updatedAt
    ContactContentField:
      type: string
    FormFieldsSchema:
      type: array
      items:
        $ref: '#/components/schemas/FormFieldSchema'
    FormFieldSchema:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        type:
          type: string
        label:
          type: string
        allowedValues:
          $ref: '#/components/schemas/ContactAllowedValuesSchema'
        isRequired:
          type: boolean
        position:
          type: integer
        createdAt:
          type: number
          format: double
        updatedAt:
          type: number
          format: double
      required:
      - id
      - key
      - type
      - label
      - isRequired
      - position
      - createdAt
      - updatedAt
    ContactAllowedValuesSchema:
      type: array
      items:
        type: string
    SubmissionMailsSchema:
      type: array
      items:
        $ref: '#/components/schemas/SubmissionMailSchema'
    SubmissionMailSchema:
      type: object
      properties:
        id:
          type: string
        mailFrom:
          type: string
        mailTo:
          type: string
        subject:
          type: string
        additionalHeaders:
          type: string
        messageBody:
          type: string
        createdAt:
          type: number
          format: double
        updatedAt:
          type: number
          format: double
      required:
      - id
      - mailFrom
      - mailTo
      - subject
      - additionalHeaders
      - messageBody
      - createdAt
      - updatedAt
    ContactFormCreateSchema:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        successMessage:
          $ref: '#/components/schemas/ContactContentField'
        failureMessage:
          $ref: '#/components/schemas/ContactContentField'
        redirectUrl:
          $ref: '#/components/schemas/ContactContentField'
        fieldIds:
          $ref: '#/components/schemas/ContactFieldIDsSchema'
        mails:
          $ref: '#/components/schemas/SubmissionMailInputsSchema'
      required:
      - key
      - name
    ContactFieldIDsSchema:
      type: array
      items:
        type: string
    SubmissionMailInputsSchema:
      type: array
      items:
        $ref: '#/components/schemas/SubmissionMailInputSchema'
    SubmissionMailInputSchema:
      type: object
      properties:
        mailFrom:
          type: string
        mailTo:
          type: string
        subject:
          type: string
        additionalHeaders:
          $ref: '#/components/schemas/ContactContentField'
        messageBody:
          type: string
      required:
      - mailFrom
      - mailTo
      - subject
      - messageBody
    DeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            example: id1
        results:
          type: boolean
          example: true
        summary:
          type: boolean
          example: true
      required:
      - ids
      - results
      - summary
    DeleteResponseSchema:
      type: object
      properties:
        results:
          $ref: '#/components/schemas/DeleteResultListSchema'
        summary:
          $ref: '#/components/schemas/DeleteSummarySchema'
    DeleteResultListSchema:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            example: id1
          status:
            type: string
            enum:
            - deleted
            - not_found
            - forbidden
            example: deleted
        required:
        - id
        - status
    DeleteSummarySchema:
      type: object
      properties:
        requested:
          type: integer
          example: 1
        deleted:
          type: integer
          example: 1
        omitted:
          type: integer
          example: 1
      required:
      - requested
      - deleted
      - omitted
    ContactFormKeyField:
      type: string
    FormFieldListSchema:
      type: array
      items:
        $ref: '#/components/schemas/FormFieldSchema'
    FormFieldCreateSchema:
      type: object
      properties:
        key:
          type: string
        type:
          type: string
        label:
          type: string
        allowedValues:
          $ref: '#/components/schemas/ContactAllowedValuesSchema'
        isRequired:
          $ref: '#/components/schemas/ContactRequiredField'
        position:
          $ref: '#/components/schemas/FormFieldPositionField'
      required:
      - key
      - type
      - label
    ContactRequiredField:
      type: boolean
    FormFieldPositionField:
      type: integer
    ContactIdField:
      type: string
    FormFieldPatchSchema:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/ContactKeyField'
        type:
          $ref: '#/components/schemas/ContactTypeField'
        label:
          $ref: '#/components/schemas/ContactLabelField'
        allowedValues:
          $ref: '#/components/schemas/ContactAllowedValuesSchema'
        isRequired:
          $ref: '#/components/schemas/ContactRequiredField'
        position:
          $ref: '#/components/schemas/FormFieldPositionField'
    ContactKeyField:
      type: string
    ContactTypeField:
      type: string
    ContactLabelField:
      type: string
    ContactFormSubmissionListSchema:
      type: array
      items:
        $ref: '#/components/schemas/ContactFormSubmissionSchema'
    ContactFormSubmissionSchema:
      type: object
      properties:
        id:
          type: string
        formKey:
          type: string
        values:
          type: object
          additionalProperties:
            type: string
        itemsSnapshot:
          type: object
          additionalProperties:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
        createdAt:
          type: number
          format: double
        updatedAt:
          type: number
          format: double
      required:
      - id
      - formKey
      - values
      - itemsSnapshot
      - metadata
      - status
      - createdAt
      - updatedAt
    ContactFormSubmissionPatchSchema:
      type: object
      properties:
        status:
          type: string
      required:
      - status
  responses:
    ContactFormListResponse:
      description: Contact form list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContactFormListSchema'
    ContactFormResponse:
      description: Contact form response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContactFormSchema'
    DeleteResponse:
      description: Delete response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteResponseSchema'
    FormFieldListResponse:
      description: Contact form field list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormFieldListSchema'
    FormFieldResponse:
      description: Contact form field response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormFieldSchema'
    ContactFormSubmissionListResponse:
      description: Contact form submission list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContactFormSubmissionListSchema'
    ContactFormSubmissionResponse:
      description: Contact form submission response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContactFormSubmissionSchema'
  parameters:
    ContactFormKeyParameter:
      name: contactFormKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ContactFormKeyField'
    FormFieldIdParameter:
      name: formFieldId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ContactIdField'
    ContactFormSubmissionIdParameter:
      name: contactFormSubmissionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ContactIdField'
  requestBodies:
    ContactFormCreateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContactFormCreateSchema'
      required: true
    DeleteRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteRequestSchema'
      required: true
    FormFieldCreateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormFieldCreateSchema'
      required: true
    FormFieldPatchRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormFieldPatchSchema'
      required: true
    ContactFormSubmissionPatchRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContactFormSubmissionPatchSchema'
      required: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
