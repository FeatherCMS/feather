openapi: 3.2.0
info:
  title: Admin API
  version: 0.1.0
tags:
- name: ContactForms
  description: Manage contact forms, fields, and submissions.
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/admin/contact/form:
    get:
      tags:
      - ContactForms
      operationId: contactFormList
      responses:
        200:
          $ref: '#/components/responses/ContactFormListResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    post:
      tags:
      - ContactForms
      operationId: contactFormCreate
      requestBody:
        $ref: '#/components/requestBodies/ContactFormCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/ContactFormResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - ContactForms
      operationId: contactFormRemove
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/contact/form/query:
    post:
      tags:
      - ContactForms
      operationId: contactFormQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactFormQueryItemSearchRequestQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/ContactFormQueryItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/contact/form/{contactFormKey}:
    get:
      tags:
      - ContactForms
      operationId: contactFormGet
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      responses:
        200:
          $ref: '#/components/responses/ContactFormResponse'
        404:
          description: Contact form not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    put:
      tags:
      - ContactForms
      operationId: contactFormUpdate
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      requestBody:
        $ref: '#/components/requestBodies/ContactFormCreateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/ContactFormResponse'
        404:
          description: Contact form not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/contact/field:
    get:
      tags:
      - ContactForms
      operationId: contactFieldList
      parameters:
      - $ref: '#/components/parameters/FormFieldListFilterParameter'
      responses:
        200:
          $ref: '#/components/responses/FormFieldListResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    post:
      tags:
      - ContactForms
      operationId: contactFieldCreate
      requestBody:
        $ref: '#/components/requestBodies/FormFieldCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/FormFieldResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - ContactForms
      operationId: contactFieldRemove
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/contact/field/{formFieldId}:
    get:
      tags:
      - ContactForms
      operationId: contactFieldGet
      parameters:
      - $ref: '#/components/parameters/FormFieldIdParameter'
      responses:
        200:
          $ref: '#/components/responses/FormFieldResponse'
        404:
          description: Contact field not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    put:
      tags:
      - ContactForms
      operationId: contactFieldUpdate
      parameters:
      - $ref: '#/components/parameters/FormFieldIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/FormFieldPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/FormFieldResponse'
        404:
          description: Contact field not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/contact/form/{contactFormKey}/submission:
    get:
      tags:
      - ContactForms
      operationId: contactFormSubmissionList
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      responses:
        200:
          $ref: '#/components/responses/ContactFormSubmissionListResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - ContactForms
      operationId: contactFormSubmissionRemove
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/contact/form/{contactFormKey}/submission/{contactFormSubmissionId}:
    get:
      tags:
      - ContactForms
      operationId: contactFormSubmissionGet
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      - $ref: '#/components/parameters/ContactFormSubmissionIdParameter'
      responses:
        200:
          $ref: '#/components/responses/ContactFormSubmissionResponse'
        404:
          description: Contact form submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    patch:
      tags:
      - ContactForms
      operationId: contactFormSubmissionUpdate
      parameters:
      - $ref: '#/components/parameters/ContactFormKeyParameter'
      - $ref: '#/components/parameters/ContactFormSubmissionIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/ContactFormSubmissionPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/ContactFormSubmissionResponse'
        404:
          description: Contact form submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
components:
  schemas:
    ContactFormListSchema:
      type: array
      items:
        $ref: '#/components/schemas/ContactFormSchema'
      minItems: 0
      uniqueItems: false
    ContactFormSchema:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        successMessage:
          type: string
        failureMessage:
          type: string
        redirectUrl:
          $ref: '#/components/schemas/ContactContentField'
        items:
          $ref: '#/components/schemas/FormFieldsSchema'
        mails:
          $ref: '#/components/schemas/SubmissionMailsSchema'
        createdAt:
          type: number
          format: double
        updatedAt:
          type: number
          format: double
      required:
      - key
      - name
      - successMessage
      - failureMessage
      - createdAt
      - updatedAt
      minProperties: 6
    ContactContentField:
      type: string
    FormFieldsSchema:
      type: array
      items:
        $ref: '#/components/schemas/FormFieldSchema'
      minItems: 0
      uniqueItems: false
    FormFieldSchema:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        type:
          type: string
        label:
          type: string
        allowedValues:
          $ref: '#/components/schemas/ContactAllowedValuesSchema'
        isRequired:
          type: boolean
        position:
          type: integer
        createdAt:
          type: number
          format: double
        updatedAt:
          type: number
          format: double
      required:
      - id
      - key
      - type
      - label
      - isRequired
      - position
      - createdAt
      - updatedAt
      minProperties: 8
    ContactAllowedValuesSchema:
      type: array
      items:
        type: string
      minItems: 0
      uniqueItems: false
    SubmissionMailsSchema:
      type: array
      items:
        $ref: '#/components/schemas/SubmissionMailSchema'
      minItems: 0
      uniqueItems: false
    SubmissionMailSchema:
      type: object
      properties:
        id:
          type: string
        mailFrom:
          type: string
        mailTo:
          type: string
        subject:
          type: string
        additionalHeaders:
          type: array
          items:
            type: string
          minItems: 0
          uniqueItems: false
        messageBody:
          type: string
        createdAt:
          type: number
          format: double
        updatedAt:
          type: number
          format: double
      required:
      - id
      - mailFrom
      - mailTo
      - subject
      - additionalHeaders
      - messageBody
      - createdAt
      - updatedAt
      minProperties: 8
    DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/DefaultHTTPErrorContentSchema'
        trace:
          $ref: '#/components/schemas/ErrorTraceSchema'
      required:
      - error
      minProperties: 1
    DefaultHTTPErrorContentSchema:
      type: object
      properties:
        message:
          type: string
        reason:
          type: string
      required:
      - message
      - reason
      minProperties: 2
    ErrorTraceSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        reasons:
          $ref: '#/components/schemas/ErrorTraceReasonsSchema'
      required:
      - id
      - message
      minProperties: 2
    ErrorTraceReasonsSchema:
      type: array
      items:
        $ref: '#/components/schemas/ErrorTraceReasonSchema'
      minItems: 0
      uniqueItems: false
    ErrorTraceReasonSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
      - id
      - message
      minProperties: 2
    ContactFormCreateSchema:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        successMessage:
          $ref: '#/components/schemas/ContactContentField'
        failureMessage:
          $ref: '#/components/schemas/ContactContentField'
        redirectUrl:
          $ref: '#/components/schemas/ContactContentField'
        fieldIds:
          $ref: '#/components/schemas/ContactFieldIDsSchema'
        mails:
          $ref: '#/components/schemas/SubmissionMailInputsSchema'
      required:
      - key
      - name
      minProperties: 2
    ContactFieldIDsSchema:
      type: array
      items:
        type: string
      minItems: 0
      uniqueItems: false
    SubmissionMailInputsSchema:
      type: array
      items:
        $ref: '#/components/schemas/SubmissionMailInputSchema'
      minItems: 0
      uniqueItems: false
    SubmissionMailInputSchema:
      type: object
      properties:
        mailFrom:
          type: string
        mailTo:
          type: string
        subject:
          type: string
        additionalHeaders:
          $ref: '#/components/schemas/ContactAdditionalHeadersSchema'
        messageBody:
          type: string
      required:
      - mailFrom
      - mailTo
      - subject
      - messageBody
      minProperties: 4
    ContactAdditionalHeadersSchema:
      type: array
      items:
        type: string
      minItems: 0
      uniqueItems: false
    DeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            examples:
            - id1
          minItems: 0
          uniqueItems: false
      required:
      - ids
      minProperties: 1
    ContactFormQueryItemSearchRequestQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - key
                - name
                examples:
                - key
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
            minProperties: 2
          minItems: 0
          uniqueItems: false
        filters:
          type: object
          examples:
          - search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
          minProperties: 0
      required:
      - filters
      minProperties: 1
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      minProperties: 0
    SearchPageSizeField:
      type: integer
      default: 20
      description: Results per page. Defaults to 20 when omitted; values below 1 are
        clamped to 1. Endpoint-specific maximums may apply.
      examples:
      - 20
    SearchPageNumberField:
      type: integer
      default: 1
      description: 1-based page number. Defaults to 1 when omitted; values below 1
        are clamped to 1.
      examples:
      - 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      examples:
      - asc
    SearchStringField:
      type: string
      examples:
      - foo
    ContactFormQueryItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/ContactFormQueryItemSearchResponseQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ContactFormQueryItemSchema'
              minItems: 0
              uniqueItems: false
            total:
              type: integer
              examples:
              - 123
          required:
          - items
          - total
          minProperties: 2
      required:
      - query
      - data
      minProperties: 2
    ContactFormQueryItemSearchResponseQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchResponsePageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - key
                - name
                examples:
                - key
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
            minProperties: 2
          minItems: 0
          uniqueItems: false
        filters:
          type: object
          examples:
          - search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
          minProperties: 0
      required:
      - page
      - filters
      minProperties: 2
    SearchResponsePageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
      minProperties: 2
    ContactFormQueryItemSchema:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
      required:
      - id
      - key
      - name
      minProperties: 3
    ContactFormKeyField:
      type: string
    FormFieldListSchema:
      type: array
      items:
        $ref: '#/components/schemas/FormFieldSchema'
      minItems: 0
      uniqueItems: false
    FormFieldCreateSchema:
      type: object
      properties:
        key:
          type: string
        type:
          type: string
        label:
          type: string
        allowedValues:
          $ref: '#/components/schemas/ContactAllowedValuesSchema'
        isRequired:
          $ref: '#/components/schemas/ContactRequiredField'
        position:
          $ref: '#/components/schemas/FormFieldPositionField'
      required:
      - key
      - type
      - label
      minProperties: 3
    ContactRequiredField:
      type: boolean
    FormFieldPositionField:
      type: integer
    ContactIdField:
      type: string
    FormFieldPatchSchema:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/ContactKeyField'
        type:
          $ref: '#/components/schemas/ContactTypeField'
        label:
          $ref: '#/components/schemas/ContactLabelField'
        allowedValues:
          $ref: '#/components/schemas/ContactAllowedValuesSchema'
        isRequired:
          $ref: '#/components/schemas/ContactRequiredField'
        position:
          $ref: '#/components/schemas/FormFieldPositionField'
      minProperties: 0
    ContactKeyField:
      type: string
    ContactTypeField:
      type: string
    ContactLabelField:
      type: string
    ContactFormSubmissionListSchema:
      type: array
      items:
        $ref: '#/components/schemas/ContactFormSubmissionSchema'
      minItems: 0
      uniqueItems: false
    ContactFormSubmissionSchema:
      type: object
      properties:
        id:
          type: string
        formKey:
          type: string
        values:
          type: object
          additionalProperties:
            type: string
          minProperties: 0
        itemsSnapshot:
          type: object
          additionalProperties:
            type: string
          minProperties: 0
        metadata:
          type: object
          additionalProperties:
            type: string
          minProperties: 0
        status:
          type: string
        createdAt:
          type: number
          format: double
        updatedAt:
          type: number
          format: double
      required:
      - id
      - formKey
      - values
      - itemsSnapshot
      - metadata
      - status
      - createdAt
      - updatedAt
      minProperties: 8
    ContactFormSubmissionPatchSchema:
      type: object
      properties:
        status:
          type: string
      required:
      - status
      minProperties: 1
  responses:
    ContactFormListResponse:
      description: Contact form list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContactFormListSchema'
    ContactFormResponse:
      description: Contact form response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContactFormSchema'
    NoContentResponse:
      description: Delete succeeded
    ContactFormQueryItemSearchSchemaSearchResponse:
      description: Search response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContactFormQueryItemSearchSchema'
    FormFieldListResponse:
      description: Contact form field list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormFieldListSchema'
    FormFieldResponse:
      description: Contact form field response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormFieldSchema'
    ContactFormSubmissionListResponse:
      description: Contact form submission list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContactFormSubmissionListSchema'
    ContactFormSubmissionResponse:
      description: Contact form submission response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContactFormSubmissionSchema'
  parameters:
    ContactFormKeyParameter:
      name: contactFormKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ContactFormKeyField'
    FormFieldListFilterParameter:
      name: form
      allowEmptyValue: true
      in: query
      schema:
        $ref: '#/components/schemas/ContactFormKeyField'
      description: Filter fields by form key or use __unassigned__ for fields not
        assigned to a form.
    FormFieldIdParameter:
      name: formFieldId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ContactIdField'
    ContactFormSubmissionIdParameter:
      name: contactFormSubmissionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ContactIdField'
  requestBodies:
    ContactFormCreateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContactFormCreateSchema'
      required: true
    DeleteRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteRequestSchema'
      required: true
    FormFieldCreateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormFieldCreateSchema'
      required: true
    FormFieldPatchRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormFieldPatchSchema'
      required: true
