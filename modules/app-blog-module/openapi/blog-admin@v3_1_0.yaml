      operationId: blogAuthorLinkDelete
      parameters:
      - $ref: '#/components/parameters/BlogAuthorLinkMenuIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/DeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/authors/{blogAuthorId}/links/:
    get:
      tags:
      - BlogAuthorLinks
      operationId: blogAuthorLinkList
      parameters:
      - $ref: '#/components/parameters/BlogAuthorLinkMenuIdParameter'
      responses:
        200:
          $ref: '#/components/responses/BlogAuthorLinkListResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
