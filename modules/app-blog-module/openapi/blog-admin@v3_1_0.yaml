  /api/v1/admin/blog/authors/search:
    post:
      tags:
      - BlogAuthors
      operationId: blogAuthorSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogAuthorListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/BlogAuthorListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/authors/{blogAuthorId}:
    get:
      tags:
      - BlogAuthors
      operationId: blogAuthorGet
      parameters:
