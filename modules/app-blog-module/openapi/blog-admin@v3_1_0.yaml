        required: true
      responses:
        200:
          $ref: '#/components/responses/BlogAuthorLinkListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/authors/{blogAuthorId}/links/{blogAuthorLinkId}:
    get:
      tags:
      - BlogAuthorLinks
      operationId: blogAuthorLinkGet
      parameters:
      - $ref: '#/components/parameters/BlogAuthorLinkMenuIdParameter'
      - $ref: '#/components/parameters/BlogAuthorLinkIdParameter'
      responses:
        200:
          $ref: '#/components/responses/BlogAuthorLinkDetailResponse'
        404:
          description: BlogAuthorLink not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - BlogAuthorLinks
      operationId: blogAuthorLinkUpdate
      parameters:
      - $ref: '#/components/parameters/BlogAuthorLinkMenuIdParameter'
      - $ref: '#/components/parameters/BlogAuthorLinkIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/BlogAuthorLinkUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BlogAuthorLinkDetailResponse'
        404:
          description: BlogAuthorLink not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - BlogAuthorLinks
      operationId: blogAuthorLinkPatch
      parameters:
      - $ref: '#/components/parameters/BlogAuthorLinkMenuIdParameter'
      - $ref: '#/components/parameters/BlogAuthorLinkIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/BlogAuthorLinkPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BlogAuthorLinkDetailResponse'
        404:
          description: BlogAuthorLink not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/settings:
    get:
      tags:
      - BlogSettings
      operationId: blogSettingsGet
      responses:
        200:
          $ref: '#/components/responses/BlogSettingsDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - BlogSettings
      operationId: blogSettingsUpdate
      requestBody:
        $ref: '#/components/requestBodies/BlogSettingsUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BlogSettingsDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/tags:
    post:
      tags:
      - BlogTags
      operationId: blogTagCreate
      requestBody:
        $ref: '#/components/requestBodies/BlogTagRequestBody'
      responses:
        201:
          $ref: '#/components/responses/BlogTagDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - BlogTags
      operationId: blogTagDelete
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/DeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/tags/:
    get:
      tags:
      - BlogTags
      operationId: blogTagList
      responses:
        200:
          $ref: '#/components/responses/BlogTagListResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/tags/search:
    post:
      tags:
      - BlogTags
      operationId: blogTagSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogTagListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/BlogTagListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/tags/{blogTagId}:
    get:
      tags:
      - BlogTags
      operationId: blogTagGet
      parameters:
      - $ref: '#/components/parameters/BlogTagIdParameter'
      responses:
        200:
          $ref: '#/components/responses/BlogTagDetailResponse'
        404:
          description: BlogTag not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - BlogTags
      operationId: blogTagUpdate
      parameters:
      - $ref: '#/components/parameters/BlogTagIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/BlogTagUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BlogTagDetailResponse'
        404:
          description: BlogTag not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - BlogTags
      operationId: blogTagPatch
      parameters:
      - $ref: '#/components/parameters/BlogTagIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/BlogTagPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BlogTagDetailResponse'
        404:
          description: BlogTag not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
components:
  schemas:
    BlogPostCreateSchema:
      type: object
      properties:
        title:
          type: string
          examples:
          - Hello world
        excerpt:
          type: string
          examples:
          - Short post summary.
        content:
          type: string
          examples:
          - <h1>Homepage</h1>
        imageAssetId:
          $ref: '#/components/schemas/BlogPostImageAssetIdField'
        authorIds:
          $ref: '#/components/schemas/BlogPostAuthorIdsField'
        tagIds:
          $ref: '#/components/schemas/BlogPostTagIdsField'
      required:
      - title
      - excerpt
      - content
      minProperties: 3
    BlogPostImageAssetIdField:
      type: string
      examples:
      - media_asset_1
    BlogPostAuthorIdsField:
      type: array
      items:
        $ref: '#/components/schemas/BlogAuthorIdField'
      minItems: 0
      uniqueItems: false
    BlogAuthorIdField:
      type: string
      examples:
      - wm_header
    BlogPostTagIdsField:
      type: array
      items:
        $ref: '#/components/schemas/BlogTagIdField'
      minItems: 0
      uniqueItems: false
    BlogTagIdField:
      type: string
      examples:
      - wp_home
    BlogPostDetailSchema:
      type: object
      properties:
        id:
          type: string
          examples:
          - wp_home
        title:
          type: string
          examples:
          - Hello world
        excerpt:
          type: string
          examples:
          - Short post summary.
        content:
          type: string
          examples:
          - <h1>Homepage</h1>
        imageAssetId:
          $ref: '#/components/schemas/BlogPostImageAssetIdField'
        authorIds:
          $ref: '#/components/schemas/BlogPostAuthorIdsField'
        tagIds:
          $ref: '#/components/schemas/BlogPostTagIdsField'
        metadata:
          $ref: '#/components/schemas/WebMetadataDetailSchema'
        createdAt:
          type: number
          format: double
          examples:
          - 1.76e+9
        updatedAt:
          type: number
          format: double
          examples:
          - 1.76e+9
      required:
      - id
      - title
      - excerpt
      - content
      - authorIds
      - tagIds
      - metadata
      - createdAt
      - updatedAt
      minProperties: 9
    WebMetadataDetailSchema:
      type: object
      properties:
        id:
          type: string
          examples:
          - metadata_homepage
        referenceType:
          $ref: '#/components/schemas/AdminWebMetadataReferenceTypeField'
        referenceId:
          $ref: '#/components/schemas/AdminWebMetadataReferenceIDField'
        slug:
          type: string
          examples:
          - homepage
        template:
          type: string
          examples:
          - default
        publicationDate:
          type:
          - number
          - 'null'
        expirationDate:
          type:
          - number
          - 'null'
        status:
          type: string
          examples:
          - draft
        title:
          type:
          - string
          - 'null'
        excerpt:
          type:
          - string
          - 'null'
        imageUrl:
          type:
          - string
          - 'null'
        canonicalUrl:
          type:
          - string
          - 'null'
        noIndex:
          type: boolean
          examples:
          - false
        primaryKeyword:
          type: string
          examples:
          - homepage seo
        cssCodeInjection:
          type:
          - string
          - 'null'
        javascriptCodeInjection:
          type:
          - string
          - 'null'
        structuredDataCodeInjection:
          type:
          - string
          - 'null'
        createdAt:
          type: number
          format: double
          examples:
          - 1.76e+9
        updatedAt:
          type: number
          format: double
          examples:
          - 1.76e+9
      required:
      - id
      - slug
      - template
      - status
      - noIndex
      - primaryKeyword
      - createdAt
      - updatedAt
      minProperties: 8
    AdminWebMetadataReferenceTypeField:
      type: string
      examples:
      - web.page
    AdminWebMetadataReferenceIDField:
      type: string
      examples:
      - wp_home
    DeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            examples:
            - id1
          minItems: 0
          uniqueItems: false
        results:
          type: boolean
          examples:
          - true
        summary:
          type: boolean
          examples:
          - true
      required:
      - ids
      - results
      - summary
      minProperties: 3
    DeleteResponseSchema:
      type: object
      properties:
        results:
          $ref: '#/components/schemas/DeleteResultListSchema'
        summary:
          $ref: '#/components/schemas/DeleteSummarySchema'
      minProperties: 0
    DeleteResultListSchema:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            examples:
            - id1
          status:
            type: string
            enum:
            - deleted
            - not_found
            - forbidden
            examples:
            - deleted
        required:
        - id
        - status
        minProperties: 2
      minItems: 0
      uniqueItems: false
    DeleteSummarySchema:
      type: object
      properties:
        requested:
          type: integer
          examples:
          - 1
        deleted:
          type: integer
          examples:
          - 1
        omitted:
          type: integer
          examples:
          - 1
      required:
      - requested
      - deleted
      - omitted
      minProperties: 3
    BlogPostListSchema:
      type: array
      items:
        $ref: '#/components/schemas/BlogPostListItemSchema'
      minItems: 0
      uniqueItems: false
    BlogPostListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/BlogPostIdField'
        title:
          $ref: '#/components/schemas/BlogPostTitleField'
        excerpt:
          $ref: '#/components/schemas/BlogPostExcerptField'
        imageAssetId:
          $ref: '#/components/schemas/BlogPostImageAssetIdField'
        createdAt:
          $ref: '#/components/schemas/BlogPostCreatedAtField'
        updatedAt:
          $ref: '#/components/schemas/BlogPostUpdatedAtField'
      required:
      - id
      - title
      - excerpt
      - createdAt
      - updatedAt
      minProperties: 5
    BlogPostIdField:
      type: string
      examples:
      - wp_home
    BlogPostTitleField:
      type: string
      examples:
      - Hello world
    BlogPostExcerptField:
      type: string
      examples:
      - Short post summary.
    BlogPostCreatedAtField:
      type: number
      format: double
      examples:
      - 1.76e+9
    BlogPostUpdatedAtField:
      type: number
      format: double
      examples:
      - 1.76e+9
    BlogPostListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - title
                - createdAt
                - updatedAt
                examples:
                - id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
            minProperties: 2
          minItems: 0
          uniqueItems: false
        filters:
          type: object
          examples:
          - search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
          minProperties: 0
      required:
      - page
      - filters
      minProperties: 2
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
      minProperties: 2
    SearchPageSizeField:
      type: integer
      examples:
      - 20
    SearchPageNumberField:
      type: integer
      examples:
      - 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      examples:
      - asc
    SearchStringField:
      type: string
      examples:
      - foo
    BlogPostListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/BlogPostListItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/BlogPostListItemSchema'
              minItems: 0
              uniqueItems: false
            total:
              type: integer
              examples:
              - 123
          required:
          - items
          - total
          minProperties: 2
      required:
      - query
      - data
      minProperties: 2
    BlogPostPatchSchema:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/BlogPostTitleField'
        excerpt:
          $ref: '#/components/schemas/BlogPostExcerptField'
        content:
          $ref: '#/components/schemas/BlogPostContentField'
        imageAssetId:
          $ref: '#/components/schemas/BlogPostImageAssetIdField'
        authorIds:
          $ref: '#/components/schemas/BlogPostAuthorIdsField'
        tagIds:
          $ref: '#/components/schemas/BlogPostTagIdsField'
      minProperties: 0
    BlogPostContentField:
      type: string
      examples:
      - <h1>Homepage</h1>
    BlogAuthorCreateSchema:
      type: object
      properties:
        name:
          type: string
          examples:
          - Header menu
        excerpt:
          $ref: '#/components/schemas/BlogAuthorExcerptField'
        content:
          $ref: '#/components/schemas/BlogAuthorContentField'
        profileImageAssetId:
          $ref: '#/components/schemas/BlogAuthorProfileImageAssetIdField'
      required:
      - name
      minProperties: 1
    BlogAuthorExcerptField:
      type: string
      examples:
      - Short author summary.
    BlogAuthorContentField:
      type: string
      examples:
      - Author biography.
    BlogAuthorProfileImageAssetIdField:
      type: string
      examples:
      - media_asset_1
    BlogAuthorDetailSchema:
      type: object
      properties:
        id:
          type: string
          examples:
          - wm_header
        name:
          type: string
          examples:
          - Header menu
        excerpt:
          type: string
          examples:
          - Short author summary.
        content:
          type: string
          examples:
          - Author biography.
        profileImageAssetId:
          $ref: '#/components/schemas/BlogAuthorProfileImageAssetIdField'
        metadata:
          $ref: '#/components/schemas/WebMetadataDetailSchema'
        createdAt:
          type: number
          format: double
          examples:
          - 1.76e+9
        updatedAt:
          type: number
          format: double
          examples:
          - 1.76e+9
      required:
      - id
      - name
      - excerpt
      - content
      - metadata
      - createdAt
      - updatedAt
      minProperties: 7
    BlogAuthorListSchema:
      type: array
      items:
        $ref: '#/components/schemas/BlogAuthorListItemSchema'
      minItems: 0
      uniqueItems: false
    BlogAuthorListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/BlogAuthorIdField'
        name:
          $ref: '#/components/schemas/BlogAuthorNameField'
        excerpt:
          $ref: '#/components/schemas/BlogAuthorExcerptField'
