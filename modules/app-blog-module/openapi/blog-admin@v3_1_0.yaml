      requestBody:
        $ref: '#/components/requestBodies/BlogAuthorUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BlogAuthorDetailResponse'
        404:
          description: BlogAuthor not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - BlogAuthors
      operationId: blogAuthorPatch
      parameters:
      - $ref: '#/components/parameters/BlogAuthorIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/BlogAuthorPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BlogAuthorDetailResponse'
        404:
          description: BlogAuthor not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/authors/{blogAuthorId}/links:
    post:
      tags:
