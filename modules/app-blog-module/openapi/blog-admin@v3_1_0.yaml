openapi: 3.1.0
info:
  title: Blog Admin API
  version: 0.1.0
tags:
- name: BlogPosts
  description: Manage blog posts.
- name: BlogAuthors
  description: Manage blog authors.
- name: BlogAuthorLinks
  description: Manage blog author links.
- name: BlogSettings
  description: Manage blog settings.
- name: BlogTags
  description: Manage blog tags.
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/admin/blog/posts:
    post:
      tags:
      - BlogPosts
      operationId: blogPostCreate
      requestBody:
        $ref: '#/components/requestBodies/BlogPostRequestBody'
      responses:
        201:
          $ref: '#/components/responses/BlogPostDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - BlogPosts
      operationId: blogPostDelete
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/DeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/posts/:
    get:
      tags:
      - BlogPosts
      operationId: blogPostList
      responses:
        200:
          $ref: '#/components/responses/BlogPostListResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/posts/search:
    post:
      tags:
      - BlogPosts
      operationId: blogPostSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogPostListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/BlogPostListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/posts/{blogPostId}:
    get:
      tags:
      - BlogPosts
      operationId: blogPostGet
      parameters:
      - $ref: '#/components/parameters/BlogPostIdParameter'
      responses:
        200:
          $ref: '#/components/responses/BlogPostDetailResponse'
        404:
          description: BlogPost not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - BlogPosts
      operationId: blogPostUpdate
      parameters:
      - $ref: '#/components/parameters/BlogPostIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/BlogPostUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BlogPostDetailResponse'
        404:
          description: BlogPost not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - BlogPosts
      operationId: blogPostPatch
      parameters:
      - $ref: '#/components/parameters/BlogPostIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/BlogPostPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BlogPostDetailResponse'
        404:
          description: BlogPost not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/authors:
    post:
      tags:
      - BlogAuthors
      operationId: blogAuthorCreate
