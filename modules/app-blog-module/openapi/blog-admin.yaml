components:
  schemas:
    AuthorListSchema:
      type: array
      items:
        $ref: '#/components/schemas/AuthorListItemSchema'
    AuthorListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/BlogAuthorIdField'
        name:
          $ref: '#/components/schemas/BlogAuthorNameField'
        excerpt:
          $ref: '#/components/schemas/BlogAuthorExcerptField'
        profileImageAssetId:
          $ref: '#/components/schemas/BlogAuthorProfileImageAssetIdField'
        createdAt:
          $ref: '#/components/schemas/BlogAuthorCreatedAtField'
        updatedAt:
          $ref: '#/components/schemas/BlogAuthorUpdatedAtField'
      required:
      - id
      - name
      - excerpt
      - createdAt
      - updatedAt
    BlogAuthorIdField:
      type: string
      example: wm_header
    BlogAuthorNameField:
      type: string
