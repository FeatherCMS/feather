        required: true
      responses:
        200:
          $ref: '#/components/responses/BlogAuthorListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/authors/{blogAuthorId}:
    get:
      tags:
      - BlogAuthors
      operationId: blogAuthorGet
      parameters:
      - $ref: '#/components/parameters/BlogAuthorIdParameter'
      responses:
        200:
          $ref: '#/components/responses/BlogAuthorDetailResponse'
        404:
          description: BlogAuthor not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - BlogAuthors
      operationId: blogAuthorUpdate
      parameters:
      - $ref: '#/components/parameters/BlogAuthorIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/BlogAuthorUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BlogAuthorDetailResponse'
        404:
          description: BlogAuthor not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - BlogAuthors
      operationId: blogAuthorDelete
      parameters:
      - $ref: '#/components/parameters/BlogAuthorIdParameter'
      responses:
        204:
          description: BlogAuthor deleted
        404:
          description: BlogAuthor not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - BlogAuthors
      operationId: blogAuthorPatch
      parameters:
      - $ref: '#/components/parameters/BlogAuthorIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/BlogAuthorPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BlogAuthorDetailResponse'
        404:
          description: BlogAuthor not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/authors/{blogAuthorId}/links:
    post:
      tags:
      - BlogAuthorLinks
      operationId: blogAuthorLinkCreate
      parameters:
      - $ref: '#/components/parameters/BlogAuthorLinkMenuIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/BlogAuthorLinkRequestBody'
      responses:
        201:
          $ref: '#/components/responses/BlogAuthorLinkDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/authors/{blogAuthorId}/links/filters:
    get:
      tags:
      - BlogAuthorLinks
      operationId: blogAuthorLinkFilters
      parameters:
      - $ref: '#/components/parameters/BlogAuthorLinkMenuIdParameter'
      responses:
        200:
          $ref: '#/components/responses/BlogAuthorLinkFiltersResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/authors/{blogAuthorId}/links/search:
    post:
      tags:
      - BlogAuthorLinks
      operationId: blogAuthorLinkSearch
      parameters:
      - $ref: '#/components/parameters/BlogAuthorLinkMenuIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogAuthorLinkListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/BlogAuthorLinkListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/authors/{blogAuthorId}/links/{blogAuthorLinkId}:
    get:
      tags:
      - BlogAuthorLinks
      operationId: blogAuthorLinkGet
      parameters:
      - $ref: '#/components/parameters/BlogAuthorLinkMenuIdParameter'
      - $ref: '#/components/parameters/BlogAuthorLinkIdParameter'
      responses:
        200:
          $ref: '#/components/responses/BlogAuthorLinkDetailResponse'
        404:
          description: BlogAuthorLink not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - BlogAuthorLinks
      operationId: blogAuthorLinkUpdate
      parameters:
      - $ref: '#/components/parameters/BlogAuthorLinkMenuIdParameter'
      - $ref: '#/components/parameters/BlogAuthorLinkIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/BlogAuthorLinkUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BlogAuthorLinkDetailResponse'
        404:
          description: BlogAuthorLink not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - BlogAuthorLinks
      operationId: blogAuthorLinkDelete
      parameters:
      - $ref: '#/components/parameters/BlogAuthorLinkMenuIdParameter'
      - $ref: '#/components/parameters/BlogAuthorLinkIdParameter'
      responses:
        204:
          description: BlogAuthorLink deleted
        404:
          description: BlogAuthorLink not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - BlogAuthorLinks
      operationId: blogAuthorLinkPatch
      parameters:
      - $ref: '#/components/parameters/BlogAuthorLinkMenuIdParameter'
      - $ref: '#/components/parameters/BlogAuthorLinkIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/BlogAuthorLinkPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BlogAuthorLinkDetailResponse'
        404:
          description: BlogAuthorLink not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/settings:
    get:
      tags:
      - BlogSettings
      operationId: blogSettingsGet
      responses:
        200:
          $ref: '#/components/responses/BlogSettingsDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - BlogSettings
      operationId: blogSettingsUpdate
      requestBody:
        $ref: '#/components/requestBodies/BlogSettingsUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BlogSettingsDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/tags:
    post:
      tags:
      - BlogTags
      operationId: blogTagCreate
      requestBody:
        $ref: '#/components/requestBodies/BlogTagRequestBody'
      responses:
        201:
          $ref: '#/components/responses/BlogTagDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/tags/filters:
    get:
      tags:
      - BlogTags
      operationId: blogTagFilters
      responses:
        200:
          $ref: '#/components/responses/BlogTagFiltersResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/tags/search:
    post:
      tags:
      - BlogTags
      operationId: blogTagSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogTagListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/BlogTagListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/blog/tags/{blogTagId}:
    get:
      tags:
      - BlogTags
      operationId: blogTagGet
      parameters:
      - $ref: '#/components/parameters/BlogTagIdParameter'
      responses:
        200:
          $ref: '#/components/responses/BlogTagDetailResponse'
        404:
          description: BlogTag not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - BlogTags
      operationId: blogTagUpdate
      parameters:
      - $ref: '#/components/parameters/BlogTagIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/BlogTagUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BlogTagDetailResponse'
        404:
          description: BlogTag not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - BlogTags
      operationId: blogTagDelete
      parameters:
      - $ref: '#/components/parameters/BlogTagIdParameter'
      responses:
        204:
          description: BlogTag deleted
        404:
          description: BlogTag not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - BlogTags
      operationId: blogTagPatch
      parameters:
      - $ref: '#/components/parameters/BlogTagIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/BlogTagPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/BlogTagDetailResponse'
        404:
          description: BlogTag not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
components:
  schemas:
    BlogPostCreateSchema:
      type: object
      properties:
        title:
          type: string
          example: Hello world
        excerpt:
          type: string
          example: Short post summary.
        content:
          type: string
          example: <h1>Homepage</h1>
        imageAssetId:
          $ref: '#/components/schemas/BlogPostImageAssetIdField'
        authorIds:
          $ref: '#/components/schemas/BlogPostAuthorIdsField'
        tagIds:
          $ref: '#/components/schemas/BlogPostTagIdsField'
      required:
      - title
      - excerpt
      - content
    BlogPostImageAssetIdField:
      type: string
      example: media_asset_1
    BlogPostAuthorIdsField:
      type: array
      items:
        $ref: '#/components/schemas/BlogAuthorIdField'
    BlogAuthorIdField:
      type: string
      example: wm_header
    BlogPostTagIdsField:
      type: array
      items:
        $ref: '#/components/schemas/BlogTagIdField'
    BlogTagIdField:
      type: string
      example: wp_home
    BlogPostDetailSchema:
      type: object
      properties:
        id:
          type: string
          example: wp_home
        title:
          type: string
          example: Hello world
        excerpt:
          type: string
          example: Short post summary.
        content:
          type: string
          example: <h1>Homepage</h1>
        imageAssetId:
          $ref: '#/components/schemas/BlogPostImageAssetIdField'
        authorIds:
          $ref: '#/components/schemas/BlogPostAuthorIdsField'
        tagIds:
          $ref: '#/components/schemas/BlogPostTagIdsField'
        metadata:
          $ref: '#/components/schemas/WebMetadataDetailSchema'
        createdAt:
          type: number
          format: double
          example: 1.76e+9
        updatedAt:
          type: number
          format: double
          example: 1.76e+9
      required:
      - id
      - title
      - excerpt
      - content
      - authorIds
      - tagIds
      - metadata
      - createdAt
      - updatedAt
    WebMetadataDetailSchema:
      type: object
      properties:
        id:
          type: string
          example: metadata_homepage
        referenceType:
          $ref: '#/components/schemas/AdminWebMetadataReferenceTypeField'
        referenceId:
          $ref: '#/components/schemas/AdminWebMetadataReferenceIDField'
        slug:
          type: string
          example: homepage
        template:
          type: string
          example: default
        publicationDate:
          type: number
          nullable: true
        expirationDate:
          type: number
          nullable: true
        status:
          type: string
          example: draft
        title:
          type: string
          nullable: true
        excerpt:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        canonicalUrl:
          type: string
          nullable: true
        noIndex:
          type: boolean
          example: false
        primaryKeyword:
          type: string
          example: homepage seo
        cssCodeInjection:
          type: string
          nullable: true
        javascriptCodeInjection:
          type: string
          nullable: true
        structuredDataCodeInjection:
          type: string
          nullable: true
        createdAt:
          type: number
          format: double
          example: 1.76e+9
        updatedAt:
          type: number
          format: double
          example: 1.76e+9
      required:
      - id
      - slug
      - template
      - status
      - noIndex
      - primaryKeyword
      - createdAt
      - updatedAt
    AdminWebMetadataReferenceTypeField:
      type: string
      example: web.page
    AdminWebMetadataReferenceIDField:
      type: string
      example: wp_home
    SearchFilterSchema:
      type: object
      properties:
        search:
          $ref: '#/components/schemas/SearchStringField'
    SearchStringField:
      type: string
      example: foo
    BlogPostListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - title
                - createdAt
                - updatedAt
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
      required:
      - page
      - filters
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
    SearchPageSizeField:
      type: integer
      example: 20
    SearchPageNumberField:
      type: integer
      example: 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      example: asc
    BlogPostListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/BlogPostListItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/BlogPostListItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    BlogPostListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/BlogPostIdField'
        title:
          $ref: '#/components/schemas/BlogPostTitleField'
        excerpt:
          $ref: '#/components/schemas/BlogPostExcerptField'
        imageAssetId:
          $ref: '#/components/schemas/BlogPostImageAssetIdField'
        createdAt:
          $ref: '#/components/schemas/BlogPostCreatedAtField'
        updatedAt:
          $ref: '#/components/schemas/BlogPostUpdatedAtField'
      required:
      - id
      - title
      - excerpt
      - createdAt
      - updatedAt
    BlogPostIdField:
      type: string
      example: wp_home
    BlogPostTitleField:
      type: string
      example: Hello world
    BlogPostExcerptField:
      type: string
      example: Short post summary.
    BlogPostCreatedAtField:
      type: number
      format: double
      example: 1.76e+9
    BlogPostUpdatedAtField:
      type: number
      format: double
      example: 1.76e+9
    BlogPostPatchSchema:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/BlogPostTitleField'
        excerpt:
          $ref: '#/components/schemas/BlogPostExcerptField'
        content:
          $ref: '#/components/schemas/BlogPostContentField'
        imageAssetId:
          $ref: '#/components/schemas/BlogPostImageAssetIdField'
        authorIds:
          $ref: '#/components/schemas/BlogPostAuthorIdsField'
        tagIds:
          $ref: '#/components/schemas/BlogPostTagIdsField'
    BlogPostContentField:
      type: string
      example: <h1>Homepage</h1>
    BlogAuthorCreateSchema:
      type: object
      properties:
        name:
          type: string
          example: Header menu
        excerpt:
          $ref: '#/components/schemas/BlogAuthorExcerptField'
        content:
          $ref: '#/components/schemas/BlogAuthorContentField'
        profileImageAssetId:
          $ref: '#/components/schemas/BlogAuthorProfileImageAssetIdField'
      required:
      - name
    BlogAuthorExcerptField:
      type: string
      example: Short author summary.
    BlogAuthorContentField:
      type: string
      example: Author biography.
    BlogAuthorProfileImageAssetIdField:
      type: string
      example: media_asset_1
    BlogAuthorDetailSchema:
      type: object
      properties:
        id:
          type: string
          example: wm_header
        name:
          type: string
          example: Header menu
        excerpt:
          type: string
          example: Short author summary.
        content:
          type: string
          example: Author biography.
        profileImageAssetId:
          $ref: '#/components/schemas/BlogAuthorProfileImageAssetIdField'
        metadata:
          $ref: '#/components/schemas/WebMetadataDetailSchema'
        createdAt:
          type: number
          format: double
          example: 1.76e+9
        updatedAt:
          type: number
          format: double
          example: 1.76e+9
      required:
      - id
      - name
      - excerpt
      - content
      - metadata
      - createdAt
      - updatedAt
    BlogAuthorListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - key
                - name
                - createdAt
                - updatedAt
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
      required:
      - page
      - filters
    BlogAuthorListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/BlogAuthorListItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/BlogAuthorListItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    BlogAuthorListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/BlogAuthorIdField'
        name:
          $ref: '#/components/schemas/BlogAuthorNameField'
        excerpt:
          $ref: '#/components/schemas/BlogAuthorExcerptField'
        profileImageAssetId:
          $ref: '#/components/schemas/BlogAuthorProfileImageAssetIdField'
        createdAt:
          $ref: '#/components/schemas/BlogAuthorCreatedAtField'
        updatedAt:
          $ref: '#/components/schemas/BlogAuthorUpdatedAtField'
      required:
      - id
      - name
      - excerpt
      - createdAt
      - updatedAt
    BlogAuthorNameField:
      type: string
      example: Header menu
    BlogAuthorCreatedAtField:
      type: number
      format: double
      example: 1.76e+9
    BlogAuthorUpdatedAtField:
      type: number
      format: double
      example: 1.76e+9
    BlogAuthorPatchSchema:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/BlogAuthorNameField'
        excerpt:
          $ref: '#/components/schemas/BlogAuthorExcerptField'
        content:
          $ref: '#/components/schemas/BlogAuthorContentField'
        profileImageAssetId:
          $ref: '#/components/schemas/BlogAuthorProfileImageAssetIdField'
    BlogAuthorLinkCreateSchema:
      type: object
      properties:
        label:
          type: string
          example: Home
        url:
          type: string
          example: /
        priority:
          type: integer
          example: 10
        isBlank:
          type: boolean
          example: false
        permission:
          type: string
          example: ''
        notes:
          $ref: '#/components/schemas/BlogAuthorLinkNotesField'
      required:
      - label
      - url
      - priority
      - isBlank
      - permission
    BlogAuthorLinkNotesField:
      type: string
      example: Visible for all visitors.
    BlogAuthorLinkDetailSchema:
      type: object
      properties:
