openapi: 3.0.0
info:
  title: Account Admin API
  version: 0.1.0
tags:
- name: AccountSettings
  description: Manage account settings.
- name: Account
  description: Account endpoints.
- name: AccountInvitations
  description: Manage user invitations.
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/admin/account/settings:
    get:
      tags:
      - AccountSettings
      operationId: accountSettingsGet
      responses:
        200:
          $ref: '#/components/responses/AccountSettingsDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - AccountSettings
      operationId: accountSettingsUpdate
      requestBody:
        $ref: '#/components/requestBodies/AccountSettingsUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AccountSettingsDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/account/users/{userId}/profile:
    get:
      tags:
      - Account
      operationId: adminAccountProfileGet
      parameters:
      - $ref: '#/components/parameters/AccountProfileUserIDParameter'
      responses:
        200:
          $ref: '#/components/responses/AccountProfileResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - Account
      operationId: adminAccountProfileUpdate
      parameters:
      - $ref: '#/components/parameters/AccountProfileUserIDParameter'
      requestBody:
        $ref: '#/components/requestBodies/AccountProfileUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AccountProfileResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/account/users/{userId}/settings:
    get:
      tags:
      - AccountSettings
      operationId: adminAccountSettingsGet
      parameters:
      - $ref: '#/components/parameters/AccountSettingsUserIDParameter'
      responses:
        200:
          $ref: '#/components/responses/AccountSettingsDetailResponse'
    put:
      tags:
      - AccountSettings
      operationId: adminAccountSettingsUpdate
      parameters:
      - $ref: '#/components/parameters/AccountSettingsUserIDParameter'
      requestBody:
        $ref: '#/components/requestBodies/AccountSettingsUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AccountSettingsDetailResponse'
  /api/v1/admin/account/invitations:
    post:
      tags:
      - AccountInvitations
      operationId: accountInvitationCreate
      requestBody:
        $ref: '#/components/requestBodies/AccountInvitationRequestBody'
      responses:
        201:
          $ref: '#/components/responses/AccountInvitationDetailResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    delete:
      tags:
      - AccountInvitations
      operationId: accountInvitationDelete
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        200:
          $ref: '#/components/responses/DeleteResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/account/invitations/:
    get:
      tags:
      - AccountInvitations
      operationId: accountInvitationList
      responses:
        200:
          $ref: '#/components/responses/AccountInvitationListResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/account/invitations/search:
    post:
      tags:
      - AccountInvitations
      operationId: accountInvitationSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInvitationListItemSearchQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/AccountInvitationListItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/account/invitations/{accountInvitationId}:
    get:
      tags:
      - AccountInvitations
      operationId: accountInvitationGet
      parameters:
      - $ref: '#/components/parameters/AccountInvitationIdParameter'
      responses:
        200:
          $ref: '#/components/responses/AccountInvitationDetailResponse'
        404:
          description: AccountInvitation not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - AccountInvitations
      operationId: accountInvitationUpdate
      parameters:
      - $ref: '#/components/parameters/AccountInvitationIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/AccountInvitationUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AccountInvitationDetailResponse'
        404:
          description: AccountInvitation not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
    patch:
      tags:
      - AccountInvitations
      operationId: accountInvitationPatch
      parameters:
      - $ref: '#/components/parameters/AccountInvitationIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/AccountInvitationPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AccountInvitationDetailResponse'
        404:
          description: AccountInvitation not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
  /api/v1/admin/account/invitations/{accountInvitationId}/resend:
    post:
      tags:
      - AccountInvitations
      operationId: accountInvitationResend
      parameters:
      - $ref: '#/components/parameters/AccountInvitationIdParameter'
      responses:
        200:
          $ref: '#/components/responses/AccountInvitationDetailResponse'
        404:
          description: AccountInvitation not found
        401:
          description: Unauthorized
        403:
          description: Forbidden
      security:
      - bearerAuth: []
components:
  schemas:
    AccountSettingsDetailSchema:
      type: object
      properties:
        language:
          type: string
        timezone:
          type: string
        pageSize:
          type: integer
      required:
      - language
      - timezone
      - pageSize
    AccountSettingsUpdateSchema:
      type: object
      properties:
        language:
          type: string
        timezone:
          type: string
        pageSize:
          type: integer
      required:
      - language
      - timezone
      - pageSize
    AccountProfileUserIDField:
      type: string
    AccountProfileResponseSchema:
      type: object
      properties:
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        imageURL:
          type: string
          nullable: true
    AccountProfileUpdateSchema:
      type: object
      properties:
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        imageURL:
          type: string
          nullable: true
    AccountSettingsUserIDField:
      type: string
    AccountInvitationCreateSchema:
      type: object
      properties:
        email:
          type: string
          example: john.doe@example.com
        roleIds:
          $ref: '#/components/schemas/AccountInvitationRoleIDsField'
      required:
      - email
    AccountInvitationRoleIDsField:
      type: array
      items:
        type: string
    AccountInvitationDetailSchema:
      type: object
      properties:
        id:
          type: string
          example: inv_7nL3xQ2v
        email:
          type: string
          example: john.doe@example.com
        token:
          type: string
          example: eyJhbGciOi...
        roleIds:
          type: array
          items:
            type: string
        expiresAt:
          type: number
          format: double
          example: 1.76e+9
      required:
      - id
      - email
      - token
      - roleIds
      - expiresAt
    DeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            example: id1
        results:
          type: boolean
          example: true
        summary:
          type: boolean
          example: true
      required:
      - ids
      - results
      - summary
    DeleteResponseSchema:
      type: object
      properties:
        results:
          $ref: '#/components/schemas/DeleteResultListSchema'
        summary:
          $ref: '#/components/schemas/DeleteSummarySchema'
    DeleteResultListSchema:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            example: id1
          status:
            type: string
            enum:
            - deleted
            - not_found
            - forbidden
            example: deleted
        required:
        - id
        - status
    DeleteSummarySchema:
      type: object
      properties:
        requested:
          type: integer
          example: 1
        deleted:
          type: integer
          example: 1
        omitted:
          type: integer
          example: 1
      required:
      - requested
      - deleted
      - omitted
    AccountInvitationListSchema:
      type: array
      items:
        $ref: '#/components/schemas/AccountInvitationListItemSchema'
    AccountInvitationListItemSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/AccountInvitationIdField'
        email:
          $ref: '#/components/schemas/AccountInvitationEmailField'
        token:
          $ref: '#/components/schemas/AccountInvitationTokenField'
        roleIds:
          $ref: '#/components/schemas/AccountInvitationRoleIDsField'
        expiresAt:
          $ref: '#/components/schemas/AccountInvitationExpiresAtField'
      required:
      - id
      - email
      - token
      - roleIds
      - expiresAt
    AccountInvitationIdField:
      type: string
      example: inv_7nL3xQ2v
    AccountInvitationEmailField:
      type: string
      example: john.doe@example.com
    AccountInvitationTokenField:
      type: string
      example: eyJhbGciOi...
    AccountInvitationExpiresAtField:
      type: number
      format: double
      example: 1.76e+9
    AccountInvitationListItemSearchQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - email
                - token
                - expiresAt
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          example:
            search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
      required:
      - page
      - filters
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
    SearchPageSizeField:
      type: integer
      example: 20
    SearchPageNumberField:
      type: integer
      example: 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      example: asc
    SearchStringField:
      type: string
      example: foo
    AccountInvitationListItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/AccountInvitationListItemSearchQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AccountInvitationListItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    AccountInvitationPatchSchema:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/AccountInvitationEmailField'
        roleIds:
          $ref: '#/components/schemas/AccountInvitationRoleIDsField'
  responses:
    AccountSettingsDetailResponse:
      description: Account settings
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountSettingsDetailSchema'
    AccountProfileResponse:
      description: Account profile response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountProfileResponseSchema'
    AccountInvitationDetailResponse:
      description: AccountInvitation response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountInvitationDetailSchema'
    DeleteResponse:
      description: Delete response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteResponseSchema'
    AccountInvitationListResponse:
      description: AccountInvitation list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountInvitationListSchema'
    AccountInvitationListItemSearchSchemaSearchResponse:
      description: Search response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountInvitationListItemSearchSchema'
  parameters:
    AccountProfileUserIDParameter:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AccountProfileUserIDField'
    AccountSettingsUserIDParameter:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AccountSettingsUserIDField'
    AccountInvitationIdParameter:
      name: accountInvitationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AccountInvitationIdField'
      description: AccountInvitation id
  requestBodies:
    AccountSettingsUpdateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountSettingsUpdateSchema'
      required: true
    AccountProfileUpdateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountProfileUpdateSchema'
      required: true
    AccountInvitationRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountInvitationCreateSchema'
      required: true
    DeleteRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteRequestSchema'
      required: true
    AccountInvitationUpdateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountInvitationCreateSchema'
      required: true
    AccountInvitationPatchRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountInvitationPatchSchema'
      required: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
