openapi: 3.2.0
info:
  title: Account Admin API
  version: 0.1.0
tags:
- name: Accounts
  description: Create user accounts.
- name: Account
  description: Account endpoints.
- name: AccountSettings
  description: Manage account settings.
- name: AccountInvitations
  description: Manage user invitations.
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/admin/account/users:
    post:
      tags:
      - Accounts
      operationId: accountCreate
      requestBody:
        $ref: '#/components/requestBodies/AccountCreateRequestBody'
      responses:
        201:
          $ref: '#/components/responses/AccountCreateResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/account/users/{userId}/profile:
    get:
      tags:
      - Account
      operationId: accountProfileGet
      parameters:
      - $ref: '#/components/parameters/AccountProfileUserIDParameter'
      responses:
        200:
          $ref: '#/components/responses/AccountProfileResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    put:
      tags:
      - Account
      operationId: accountProfileUpdate
      parameters:
      - $ref: '#/components/parameters/AccountProfileUserIDParameter'
      requestBody:
        $ref: '#/components/requestBodies/AccountProfileUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AccountProfileResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/account/profile:
    get:
      tags:
      - Account
      operationId: accountCurrentUserProfileGet
      responses:
        200:
          $ref: '#/components/responses/AccountProfileResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    put:
      tags:
      - Account
      operationId: accountCurrentUserProfileUpdate
      requestBody:
        $ref: '#/components/requestBodies/AccountProfileUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AccountProfileResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/account/settings:
    get:
      tags:
      - AccountSettings
      operationId: accountSettingsGet
      responses:
        200:
          $ref: '#/components/responses/AccountSettingsDetailResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    put:
      tags:
      - AccountSettings
      operationId: accountSettingsUpdate
      requestBody:
        $ref: '#/components/requestBodies/AccountSettingsUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AccountSettingsDetailResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/account/users/{userId}/settings:
    get:
      tags:
      - AccountSettings
      operationId: accountUserSettingsGet
      parameters:
      - $ref: '#/components/parameters/AccountSettingsUserIDParameter'
      responses:
        200:
          $ref: '#/components/responses/AccountSettingsDetailResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    put:
      tags:
      - AccountSettings
      operationId: accountUserSettingsUpdate
      parameters:
      - $ref: '#/components/parameters/AccountSettingsUserIDParameter'
      requestBody:
        $ref: '#/components/requestBodies/AccountSettingsUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AccountSettingsDetailResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/account/invitations:
    get:
      tags:
      - AccountInvitations
      operationId: accountInvitationList
      responses:
        200:
          $ref: '#/components/responses/InvitationListResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    post:
      tags:
      - AccountInvitations
      operationId: accountInvitationCreate
      requestBody:
        $ref: '#/components/requestBodies/InvitationPostRequestBody'
      responses:
        201:
          $ref: '#/components/responses/InvitationGetResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - AccountInvitations
      operationId: accountInvitationDelete
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/account/invitations/query:
    post:
      tags:
      - AccountInvitations
      operationId: accountInvitationQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationQuerySchemasItemSearchRequestQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/InvitationQuerySchemasItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/account/invitations/{accountInvitationId}:
    get:
      tags:
      - AccountInvitations
      operationId: accountInvitationGet
      parameters:
      - $ref: '#/components/parameters/InvitationParametersID'
      responses:
        200:
          $ref: '#/components/responses/InvitationGetResponse'
        404:
          description: Account invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    put:
      tags:
      - AccountInvitations
      operationId: accountInvitationUpdate
      parameters:
      - $ref: '#/components/parameters/InvitationParametersID'
      requestBody:
        $ref: '#/components/requestBodies/InvitationPutRequestBody'
      responses:
        200:
          $ref: '#/components/responses/InvitationGetResponse'
        404:
          description: Account invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    patch:
      tags:
      - AccountInvitations
      operationId: accountInvitationPatch
      parameters:
      - $ref: '#/components/parameters/InvitationParametersID'
      requestBody:
        $ref: '#/components/requestBodies/InvitationPatchRequestBody'
      responses:
        200:
          $ref: '#/components/responses/InvitationGetResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        404:
          description: Account invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/account/invitations/{accountInvitationId}/resend:
    post:
      tags:
      - AccountInvitations
      operationId: accountInvitationResend
      parameters:
      - $ref: '#/components/parameters/InvitationParametersID'
      responses:
        200:
          $ref: '#/components/responses/InvitationGetResponse'
        404:
          description: Account invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
components:
  schemas:
    AccountCreateSchema:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/AccountCreateEmailField'
        password:
          $ref: '#/components/schemas/AccountCreatePasswordField'
      required:
      - email
      - password
      minProperties: 2
    AccountCreateEmailField:
      type: string
    AccountCreatePasswordField:
      type: string
    AccountCreateResponseSchema:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
      required:
      - userId
      - email
      minProperties: 2
    DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/DefaultHTTPErrorContentSchema'
        trace:
          $ref: '#/components/schemas/ErrorTraceSchema'
      required:
      - error
      minProperties: 1
    DefaultHTTPErrorContentSchema:
      type: object
      properties:
        message:
          type: string
        reason:
          type: string
      required:
      - message
      - reason
      minProperties: 2
    ErrorTraceSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        reasons:
          $ref: '#/components/schemas/ErrorTraceReasonsSchema'
      required:
      - id
      - message
      minProperties: 2
    ErrorTraceReasonsSchema:
      type: array
      items:
        $ref: '#/components/schemas/ErrorTraceReasonSchema'
      minItems: 0
      uniqueItems: false
    ErrorTraceReasonSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
      - id
      - message
      minProperties: 2
    AccountProfileUserIDField:
      type: string
    AccountProfileResponseSchema:
      type: object
      properties:
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        profileImageAssetId:
          type:
          - string
          - 'null'
      minProperties: 0
    AccountProfileUpdateSchema:
      type: object
      properties:
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        profileImageAssetId:
          type:
          - string
          - 'null'
      minProperties: 0
    AccountSettingsDetailSchema:
      type: object
      properties:
        language:
          type: string
        timezone:
          type: string
        pageSize:
          type: integer
      required:
      - language
      - timezone
      - pageSize
      minProperties: 3
    AccountSettingsUpdateSchema:
      type: object
      properties:
        language:
          type: string
        timezone:
          type: string
        pageSize:
          type: integer
      required:
      - language
      - timezone
      - pageSize
      minProperties: 3
    AccountSettingsUserIDField:
      type: string
    InvitationListSchema:
      type: array
      items:
        $ref: '#/components/schemas/InvitationListItem'
      minItems: 0
      uniqueItems: false
    InvitationListItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/InvitationSchemasID'
        email:
          $ref: '#/components/schemas/InvitationSchemasEmail'
        token:
          $ref: '#/components/schemas/InvitationSchemasToken'
        roleIds:
          $ref: '#/components/schemas/InvitationSchemasRoleIDs'
        expiresAt:
          $ref: '#/components/schemas/InvitationSchemasExpiresAt'
      required:
      - id
      - email
      - token
      - roleIds
      - expiresAt
      minProperties: 5
    InvitationSchemasID:
      type: string
      examples:
      - inv_7nL3xQ2v
    InvitationSchemasEmail:
      type: string
      examples:
      - john.doe@example.com
    InvitationSchemasToken:
      type: string
      examples:
      - eyJhbGciOi...
    InvitationSchemasRoleIDs:
      type: array
      items:
        type: string
      minItems: 0
      uniqueItems: false
    InvitationSchemasExpiresAt:
      type: number
      format: double
      examples:
      - 1.76e+9
    InvitationPostSchema:
      type: object
      properties:
        email:
          type: string
          examples:
          - john.doe@example.com
        roleIds:
          $ref: '#/components/schemas/InvitationSchemasRoleIDs'
      required:
      - email
      minProperties: 1
    InvitationSchemasDetail:
      type: object
      properties:
        id:
          type: string
          examples:
          - inv_7nL3xQ2v
        email:
          type: string
          examples:
          - john.doe@example.com
        token:
          type: string
          examples:
          - eyJhbGciOi...
        roleIds:
          type: array
          items:
            type: string
          minItems: 0
          uniqueItems: false
        expiresAt:
          type: number
          format: double
          examples:
          - 1.76e+9
      required:
      - id
      - email
      - token
      - roleIds
      - expiresAt
      minProperties: 5
    DeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            examples:
            - id1
          minItems: 0
          uniqueItems: false
      required:
      - ids
      minProperties: 1
    InvitationQuerySchemasItemSearchRequestQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - email
                - token
                - expiresAt
                examples:
                - id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
            minProperties: 2
          minItems: 0
          uniqueItems: false
        filters:
          type: object
          examples:
          - search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
          minProperties: 0
      required:
      - filters
      minProperties: 1
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      minProperties: 0
    SearchPageSizeField:
      type: integer
      default: 20
      description: Results per page. Defaults to 20 when omitted; values below 1 are
        clamped to 1. Endpoint-specific maximums may apply.
      examples:
      - 20
    SearchPageNumberField:
      type: integer
      default: 1
      description: 1-based page number. Defaults to 1 when omitted; values below 1
        are clamped to 1.
      examples:
      - 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      examples:
      - asc
    SearchStringField:
      type: string
      examples:
      - foo
    InvitationQuerySchemasItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/InvitationQuerySchemasItemSearchResponseQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/InvitationQuerySchemasItem'
              minItems: 0
              uniqueItems: false
            total:
              type: integer
              examples:
              - 123
          required:
          - items
          - total
          minProperties: 2
      required:
      - query
      - data
      minProperties: 2
    InvitationQuerySchemasItemSearchResponseQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchResponsePageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - email
                - token
                - expiresAt
                examples:
                - id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
            minProperties: 2
          minItems: 0
          uniqueItems: false
        filters:
          type: object
          examples:
          - search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
          minProperties: 0
      required:
      - page
      - filters
      minProperties: 2
    SearchResponsePageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
      minProperties: 2
    InvitationQuerySchemasItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/InvitationSchemasID'
        email:
          $ref: '#/components/schemas/InvitationSchemasEmail'
        token:
          $ref: '#/components/schemas/InvitationSchemasToken'
        roleIds:
          $ref: '#/components/schemas/InvitationSchemasRoleIDs'
        expiresAt:
          $ref: '#/components/schemas/InvitationSchemasExpiresAt'
      required:
      - id
      - email
      - token
      - roleIds
      - expiresAt
      minProperties: 5
    InvitationPutSchema:
      type: object
      properties:
        email:
          type: string
          examples:
          - john.doe@example.com
        roleIds:
          $ref: '#/components/schemas/InvitationSchemasRoleIDs'
      required:
      - email
      minProperties: 1
    InvitationPatchSchema:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/InvitationSchemasEmail'
        roleIds:
          $ref: '#/components/schemas/InvitationSchemasRoleIDs'
      minProperties: 0
  responses:
    AccountCreateResponse:
      description: Account response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountCreateResponseSchema'
    AccountProfileResponse:
      description: Account profile response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountProfileResponseSchema'
    AccountSettingsDetailResponse:
      description: Account settings
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountSettingsDetailSchema'
    InvitationListResponse:
      description: Account invitation list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationListSchema'
    InvitationGetResponse:
      description: Account invitation response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationSchemasDetail'
    NoContentResponse:
      description: Delete succeeded
    InvitationQuerySchemasItemSearchSchemaSearchResponse:
      description: Search response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationQuerySchemasItemSearchSchema'
  parameters:
    AccountProfileUserIDParameter:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AccountProfileUserIDField'
    AccountSettingsUserIDParameter:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AccountSettingsUserIDField'
    InvitationParametersID:
      name: accountInvitationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/InvitationSchemasID'
      description: Account invitation ID
  requestBodies:
    AccountCreateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountCreateSchema'
      required: true
    AccountProfileUpdateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountProfileUpdateSchema'
      required: true
    AccountSettingsUpdateRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountSettingsUpdateSchema'
      required: true
    InvitationPostRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationPostSchema'
      required: true
    DeleteRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteRequestSchema'
      required: true
    InvitationPutRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationPutSchema'
      required: true
    InvitationPatchRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationPatchSchema'
      required: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
