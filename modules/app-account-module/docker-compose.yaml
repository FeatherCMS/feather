services:
    tests:
        build:
            context: ../../..
            dockerfile: feather/modules/app-account-module/docker/tests/Dockerfile
        command:
            - swift
            - test
            - --parallel

    openapi-app:
        image: swaggerapi/swagger-ui:v5.32.15
        ports:
            - '8888:8080'
        environment:
            SWAGGER_JSON: /app/account-app@v3_2_0.yaml
        volumes:
            - './openapi/account-app@v3_2_0.yaml:/app/account-app@v3_2_0.yaml:ro'

    openapi-admin:
        image: swaggerapi/swagger-ui:v5.32.15
        ports:
            - '8889:8080'
        environment:
            SWAGGER_JSON: /app/account-admin@v3_2_0.yaml
        volumes:
            - './openapi/account-admin@v3_2_0.yaml:/app/account-admin@v3_2_0.yaml:ro'
