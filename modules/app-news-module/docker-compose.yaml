services:
    certificates:
        build:
            context: .
            dockerfile: docker/certificates/Dockerfile
        volumes:
            - 'certificates:/certs'
        restart: "no"

    postgres:
        build:
            context: .
            dockerfile: docker/postgres/Dockerfile
        depends_on:
            certificates:
                condition: service_completed_successfully
        volumes:
            - 'certificates:/certs'
            - 'postgres_data:/var/lib/postgresql'
        ports:
            - '55442:5432'
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres

    tests:
        build:
            context: ../..
            dockerfile: modules/app-news-module/docker/tests/Dockerfile
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            POSTGRES_HOST: postgres
            POSTGRES_PORT: "5432"
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
        command:
            - swift
            - test
            - --parallel

    openapi-app:
        build:
            context: .
            dockerfile: docker/openapi/Dockerfile
        ports:
            - '8888:80'
        volumes:
            - './docker/openapi/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
            - './docker/openapi/www/index.html:/usr/share/nginx/html/index.html:ro'
            - './docker/openapi/www/swagger-ui/:/usr/share/nginx/html/swagger-ui/:ro'
            - './openapi/news-app.yaml:/usr/share/nginx/html/openapi/app.yaml:ro'

    openapi-admin:
        build:
            context: .
            dockerfile: docker/openapi/Dockerfile
        ports:
            - '8889:80'
        volumes:
            - './docker/openapi/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
            - './docker/openapi/www/index.html:/usr/share/nginx/html/index.html:ro'
            - './docker/openapi/www/swagger-ui/:/usr/share/nginx/html/swagger-ui/:ro'
            - './openapi/news-admin.yaml:/usr/share/nginx/html/openapi/admin.yaml:ro'

volumes:
    certificates:
        name: app_news_module_certificates
    postgres_data:
        name: app_news_module_postgres_data
