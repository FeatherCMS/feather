        200:
          $ref: '#/components/responses/NewsArticleListResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/news/articles/query:
    post:
      tags:
      - NewsArticles
      operationId: newsArticleQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsArticleQueryItemSearchRequestQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/NewsArticleQueryItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/news/articles/{newsArticleId}:
    get:
      tags:
      - NewsArticles
      operationId: newsArticleGet
      parameters:
      - $ref: '#/components/parameters/NewsArticleIDParameter'
      responses:
        200:
          $ref: '#/components/responses/NewsArticleDetailResponse'
        404:
          description: News article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    put:
      tags:
      - NewsArticles
      operationId: newsArticlePut
      parameters:
      - $ref: '#/components/parameters/NewsArticleIDParameter'
      requestBody:
        $ref: '#/components/requestBodies/NewsArticleUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/NewsArticleDetailResponse'
        404:
          description: News article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/news/categories:
    post:
      tags:
      - NewsCategories
      operationId: newsCategoryPost
      requestBody:
        $ref: '#/components/requestBodies/NewsCategoryRequestBody'
      responses:
        201:
          $ref: '#/components/responses/NewsCategoryDetailResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    delete:
      tags:
      - NewsCategories
      operationId: newsCategoryDelete
      requestBody:
        $ref: '#/components/requestBodies/DeleteRequestBody'
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/news/categories/:
    get:
      tags:
      - NewsCategories
      operationId: newsCategoryList
      responses:
        200:
          $ref: '#/components/responses/NewsCategoryListResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/news/categories/query:
    post:
      tags:
      - NewsCategories
      operationId: newsCategoryQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsCategoryQueryItemSearchRequestQuerySchema'
        required: true
      responses:
        200:
          $ref: '#/components/responses/NewsCategoryQueryItemSearchSchemaSearchResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/admin/news/categories/{newsCategoryId}:
    get:
      tags:
      - NewsCategories
      operationId: newsCategoryGet
      parameters:
      - $ref: '#/components/parameters/NewsCategoryIDParameter'
      responses:
        200:
          $ref: '#/components/responses/NewsCategoryDetailResponse'
        404:
          description: News category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
