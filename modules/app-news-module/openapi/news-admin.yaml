          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
    put:
      tags:
      - NewsCategories
      operationId: newsCategoryPut
      parameters:
      - $ref: '#/components/parameters/NewsCategoryIDParameter'
      requestBody:
        $ref: '#/components/requestBodies/NewsCategoryUpdateRequestBody'
      responses:
        200:
          $ref: '#/components/responses/NewsCategoryDetailResponse'
        404:
          description: News category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
components:
  schemas:
    NewsArticleCreateSchema:
      type: object
      properties:
        title:
          type: string
          example: example
        excerpt:
          type: string
          example: example
        content:
          type: string
          example: example
        imageAssetId:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        categoryIds:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsCategoryIDsField'
        metadata:
          $ref: '#/components/schemas/NewsMetadataInputSchema'
      required:
      - title
      - excerpt
      - content
      - metadata
    NewsAdminOpenAPIComponentsStringField:
      type: string
      example: example
    NewsAdminOpenAPIComponentsCategoryIDsField:
      type: array
      items:
        $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
    NewsMetadataInputSchema:
      type: object
      properties:
        slug:
          type: string
          example: example
        status:
          type: string
          example: draft
        publicationDate:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsTimestampField'
        expirationDate:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsTimestampField'
        title:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        excerpt:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        imageURL:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        canonicalURL:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        noIndex:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsBooleanField'
        primaryKeyword:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        cssCodeInjection:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        javascriptCodeInjection:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        structuredDataCodeInjection:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
      required:
      - slug
      - status
    NewsAdminOpenAPIComponentsTimestampField:
      type: number
      format: double
      example: 1.76e+9
    NewsAdminOpenAPIComponentsBooleanField:
      type: boolean
      example: false
    NewsArticleDetailSchema:
      type: object
      properties:
        id:
          type: string
          example: example
        title:
          type: string
          example: example
        excerpt:
          type: string
          example: example
        content:
          type: string
          example: example
        imageAssetId:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        categoryIds:
          type: array
          items:
            $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        metadata:
          $ref: '#/components/schemas/NewsMetadataDetailSchema'
        createdAt:
          type: number
          format: double
          example: 1.76e+9
        updatedAt:
          type: number
          format: double
          example: 1.76e+9
      required:
      - id
      - title
      - excerpt
      - content
      - categoryIds
      - metadata
      - createdAt
      - updatedAt
    NewsMetadataDetailSchema:
      type: object
      properties:
        id:
          type: string
          example: example
        referenceType:
          type: string
          example: example
        referenceID:
          type: string
          example: example
        slug:
          type: string
          example: example
        template:
          type: string
          example: example
        publicationDate:
          type: number
          format: double
          example: 1.76e+9
        expirationDate:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsTimestampField'
        status:
          type: string
          example: draft
        title:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        excerpt:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        imageURL:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        canonicalURL:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        noIndex:
          type: boolean
          example: false
        primaryKeyword:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        cssCodeInjection:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        javascriptCodeInjection:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        structuredDataCodeInjection:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        createdAt:
          type: number
          format: double
          example: 1.76e+9
        updatedAt:
          type: number
          format: double
          example: 1.76e+9
      required:
      - id
      - referenceType
      - referenceID
      - slug
      - template
      - publicationDate
      - status
      - noIndex
      - createdAt
      - updatedAt
    DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/DefaultHTTPErrorContentSchema'
        trace:
          $ref: '#/components/schemas/ErrorTraceSchema'
      required:
      - error
    DefaultHTTPErrorContentSchema:
      type: object
      properties:
        message:
          type: string
        reason:
          type: string
      required:
      - message
      - reason
    ErrorTraceSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        reasons:
          $ref: '#/components/schemas/ErrorTraceReasonsSchema'
      required:
      - id
      - message
    ErrorTraceReasonsSchema:
      type: array
      items:
        $ref: '#/components/schemas/ErrorTraceReasonSchema'
    ErrorTraceReasonSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
      - id
      - message
    DeleteRequestSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            example: id1
      required:
      - ids
    NewsArticleListSchema:
      type: array
      items:
        $ref: '#/components/schemas/NewsArticleListItemSchema'
    NewsArticleListItemSchema:
      type: object
      properties:
        id:
          type: string
          example: example
        title:
          type: string
          example: example
        excerpt:
          type: string
          example: example
        imageAssetId:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        createdAt:
          type: number
          format: double
          example: 1.76e+9
        updatedAt:
          type: number
          format: double
          example: 1.76e+9
      required:
      - id
      - title
      - excerpt
      - createdAt
      - updatedAt
    NewsArticleQueryItemSearchRequestQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - title
                - createdAt
                - updatedAt
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          example:
            search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
      required:
      - filters
    SearchPageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
    SearchPageSizeField:
      type: integer
      default: 20
      description: Results per page. Defaults to 20 when omitted; values below 1 are
        clamped to 1. Endpoint-specific maximums may apply.
      example: 20
    SearchPageNumberField:
      type: integer
      default: 1
      description: 1-based page number. Defaults to 1 when omitted; values below 1
        are clamped to 1.
      example: 1
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      example: asc
    SearchStringField:
      type: string
      example: foo
    NewsArticleQueryItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/NewsArticleQueryItemSearchResponseQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/NewsArticleQueryItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    NewsArticleQueryItemSearchResponseQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchResponsePageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - title
                - createdAt
                - updatedAt
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          example:
            search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
      required:
      - page
      - filters
    SearchResponsePageSchema:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/SearchPageSizeField'
        number:
          $ref: '#/components/schemas/SearchPageNumberField'
      required:
      - size
      - number
    NewsArticleQueryItemSchema:
      type: object
      properties:
        id:
          type: string
          example: example
        title:
          type: string
          example: example
        excerpt:
          type: string
          example: example
        imageAssetId:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        createdAt:
          type: number
          format: double
          example: 1.76e+9
        updatedAt:
          type: number
          format: double
          example: 1.76e+9
      required:
      - id
      - title
      - excerpt
      - createdAt
      - updatedAt
    NewsCategoryCreateSchema:
      type: object
      properties:
        title:
          type: string
          example: example
        excerpt:
          type: string
          example: example
        content:
          type: string
          example: example
        imageAssetId:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        metadata:
          $ref: '#/components/schemas/NewsMetadataInputSchema'
      required:
      - title
      - excerpt
      - content
      - metadata
    NewsCategoryDetailSchema:
      type: object
      properties:
        id:
          type: string
          example: example
        title:
          type: string
          example: example
        excerpt:
          type: string
          example: example
        content:
          type: string
          example: example
        imageAssetId:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        metadata:
          $ref: '#/components/schemas/NewsMetadataDetailSchema'
        createdAt:
          type: number
          format: double
          example: 1.76e+9
        updatedAt:
          type: number
          format: double
          example: 1.76e+9
      required:
      - id
      - title
      - excerpt
      - content
      - metadata
      - createdAt
      - updatedAt
    NewsCategoryListSchema:
      type: array
      items:
        $ref: '#/components/schemas/NewsCategoryListItemSchema'
    NewsCategoryListItemSchema:
      type: object
      properties:
        id:
          type: string
          example: example
        title:
          type: string
          example: example
        excerpt:
          type: string
          example: example
        imageAssetId:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        createdAt:
          type: number
          format: double
          example: 1.76e+9
        updatedAt:
          type: number
          format: double
          example: 1.76e+9
      required:
      - id
      - title
      - excerpt
      - createdAt
      - updatedAt
    NewsCategoryQueryItemSearchRequestQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchPageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - title
                - createdAt
                - updatedAt
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          example:
            search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
      required:
      - filters
    NewsCategoryQueryItemSearchSchema:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/NewsCategoryQueryItemSearchResponseQuerySchema'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/NewsCategoryQueryItemSchema'
            total:
              type: integer
              example: 123
          required:
          - items
          - total
      required:
      - query
      - data
    NewsCategoryQueryItemSearchResponseQuerySchema:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/SearchResponsePageSchema'
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - id
                - title
                - createdAt
                - updatedAt
                example: id
              direction:
                $ref: '#/components/schemas/SortDirection'
            required:
            - field
            - direction
        filters:
          type: object
          example:
            search: foo
          properties:
            search:
              $ref: '#/components/schemas/SearchStringField'
      required:
      - page
      - filters
    NewsCategoryQueryItemSchema:
      type: object
      properties:
        id:
          type: string
          example: example
        title:
          type: string
          example: example
        excerpt:
          type: string
          example: example
        imageAssetId:
          $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
        createdAt:
          type: number
          format: double
          example: 1.76e+9
        updatedAt:
          type: number
          format: double
          example: 1.76e+9
      required:
      - id
      - title
      - excerpt
      - createdAt
      - updatedAt
  responses:
    NewsArticleDetailResponse:
      description: News article response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewsArticleDetailSchema'
    NoContentResponse:
      description: Delete succeeded
    NewsArticleListResponse:
      description: News article list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewsArticleListSchema'
    NewsArticleQueryItemSearchSchemaSearchResponse:
      description: Search response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewsArticleQueryItemSearchSchema'
    NewsCategoryDetailResponse:
      description: News category response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewsCategoryDetailSchema'
    NewsCategoryListResponse:
      description: News category list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewsCategoryListSchema'
    NewsCategoryQueryItemSearchSchemaSearchResponse:
      description: Search response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewsCategoryQueryItemSearchSchema'
  parameters:
    NewsArticleIDParameter:
      name: newsArticleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
      description: News article identifier
    NewsCategoryIDParameter:
      name: newsCategoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NewsAdminOpenAPIComponentsStringField'
      description: News category identifier
  requestBodies:
    NewsArticleRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewsArticleCreateSchema'
      required: true
    DeleteRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteRequestSchema'
      required: true
    NewsArticleUpdateRequestBody:
      content:
        application/json:
