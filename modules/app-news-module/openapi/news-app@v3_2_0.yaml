openapi: 3.2.0
info:
  title: News App API
  version: 0.1.0
tags:
- name: News
  description: News public content
servers:
- url: http://127.0.0.1:8080/
paths:
  /api/v1/news/articles:
    get:
      tags:
      - News
      operationId: newsArticleList
      responses:
        200:
          $ref: '#/components/responses/NewsArticleListResponse'
  /api/v1/news/articles/{id}:
    get:
      tags:
      - News
      operationId: newsArticleGet
      parameters:
      - $ref: '#/components/parameters/NewsArticleIdParameter'
      responses:
        200:
          $ref: '#/components/responses/NewsArticleDetailResponse'
        404:
          description: News item not found
  /api/v1/news/categories:
    get:
      tags:
      - News
      operationId: newsCategoryList
      responses:
        200:
          $ref: '#/components/responses/NewsCategoryListResponse'
  /api/v1/news/categories/{id}:
    get:
      tags:
      - News
      operationId: newsCategoryGet
      parameters:
      - $ref: '#/components/parameters/NewsCategoryIdParameter'
      responses:
        200:
          $ref: '#/components/responses/NewsCategoryDetailResponse'
        404:
          description: News category not found
components:
  schemas:
    NewsArticleListSchema:
      type: array
      items:
        $ref: '#/components/schemas/NewsArticleSummarySchema'
      minItems: 0
      uniqueItems: false
    NewsArticleSummarySchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/NewsArticleIdField'
        excerpt:
          $ref: '#/components/schemas/NewsArticleExcerptField'
        imageURL:
          $ref: '#/components/schemas/NewsArticleImageURLField'
        media:
          $ref: '#/components/schemas/MediaAssetSchema'
        metadata:
          $ref: '#/components/schemas/WebMetadataContentSchema'
      required:
      - id
      - excerpt
      - imageURL
      - metadata
      minProperties: 4
    NewsArticleIdField:
      type: string
      examples:
      - news_1
    NewsArticleExcerptField:
      type: string
      examples:
      - Short article summary.
    NewsArticleImageURLField:
      type: string
      examples:
      - /media/assets/news.png
    MediaAssetSchema:
      type: object
      properties:
        assetId:
          $ref: '#/components/schemas/MediaAssetIdField'
        originalURL:
          $ref: '#/components/schemas/MediaAssetURLField'
        defaultURL:
          $ref: '#/components/schemas/MediaAssetURLField'
        variants:
          $ref: '#/components/schemas/MediaAssetVariantListSchema'
      required:
      - assetId
      - originalURL
      - defaultURL
      - variants
      minProperties: 4
    MediaAssetIdField:
      type: string
      examples:
      - media_asset_1
    MediaAssetURLField:
      type: string
      examples:
      - /media/assets/example.png
    MediaAssetVariantListSchema:
      type: array
      items:
        $ref: '#/components/schemas/MediaAssetVariantSchema'
      minItems: 0
      uniqueItems: false
    MediaAssetVariantSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MediaAssetIdField'
        url:
          $ref: '#/components/schemas/MediaAssetURLField'
        type:
          $ref: '#/components/schemas/MediaAssetTypeField'
        width:
          type:
          - integer
          - 'null'
          format: int64
        height:
          type:
          - integer
          - 'null'
          format: int64
      required:
      - id
      - url
      - type
      minProperties: 3
    MediaAssetTypeField:
      type: string
      examples:
      - png
    WebMetadataContentSchema:
      type: object
      properties:
        slug:
          $ref: '#/components/schemas/WebMetadataSlugField'
        template:
          $ref: '#/components/schemas/WebMetadataTemplateField'
        publicationDate:
          $ref: '#/components/schemas/WebMetadataTimestampField'
        expirationDate:
          $ref: '#/components/schemas/WebMetadataTimestampField'
        status:
          $ref: '#/components/schemas/WebMetadataStatusField'
        title:
          $ref: '#/components/schemas/WebMetadataTitleField'
        excerpt:
          $ref: '#/components/schemas/WebMetadataExcerptField'
        imageURL:
          $ref: '#/components/schemas/WebMetadataImageURLField'
        canonicalURL:
          $ref: '#/components/schemas/WebMetadataCanonicalURLField'
        noIndex:
          $ref: '#/components/schemas/WebMetadataNoIndexField'
        cssCodeInjection:
          $ref: '#/components/schemas/WebMetadataCodeInjectionField'
        javascriptCodeInjection:
          $ref: '#/components/schemas/WebMetadataCodeInjectionField'
        structuredDataCodeInjection:
          $ref: '#/components/schemas/WebMetadataCodeInjectionField'
      required:
      - slug
      - status
      - title
      - excerpt
      - imageURL
      - canonicalURL
      - noIndex
      - cssCodeInjection
      - javascriptCodeInjection
      - structuredDataCodeInjection
      minProperties: 10
    WebMetadataSlugField:
      type: string
      examples:
      - homepage
    WebMetadataTemplateField:
      type: string
      examples:
      - default
    WebMetadataTimestampField:
      type: number
      format: double
      examples:
      - 1.76e+9
    WebMetadataStatusField:
      type: string
      examples:
      - published
    WebMetadataTitleField:
      type: string
      examples:
      - Hello world
    WebMetadataExcerptField:
      type: string
      examples:
      - Short summary
    WebMetadataImageURLField:
      type: string
      examples:
      - /media/assets/example.png
    WebMetadataCanonicalURLField:
      type: string
      examples:
      - https://example.com/posts/hello-world
    WebMetadataNoIndexField:
      type: boolean
      examples:
      - false
    WebMetadataCodeInjectionField:
      type: string
      examples:
      - <p>Hello world</p>
    NewsArticleDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/NewsArticleIdField'
        excerpt:
          $ref: '#/components/schemas/NewsArticleExcerptField'
        content:
          $ref: '#/components/schemas/NewsArticleContentField'
        imageURL:
          $ref: '#/components/schemas/NewsArticleImageURLField'
        media:
          $ref: '#/components/schemas/MediaAssetSchema'
        metadata:
          $ref: '#/components/schemas/WebMetadataContentSchema'
        categories:
          $ref: '#/components/schemas/NewsCategorySummaryListSchema'
      required:
      - id
      - excerpt
      - content
      - imageURL
      - metadata
      - categories
      minProperties: 6
    NewsArticleContentField:
      type: string
      examples:
      - <p>Hello world</p>
    NewsCategorySummaryListSchema:
      type: array
      items:
        $ref: '#/components/schemas/NewsCategorySummarySchema'
      minItems: 0
      uniqueItems: false
    NewsCategorySummarySchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/NewsCategoryIdField'
        excerpt:
          $ref: '#/components/schemas/NewsCategoryExcerptField'
        imageURL:
          $ref: '#/components/schemas/NewsCategoryImageURLField'
        media:
          $ref: '#/components/schemas/MediaAssetSchema'
        metadata:
          $ref: '#/components/schemas/WebMetadataContentSchema'
      required:
      - id
      - excerpt
      - imageURL
      - metadata
      minProperties: 4
    NewsCategoryIdField:
      type: string
      examples:
      - news_category_1
    NewsCategoryExcerptField:
      type: string
      examples:
      - Short news category summary.
    NewsCategoryImageURLField:
      type: string
      examples:
      - /media/assets/news-category.png
    NewsCategoryListSchema:
      type: array
      items:
        $ref: '#/components/schemas/NewsCategorySummarySchema'
      minItems: 0
      uniqueItems: false
    NewsCategoryDetailSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/NewsCategoryIdField'
        excerpt:
          $ref: '#/components/schemas/NewsCategoryExcerptField'
        content:
          $ref: '#/components/schemas/NewsCategoryContentField'
        imageURL:
          $ref: '#/components/schemas/NewsCategoryImageURLField'
        media:
          $ref: '#/components/schemas/MediaAssetSchema'
        metadata:
          $ref: '#/components/schemas/WebMetadataContentSchema'
        news:
          $ref: '#/components/schemas/NewsArticleSummaryListSchema'
      required:
      - id
      - excerpt
      - content
      - imageURL
      - metadata
      - news
      minProperties: 6
    NewsCategoryContentField:
      type: string
      examples:
      - <p>News category description</p>
    NewsArticleSummaryListSchema:
      type: array
      items:
        $ref: '#/components/schemas/NewsArticleSummarySchema'
      minItems: 0
      uniqueItems: false
  responses:
    NewsArticleListResponse:
      description: News item list
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewsArticleListSchema'
    NewsArticleDetailResponse:
      description: News item detail
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewsArticleDetailSchema'
    NewsCategoryListResponse:
      description: News category list
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewsCategoryListSchema'
    NewsCategoryDetailResponse:
      description: News category detail
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewsCategoryDetailSchema'
  parameters:
    NewsArticleIdParameter:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NewsArticleIdField'
      description: News item identifier
    NewsCategoryIdParameter:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NewsCategoryIdField'
      description: News category identifier
