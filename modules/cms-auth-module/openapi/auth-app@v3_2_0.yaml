openapi: 3.2.0
info:
  title: User App API
  version: 0.1.0
tags: []
servers:
- url: http://127.0.0.1:8080/
security:
- bearerAuth: []
paths:
  /api/v1/auth/me:
    get:
      operationId: authMe
      responses:
        200:
          $ref: '#/components/responses/AuthMeResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/auth/login:
    post:
      operationId: authLogin
      requestBody:
        $ref: '#/components/requestBodies/AuthLoginRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AuthResponse'
  /api/v1/auth/logout:
    post:
      operationId: authLogout
      responses:
        204:
          description: Logged out
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
      security:
      - bearerAuth: []
  /api/v1/auth/magic-link:
    post:
      operationId: authMagicLink
      requestBody:
        $ref: '#/components/requestBodies/AuthMagicLinkRequestBody'
      responses:
        204:
          description: Magic link requested
  /api/v1/auth/magic-link/verify:
    post:
      operationId: authMagicLinkVerify
      requestBody:
        $ref: '#/components/requestBodies/AuthMagicLinkVerifyRequestBody'
      responses:
        200:
          $ref: '#/components/responses/AuthResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema'
components:
  schemas:
    AuthSchemasResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthSchemasUserIdentity'
        roles:
          type: array
          items:
            type: string
          minItems: 0
          uniqueItems: false
        permissions:
          type: array
          items:
            type: string
          minItems: 0
          uniqueItems: false
        token:
          $ref: '#/components/schemas/AuthSchemasTokenField'
      required:
      - user
      - roles
      - permissions
      - token
      minProperties: 4
    AuthSchemasUserIdentity:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserIdentityIDField'
        status:
          $ref: '#/components/schemas/UserIdentityStatusField'
      required:
      - id
      - status
      minProperties: 2
    UserIdentityIDField:
      type: string
      examples:
      - usr_a9x1f7Qk2m
    UserIdentityStatusField:
      type: string
      enum:
      - invited
      - active
      - suspended
      - deactivated
      - anonymized
      examples:
      - active
    AuthSchemasTokenField:
      type: string
      examples:
      - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    DefaultHTTPErrorContentSchemaHTTPErrorEnvelopeSchema:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/DefaultHTTPErrorContentSchema'
        trace:
          $ref: '#/components/schemas/ErrorTraceSchema'
      required:
      - error
      minProperties: 1
    DefaultHTTPErrorContentSchema:
      type: object
      properties:
        message:
          type: string
        reason:
          type: string
      required:
      - message
      - reason
      minProperties: 2
    ErrorTraceSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        reasons:
          $ref: '#/components/schemas/ErrorTraceReasonsSchema'
      required:
      - id
      - message
      minProperties: 2
    ErrorTraceReasonsSchema:
      type: array
      items:
        $ref: '#/components/schemas/ErrorTraceReasonSchema'
      minItems: 0
      uniqueItems: false
    ErrorTraceReasonSchema:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
      - id
      - message
      minProperties: 2
    AuthLoginRequestSchema:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/AuthSchemasEmailField'
        password:
          $ref: '#/components/schemas/AuthSchemasPasswordField'
        isPersistent:
          $ref: '#/components/schemas/AuthSchemasIsPersistentField'
      required:
      - email
      - password
      - isPersistent
      minProperties: 3
    AuthSchemasEmailField:
      type: string
      examples:
      - admin@example.com
    AuthSchemasPasswordField:
      type: string
      examples:
      - password
    AuthSchemasIsPersistentField:
      type: boolean
      examples:
      - true
    AuthSchemasSignInResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthSchemasUserIdentity'
        roles:
          type: array
          items:
            type: string
          minItems: 0
          uniqueItems: false
        permissions:
          type: array
          items:
            type: string
          minItems: 0
          uniqueItems: false
        token:
          $ref: '#/components/schemas/AuthSchemasTokenField'
        isPersistent:
          type: boolean
          examples:
          - true
        expiresAt:
          type: number
          format: double
      required:
      - user
      - roles
      - permissions
      - token
      - isPersistent
      - expiresAt
      minProperties: 6
    AuthMagicLinkRequestSchema:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/AuthSchemasEmailField'
        isPersistent:
          $ref: '#/components/schemas/AuthSchemasIsPersistentField'
      required:
      - email
      - isPersistent
      minProperties: 2
    AuthMagicLinkVerifyRequestSchema:
      type: object
      properties:
        token:
          $ref: '#/components/schemas/AuthSchemasMagicLinkTokenField'
      required:
      - token
      minProperties: 1
    AuthSchemasMagicLinkTokenField:
      type: string
      examples:
      - mgl_3XbY...
  responses:
    AuthMeResponse:
      description: Current user response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthSchemasResponse'
    AuthResponse:
      description: Auth response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthSchemasSignInResponse'
  requestBodies:
    AuthLoginRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthLoginRequestSchema'
      required: true
    AuthMagicLinkRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthMagicLinkRequestSchema'
      required: true
    AuthMagicLinkVerifyRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthMagicLinkVerifyRequestSchema'
      required: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
