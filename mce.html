<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown component editor</title>
  <style>
    :root { color-scheme: light; --ink: #17202a; --muted: #68727d; --line: #dce2e8; --paper: #fff; --canvas: #f4f6f8; --accent: #3457d5; --accent-soft: #edf0ff; --danger: #b93737; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--canvas); color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, textarea, input { font: inherit; }
    button { cursor: pointer; }
    .app { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 64px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 28px; }
    h1 { margin: 0; font-size: clamp(27px, 4vw, 42px); letter-spacing: -.045em; line-height: 1.05; }
    .intro { margin: 9px 0 0; color: var(--muted); max-width: 600px; }
    .mode-switch { display: flex; padding: 4px; background: #e7ebef; border-radius: 11px; }
    .mode-switch button { border: 0; border-radius: 8px; background: transparent; padding: 8px 14px; color: var(--muted); }
    .mode-switch button.active { color: var(--ink); background: var(--paper); box-shadow: 0 1px 4px #1a26331a; }
    .workspace { display: grid; gap: 18px; align-items: start; }
    .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 15px; box-shadow: 0 9px 32px #17202a08; }
    .sidebar { padding: 15px 18px; }
    .eyebrow { margin: 0 0 12px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .component-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .component-button { display: grid; grid-template-columns: 30px auto; grid-template-rows: 1fr 1fr; align-items: center; column-gap: 8px; min-width: 125px; border: 1px solid var(--line); border-radius: 9px; background: #fff; padding: 8px 10px; text-align: left; color: var(--ink); transition: .15s ease; }
    .component-button:hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
    .component-button { cursor: grab; }
    .component-button:active { cursor: grabbing; }
    .component-icon { grid-row: 1 / -1; display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid #cbd3ff; border-radius: 7px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 800; line-height: 1; }
    .insert-toggle { display: flex; align-items: center; gap: 9px; margin-top: 13px; color: var(--muted); font-size: 12px; }
    .insert-toggle strong { color: var(--ink); font-size: 12px; }
    .insert-options { display: flex; }
    .insert-options button { border: 1px solid var(--line); padding: 4px 9px; background: #fff; color: var(--muted); font-size: 12px; }
    .insert-options button:first-child { border-radius: 6px 0 0 6px; }
    .insert-options button:last-child { margin-left: -1px; border-radius: 0 6px 6px 0; }
    .insert-options button.active { position: relative; z-index: 1; border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
    .component-button small { color: var(--muted); font-size: 11px; }
    .hint { border-top: 1px solid var(--line); margin: 20px 0 0; padding-top: 16px; color: var(--muted); font-size: 12px; }
    .editor { min-width: 0; overflow: hidden; }
    .editor-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); padding: 13px 18px; color: var(--muted); font-size: 13px; }
    .status { color: var(--accent); font-weight: 600; }
    #rawView { padding: 18px; }
    #markdownInput { display: block; width: 100%; min-height: 560px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 17px; background: #fbfcfd; color: #263342; font: 14px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; outline: none; }
    #markdownInput:focus, .block input:focus, .block textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    #previewView { min-height: 560px; padding: 42px clamp(22px, 7vw, 82px); background: #fff; }
    .preview-content { max-width: 760px; margin: 0 auto; color: #263342; }
    .preview-content h1, .preview-content h2, .preview-content h3, .preview-content h4, .preview-content h5, .preview-content h6 { margin: 0 0 12px; color: var(--ink); letter-spacing: -.025em; }
    .preview-content p { margin: 0 0 22px; }
    .preview-content a { color: var(--accent); }
    .preview-content img, .preview-content video { display: block; max-width: 100%; margin: 8px 0 22px; border-radius: 9px; }
    .preview-grid { display: grid; grid-template-columns: repeat(var(--grid-desktop), minmax(0, 1fr)); gap: 18px; margin: 8px 0 22px; }
    .preview-grid-column { min-width: 0; }
    @media (max-width: 900px) { .preview-grid { grid-template-columns: repeat(var(--grid-tablet), minmax(0, 1fr)); } }
    @media (max-width: 600px) { .preview-grid { grid-template-columns: repeat(var(--grid-mobile), minmax(0, 1fr)); } }
    .preview-content pre { overflow-x: auto; margin: 0 0 22px; border-radius: 9px; padding: 16px; background: #17202a; color: #e7edf4; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .preview-content .preview-custom { margin: 0 0 22px; border: 1px dashed var(--line); border-radius: 8px; padding: 12px; background: #f7f8fa; color: var(--muted); font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .preview-empty { padding: 150px 20px; color: var(--muted); text-align: center; }
    #visualView { padding: 18px; }
    .visual-canvas { min-height: 560px; border: 1px dashed #bfc8d1; border-radius: 10px; padding: 13px; background: #fbfcfd; }
    .visual-canvas.drag-over { border-color: var(--accent); background: #f8f9ff; }
    .drop-marker { height: 4px; margin: 5px 4px; border-radius: 5px; background: var(--accent); opacity: 0; pointer-events: none; }
    .drop-marker.visible { opacity: 1; }
    .block { position: relative; display: grid; grid-template-columns: 25px minmax(0, 1fr) auto; gap: 10px; align-items: start; border: 1px solid transparent; border-radius: 9px; padding: 12px 8px; }
    .block:hover, .block.dragging { border-color: var(--line); background: #fff; }
    .drag-controls { display: grid; justify-items: center; gap: 3px; }
    .drag-handle { color: #aab3bb; font-size: 18px; line-height: 1; cursor: grab; user-select: none; }
    .drag-handle:active { cursor: grabbing; }
    .move-button { width: 22px; height: 20px; border: 1px solid transparent; border-radius: 5px; padding: 0; background: transparent; color: #aab3bb; font-size: 14px; line-height: 1; }
    .move-button:hover { border-color: var(--line); background: var(--accent-soft); color: var(--accent); }
    .block-body { min-width: 0; }
    .block-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .block input, .block textarea { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px 9px; color: var(--ink); background: #fff; outline: none; }
    .block textarea { min-height: 62px; resize: vertical; }
    .format-toolbar { display: flex; gap: 4px; margin-bottom: 6px; }
    .format-toolbar button { min-width: 29px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; background: #fff; color: var(--ink); }
    .format-toolbar button:hover { border-color: var(--accent); background: var(--accent-soft); }
    .format-toolbar button strong { font-weight: 800; }
    .format-toolbar button em { font-style: italic; }
    .format-toolbar button u { text-decoration: underline; }
    .format-toolbar button del { text-decoration: line-through; }
    .html-editor { min-height: 120px; background: #f7f8fa !important; color: #425166 !important; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .code-language { max-width: 180px; margin-bottom: 6px; }
    .code-editor { min-height: 150px; background: #f7f8fa !important; color: #425166 !important; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .media-fields { display: grid; gap: 7px; }
    .custom-fields { display: grid; gap: 7px; }
    .grid-settings { display: grid; gap: 9px; }
    .grid-responsive { display: flex; flex-wrap: wrap; gap: 7px; }
    .grid-responsive label { display: grid; gap: 3px; color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .grid-responsive label.cells-stepper { margin-left: 12px; }
    .grid-responsive input { width: 62px; padding: 5px 7px; }
    .grid-columns { display: grid; grid-template-columns: repeat(var(--grid-desktop), minmax(0, 1fr)); gap: 8px; }
    @media (max-width: 900px) { .grid-columns { grid-template-columns: repeat(var(--grid-tablet), minmax(0, 1fr)); } }
    @media (max-width: 600px) { .grid-columns { grid-template-columns: repeat(var(--grid-mobile), minmax(0, 1fr)); } }
    .grid-column { min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: #fbfcfd; transition: .15s ease; }
    .grid-column.drop-target, .grid-child.drop-target { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 2px #cbd3ff; }
    .grid-column label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .grid-column-empty { min-height: 82px; display: grid; place-items: center; border: 1px dashed #c8d0d8; border-radius: 6px; padding: 10px; color: var(--muted); font-size: 11px; text-align: center; }
    .grid-child { margin-top: 6px; border: 1px solid var(--line); border-radius: 6px; padding: 6px; background: #fff; }
    .grid-child-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 10px; font-weight: 700; }
    .grid-child textarea { min-height: 50px; resize: vertical; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .heading-toolbar { display: flex; width: fit-content; margin-bottom: 6px; }
    .heading-toolbar button { position: relative; min-width: 31px; margin-left: -1px; border: 1px solid var(--line); border-radius: 0; padding: 3px 7px; background: #fff; color: var(--ink); font-size: 12px; font-weight: 700; }
    .heading-toolbar button:first-child { margin-left: 0; }
    .heading-toolbar button:first-child { border-radius: 6px 0 0 6px; }
    .heading-toolbar button:last-child { border-radius: 0 6px 6px 0; }
    .heading-toolbar button:hover, .heading-toolbar button.active { z-index: 1; border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .remove { border: 0; background: transparent; color: #9aa2aa; padding: 3px; font-size: 18px; line-height: 1; }
    .remove:hover { color: var(--danger); }
    .empty { padding: 105px 20px; color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 4px; color: var(--ink); }
    .unsupported { margin: 10px 0 0; border-radius: 8px; padding: 8px 10px; background: #fff4e4; color: #76521d; font-size: 12px; }
    @media (max-width: 760px) { .app { width: min(100% - 20px, 620px); padding-top: 25px; } header { display: block; } .mode-switch { width: fit-content; } .component-button { flex: 1 1 135px; } .hint { display: none; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div><h1>Markdown component editor</h1><p class="intro">Compose supported Markdown as movable blocks, or edit the source directly.</p></div>
    </header>
    <section class="workspace">
      <aside class="panel sidebar"><p class="eyebrow">Add component</p><div class="component-list">
        <button class="component-button" data-add="heading"><span class="component-icon" aria-hidden="true">H</span><span>Heading</span><small>H1–H6</small></button>
        <button class="component-button" data-add="text"><span class="component-icon" aria-hidden="true">T</span><span>Text</span><small>formatted paragraph</small></button>
        <button class="component-button" data-add="html"><span class="component-icon" aria-hidden="true">&lt;&gt;</span><span>HTML</span><small>raw markup</small></button>
        <button class="component-button" data-add="code"><span class="component-icon" aria-hidden="true">&lt;/&gt;</span><span>Code block</span><small>fenced code</small></button>
        <button class="component-button" data-add="image"><span class="component-icon" aria-hidden="true">▧</span><span>Image</span><small>URL + alt text</small></button>
        <button class="component-button" data-add="video"><span class="component-icon" aria-hidden="true">▶</span><span>Video</span><small>URL</small></button>
        <button class="component-button" data-add="custom"><span class="component-icon" aria-hidden="true">✦</span><span>Custom block</span><small>@Component(args)</small></button>
        <button class="component-button" data-add="grid"><span class="component-icon" aria-hidden="true">▦</span><span>Grid</span><small>responsive columns</small></button>
      </div><div class="insert-toggle"><strong>Insert at</strong><div class="insert-options" role="group" aria-label="Insert position"><button type="button" class="active" data-insert="bottom">Bottom</button><button type="button" data-insert="top">Top</button></div></div><p class="hint">Drag the handle to rearrange blocks. Select text inside a text block to format it.</p></aside>
      <section class="panel editor"><div class="editor-bar"><nav class="mode-switch" aria-label="Editor mode"><button data-mode="preview">Preview</button><button class="active" data-mode="visual">Visual</button><button data-mode="raw">Markdown</button></nav><span class="status" id="status" aria-live="polite">Ready</span></div>
        <div id="visualView"><div id="canvas" class="visual-canvas" aria-label="Visual Markdown blocks"></div></div>
        <div id="previewView" hidden><div id="previewContent" class="preview-content"></div></div>
        <div id="rawView" hidden><textarea id="markdownInput" spellcheck="false" aria-label="Raw Markdown"></textarea></div>
      </section>
    </section>
  </main>
  <script>
    const initialMarkdown = `# A simple Markdown canvas

Build your document from small, movable components.

**Drag blocks** to change their order, or switch to raw Markdown.

[Visit the project](https://example.com)`;
    const state = { blocks: [], mode: 'visual', dragging: null, insertPosition: 'bottom' };
    const canvas = document.querySelector('#canvas');
    const previewContent = document.querySelector('#previewContent');
    const input = document.querySelector('#markdownInput');
    const status = document.querySelector('#status');
    const marker = document.createElement('div'); marker.className = 'drop-marker';

    function newBlock(type, value = '') { return { id: crypto.randomUUID(), type, value, url: 'https://example.com', level: 2 }; }
    function splitMarkdownBlocks(markdown) {
      const lines = markdown.replace(/\r/g, '').split('\n'); const blocks = []; let current = []; let fenced = false; let gridDepth = 0;
      lines.forEach(line => { const trimmed = line.trim(); if (!fenced && /^```/.test(trimmed)) { if (current.length) { blocks.push(current.join('\n').trim()); current = []; } fenced = true; current.push(line); } else if (fenced) { current.push(line); if (trimmed === '```') { blocks.push(current.join('\n').trim()); current = []; fenced = false; } } else if (gridDepth > 0) { current.push(line); gridDepth += (line.match(/\{/g) || []).length - (line.match(/\}/g) || []).length; if (gridDepth === 0) { blocks.push(current.join('\n').trim()); current = []; } } else if (current.length && /^@Grid\(/.test(current[0].trim()) && line.includes('{')) { current.push(line); gridDepth = (current.join('\n').match(/\{/g) || []).length - (current.join('\n').match(/\}/g) || []).length; if (gridDepth === 0) { blocks.push(current.join('\n').trim()); current = []; } } else if (!trimmed) { if (current.length) { blocks.push(current.join('\n').trim()); current = []; } } else { current.push(line); if (current.length === 1 && /^@Grid\(/.test(trimmed) && line.includes('{')) { gridDepth = (line.match(/\{/g) || []).length - (line.match(/\}/g) || []).length; if (gridDepth === 0) { blocks.push(current.join('\n').trim()); current = []; } } } });
      if (current.length) blocks.push(current.join('\n').trim()); return blocks;
    }
    function parseMarkdown(markdown) {
      return splitMarkdownBlocks(markdown).filter(Boolean).map(part => {
        const code = part.match(/^```([^\n]*)\n([\s\S]*?)\n?```$/); if (code) return Object.assign(newBlock('code', code[2]), { language: code[1].trim() });
        const image = part.match(/^!\[([^\]]*)\]\(([^)]+)\)$/); if (image) return Object.assign(newBlock('image', image[2]), { alt: image[1] });
        const video = part.match(/^<video[^>]*\bsrc=["']([^"']+)["'][^>]*>\s*<\/video>$/i); if (video) return Object.assign(newBlock('video', video[1]), { controls: true });
        const grid = part.match(/^@Grid\(([^)]*)\)\s*\{([\s\S]*)\}$/); if (grid) { const settings = { desktop: 3, tablet: 2, mobile: 1 }; grid[1].split(',').forEach(pair => { const match = pair.match(/(desktop|tablet|mobile)\s*:\s*(\d+)/); if (match) settings[match[1]] = Number(match[2]); }); const columns = [...grid[2].matchAll(/@Column\s*\{([\s\S]*?)\}/g)].map(column => ({ blocks: parseMarkdown(column[1].trim()) })); return Object.assign(newBlock('grid', ''), { settings, columnCount: columns.length || 1, columns }); }
        const custom = part.match(/^@([A-Za-z][\w-]*)\(([^]*)\)$/); if (custom) return Object.assign(newBlock('custom', custom[2]), { name: custom[1] });
        const heading = part.match(/^(#{1,6})\s+(.+)$/); if (heading) return Object.assign(newBlock('heading', heading[2]), { level: heading[1].length });
        if (/^<[^>]+[\s\S]*>$/.test(part)) return newBlock('html', part);
        return newBlock('text', part);
      });
    }
    function serializeBlocks(blocks) { return blocks.map(serializeBlock).filter(Boolean).join('\n\n'); }
    function serialize() { return serializeBlocks(state.blocks); }
    function serializeBlock(block) { const value = (block.value || '').trim(); if (!value && !['code', 'grid'].includes(block.type)) return ''; if (block.type === 'heading') return `${'#'.repeat(block.level)} ${value}`; if (block.type === 'code') return '```' + (block.language || '').trim() + '\n' + value + '\n```'; if (block.type === 'image') return `![${(block.alt || '').trim()}](${value})`; if (block.type === 'video') return '<video controls src="' + value + '"></video>'; if (block.type === 'custom') return '@' + (block.name || '').trim() + '(' + value + ')'; if (block.type === 'grid') { const settings = block.settings || { desktop: 3, tablet: 2, mobile: 1 }; const columns = (block.columns || []).map(column => '@Column {\n' + serializeBlocks(column.blocks || []) + '\n}').join('\n'); return '@Grid(desktop: ' + settings.desktop + ', tablet: ' + settings.tablet + ', mobile: ' + settings.mobile + ') {\n' + columns + '\n}'; } return value; }
    function setStatus(message) { status.textContent = message; clearTimeout(setStatus.timer); setStatus.timer = setTimeout(() => status.textContent = 'Saved locally in editor', 900); }
    function syncRaw() { input.value = serialize(); }
    function updateBlock(id, key, value) { const block = state.blocks.find(item => item.id === id); if (!block) return; block[key] = value; syncRaw(); setStatus('Updated'); }
    function escapeHTML(value) { return value.replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character])); }
    function inlineMarkdown(value) { let html = escapeHTML(value); html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>'); html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<u>$1</u>').replace(/~~([^~]+)~~/g, '<del>$1</del>').replace(/\*([^*]+)\*/g, '<em>$1</em>'); return html; }
    function renderPreviewBlock(block) { let element; if (block.type === 'heading') { element = document.createElement(`h${block.level}`); element.innerHTML = inlineMarkdown(block.value); } else if (block.type === 'text') { element = document.createElement('p'); element.innerHTML = inlineMarkdown(block.value); } else if (block.type === 'image') { element = document.createElement('img'); element.src = block.value; element.alt = block.alt || ''; } else if (block.type === 'video') { element = document.createElement('video'); element.src = block.value; element.controls = true; } else if (block.type === 'code') { element = document.createElement('pre'); const code = document.createElement('code'); code.textContent = block.value; element.append(code); } else if (block.type === 'html') { element = document.createElement('div'); element.innerHTML = block.value; } else if (block.type === 'grid') { const settings = block.settings || { desktop: 3, tablet: 2, mobile: 1 }; element = document.createElement('div'); element.className = 'preview-grid'; element.style.setProperty('--grid-desktop', settings.desktop); element.style.setProperty('--grid-tablet', settings.tablet); element.style.setProperty('--grid-mobile', settings.mobile); (block.columns || []).forEach(column => { const columnElement = document.createElement('div'); columnElement.className = 'preview-grid-column'; (column.blocks || []).forEach(child => columnElement.append(renderPreviewBlock(child))); element.append(columnElement); }); } else { element = document.createElement('pre'); element.className = 'preview-custom'; element.textContent = serializeBlock(block); } return element; }
    function renderPreview() { previewContent.innerHTML = ''; if (!state.blocks.length) { previewContent.innerHTML = '<div class="preview-empty">Nothing to preview yet.</div>'; return; } state.blocks.forEach(block => previewContent.append(renderPreviewBlock(block))); }
    function makeGridBlock() { return Object.assign(newBlock('grid', ''), { settings: { desktop: 3, tablet: 2, mobile: 1 }, columnCount: 3, columns: [0, 1, 2].map(() => ({ blocks: [] })) }); }
    function ensureGridColumns(block) { block.columns = block.columns || []; block.columnCount = Math.max(1, Math.min(12, block.columnCount || block.columns.length || 1)); while (block.columns.length < block.columnCount) block.columns.push({ blocks: [] }); }
    function updateGridColumn(id, index, value) { const block = state.blocks.find(item => item.id === id); if (!block) return; if (!block.columns) block.columns = []; while (block.columns.length <= index) block.columns.push({ blocks: [] }); block.columns[index].blocks = parseMarkdown(value); syncRaw(); setStatus('Updated'); }
    function renderBlockContent(body, block, update) {
      if (block.type === 'heading') { const toolbar = document.createElement('div'); toolbar.className = 'heading-toolbar'; toolbar.setAttribute('aria-label', 'Heading level'); toolbar.innerHTML = [1,2,3,4,5,6].map(level => `<button type="button" class="${level === block.level ? 'active' : ''}" data-level="${level}" title="Heading ${level}">H${level}</button>`).join(''); toolbar.querySelectorAll('[data-level]').forEach(button => button.addEventListener('click', () => { update('level', Number(button.dataset.level)); render(); })); const field = document.createElement('input'); field.value = block.value; field.placeholder = 'Heading text…'; field.setAttribute('aria-label', 'Heading text'); field.addEventListener('input', e => update('value', e.target.value)); body.append(toolbar, field); }
      else if (block.type === 'html') { const field = document.createElement('textarea'); field.className = 'html-editor'; field.value = block.value; field.placeholder = '<div>Raw HTML…</div>'; field.setAttribute('aria-label', 'Raw HTML'); field.addEventListener('input', e => update('value', e.target.value)); body.append(field); }
      else if (block.type === 'code') { const language = document.createElement('input'); language.className = 'code-language'; language.value = block.language; language.placeholder = 'Language (e.g. swift)'; language.setAttribute('aria-label', 'Code language'); language.addEventListener('input', e => update('language', e.target.value)); const field = document.createElement('textarea'); field.className = 'code-editor'; field.value = block.value; field.placeholder = 'Paste or type code…'; field.setAttribute('aria-label', 'Code'); field.addEventListener('input', e => update('value', e.target.value)); body.append(language, field); }
