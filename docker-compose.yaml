name: feather-cms

services:
  application-artifacts:
    image: feather-cms-application-artifacts
    command: ["/bin/true"]
    restart: "no"
    build:
      context: .
      dockerfile: ./docker/application/Dockerfile
      target: application-artifacts

  certificates:
    build:
      context: .
      dockerfile: ./docker/certificates/Dockerfile
    volumes:
      - certificates:/certs
    restart: "no"

  postgres:
    build:
      context: .
      dockerfile: ./docker/postgres/Dockerfile
    depends_on:
      certificates:
        condition: service_completed_successfully
    volumes:
      - certificates:/certs
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test:
        - CMD-SHELL
        - |
          sh -c "pg_isready -d '
            host=127.0.0.1
            sslmode=verify-ca
            sslrootcert=/certs/ca.pem
            user=$${POSTGRES_USER}
            password=$${POSTGRES_PASSWORD}
            dbname=$${POSTGRES_DB}
          '"
      interval: 1s
      timeout: 5s
      retries: 10

  floci:
    image: floci/floci:latest-compat
    ports:
      - "${FLOCI_PUBLISHED_PORT:-4566}:4566"
    restart: always
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_DEFAULT_REGION: ${STORAGE_S3_REGION:-us-east-1}
      FLOCI_INIT_HOOKS_TIMEOUT_SECONDS: 120
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-feather-cms-app}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      MEDIA_CLOUDFRONT_ALIAS: ${MEDIA_CLOUDFRONT_ALIAS:-feather-media.localhost.floci.io}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-no-reply@feather.local}
    volumes:
      - ./docker/floci/init/ready.d:/etc/floci/init/ready.d:ro
      - ./deployment/cloudfront:/opt/feather/cloudfront:ro
      - floci-data:/app/data
    healthcheck:
      test: ["CMD", "test", "-f", "/app/data/.feather-ready"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s

  server:
    image: feather-cms-server
    build:
      context: .
      dockerfile: ./docker/application-runtime/Dockerfile
      target: server
      additional_contexts:
        artifacts: service:application-artifacts
    depends_on:
      certificates:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      floci:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    user: "0:0"
    volumes:
      - certificates:/certs
    ports:
      - "8080:8080"
    environment:
      SERVER_HTTP_HOST: 0.0.0.0
      SERVER_HTTP_PORT: 8080
      SERVER_QUEUE_NAME: feather-cms-worker
      SERVER_QUEUE_POLL_TIME_MS: 100
      MEDIA_MAX_CONCURRENT_PROCESSING: 1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ENDPOINT: http://floci:4566
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-feather-cms-app}
      STORAGE_OBJECT_KEY_DEPTH: ${STORAGE_OBJECT_KEY_DEPTH:-2}
      STORAGE_OBJECT_KEY_SEGMENT_LENGTH: ${STORAGE_OBJECT_KEY_SEGMENT_LENGTH:-2}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://feather-media.localhost.floci.io:${FLOCI_PUBLISHED_PORT:-4566}}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_ROOT_CA_PATH: /certs/does-not-exist.pem

  migrator:
    image: feather-cms-migrator
    depends_on:
      certificates:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./docker/application-runtime/Dockerfile
      target: migrator
      additional_contexts:
        artifacts: service:application-artifacts
    user: "0:0"
    volumes:
      - certificates:/certs
    restart: "no"
    environment:
      WEB_PUBLIC_BASE_URL: ${WEB_PUBLIC_BASE_URL:-http://localhost:3456}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_ROOT_CA_PATH: /certs/does-not-exist.pem

  worker:
    image: feather-cms-worker
    build:
      context: .
      dockerfile: ./docker/application-runtime/Dockerfile
      target: worker
      additional_contexts:
        artifacts: service:application-artifacts
    depends_on:
      certificates:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      floci:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    user: "0:0"
    volumes:
      - certificates:/certs
    entrypoint:
      - /app/Worker
    restart: always
    environment:
      WORKER_QUEUE_NAME: feather-cms-worker
      WORKER_POLL_TIME_MS: 100
      WORKER_NUM_WORKERS: 16
      WORKER_GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS: 10
      WORKER_SCHEDULER_NAME: feather-cms-worker
      WORKER_CLEANUP_COMPLETED_MAX_AGE_SECONDS: 86400
      WORKER_CLEANUP_HOURLY_MINUTE: 52
      WORKER_CLEANUP_PROCESSING_INTERVAL_MINUTES: 5
      WORKER_CLEANUP_PROCESSING_MAX_JOBS: 100
      WORKER_SCHEDULER_LOCK_EVERY_SECONDS: 300
      WORKER_SCHEDULER_LOCK_FOR_SECONDS: 360
      WORKER_RUN_MIGRATIONS: "true"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ENDPOINT: http://floci:4566
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-feather-cms-app}
      STORAGE_OBJECT_KEY_DEPTH: ${STORAGE_OBJECT_KEY_DEPTH:-2}
      STORAGE_OBJECT_KEY_SEGMENT_LENGTH: ${STORAGE_OBJECT_KEY_SEGMENT_LENGTH:-2}
      SES_REGION: ${SES_REGION:-eu-central-1}
      SES_ENDPOINT: http://floci:4566
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_ROOT_CA_PATH: /certs/does-not-exist.pem

  web-app:
    build:
      context: .
      dockerfile: ./docker/application-runtime/Dockerfile
      target: web-app
      additional_contexts:
        artifacts: service:application-artifacts
    depends_on:
      - server
    ports:
      - "3456:3456"
    environment:
      HTTP_SERVER_NAME: web-app
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3456
      API_BASE_URL: http://server:8080
      WEB_PUBLIC_BASE_URL: ${WEB_PUBLIC_BASE_URL:-http://localhost:3456}
      STATIC_PUBLIC_BASE_URL: ${STATIC_PUBLIC_BASE_URL:-http://localhost:4567}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://feather-media.localhost.floci.io:${FLOCI_PUBLISHED_PORT:-4566}}

  web-static:
    build:
      context: .
      dockerfile: ./docker/application-runtime/Dockerfile
      target: web-static
      additional_contexts:
        artifacts: service:application-artifacts
    ports:
      - "4567:4567"
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 4567
      HTTP_SERVER_NAME: static

  openapi-app:
    image: swaggerapi/swagger-ui:v5.32.15
    ports:
      - "8888:8080"
    environment:
      SWAGGER_JSON: /app/web/web-app.yaml
    volumes:
      - ./modules/cms-account-module/openapi/:/app/account/:ro
      - ./modules/cms-analytics-module/openapi/:/app/analytics/:ro
      - ./modules/cms-auth-module/openapi/:/app/auth/:ro
      - ./modules/cms-blog-module/openapi/:/app/blog/:ro
      - ./modules/cms-contact-module/openapi/:/app/contact/:ro
      - ./modules/cms-media-module/openapi/:/app/media/:ro
      - ./modules/cms-news-module/openapi/:/app/news/:ro
      - ./modules/cms-newsletter-module/openapi/:/app/newsletter/:ro
      - ./modules/cms-redirect-module/openapi/:/app/redirect/:ro
      - ./modules/cms-system-module/openapi/:/app/system/:ro
      - ./modules/cms-user-module/openapi/:/app/user/:ro
      - ./modules/cms-web-module/openapi/:/app/web/:ro

  openapi-admin:
    image: swaggerapi/swagger-ui:v5.32.15
    ports:
      - "8889:8080"
    environment:
      SWAGGER_JSON: /app/system/system-admin.yaml
    volumes:
      - ./modules/cms-account-module/openapi/:/app/account/:ro
      - ./modules/cms-analytics-module/openapi/:/app/analytics/:ro
      - ./modules/cms-auth-module/openapi/:/app/auth/:ro
      - ./modules/cms-blog-module/openapi/:/app/blog/:ro
      - ./modules/cms-contact-module/openapi/:/app/contact/:ro
      - ./modules/cms-media-module/openapi/:/app/media/:ro
      - ./modules/cms-news-module/openapi/:/app/news/:ro
      - ./modules/cms-newsletter-module/openapi/:/app/newsletter/:ro
      - ./modules/cms-redirect-module/openapi/:/app/redirect/:ro
      - ./modules/cms-system-module/openapi/:/app/system/:ro
      - ./modules/cms-user-module/openapi/:/app/user/:ro
      - ./modules/cms-web-module/openapi/:/app/web/:ro

volumes:
  certificates:
    name: feather-cms-certificates
  postgres-data:
    name: feather-cms-postgres-data
  floci-data:
    name: feather-cms-floci-data
